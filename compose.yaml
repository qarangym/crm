# Рабочий состав: база, приложение и обратный прокси (TLS). Вход — в приложении:
# почта, пароль и код на почту (src/server/login.ts).
#
# Наружу открыт только прокси. Порт приложения и порт базы не публикуются:
# сеть backend помечена internal, поэтому контейнеры в ней недоступны извне.
#
# Запуск:  docker compose up -d --build
# Миграции: docker compose exec app npm run migrate

name: qtr-crm

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-qtr}
      POSTGRES_PASSWORD: ${PGPASSWORD:?задайте PGPASSWORD в .env}
      POSTGRES_DB: ${PGDATABASE:-qtr_crm}
      # Хранение данных вне каталога инициализации тома.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-qtr} -d ${PGDATABASE:-qtr_crm}"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    image: ${QTR_IMAGE:-qtr-crm:0.1.0}
    environment:
      # Приложение — под ролью qtr_app без права менять схему и журнал (deploy/db-app-role.sql),
      # если задан APP_DB_PASSWORD; иначе — под владельцем базы.
      DATABASE_URL: postgres://${APP_DB_USER:-qtr_app}:${APP_DB_PASSWORD:-}@db:5432/${PGDATABASE:-qtr_crm}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      DATABASE_URL_OWNER: postgres://${PGUSER:-qtr}:${PGPASSWORD}@db:5432/${PGDATABASE:-qtr_crm}
      MIGRATION_DATABASE_URL: postgres://${PGUSER:-qtr}:${PGPASSWORD}@db:5432/${PGDATABASE:-qtr_crm}
      APP_ORIGIN: ${APP_ORIGIN:?укажите внешний адрес, например https://crm.example.kz}
      AUTH_SECRET: ${AUTH_SECRET:?сгенерируйте секрет: openssl rand -hex 32}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AUTH_SELF_REGISTRATION: ${AUTH_SELF_REGISTRATION:-true}
      # Демонстрационный стенд (npm run seed:scenario): код входа на экране. На рабочем контуре — false.
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SSO_ENABLED: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-false}
      TRUST_PROXY: "true"
      STORAGE_ROOT: /data/storage
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-CRM ОР ПСД <no-reply@localhost>}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      JOBS_INTERVAL_MINUTES: ${JOBS_INTERVAL_MINUTES:-15}
      # Антивирусная проверка вложений: clamd ДИТ либо off (по умолчанию).
      ANTIVIRUS: ${ANTIVIRUS:-off}
      CLAMD_HOST: ${CLAMD_HOST:-127.0.0.1}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
    volumes:
      - app-files:/data/storage
    expose: ["3000"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped

  gateway:
    image: nginx:stable-alpine
    ports:
      - "${BIND_ADDR:-0.0.0.0}:80:80"
      - "${BIND_ADDR:-0.0.0.0}:443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:?укажите домен, например crm.example.kz}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_started
    networks: [frontend, backend]
    restart: unless-stopped

volumes:
  db-data:
    name: ${QTR_DB_VOLUME:-qtr-crm-db}
  app-files:
    name: ${QTR_FILES_VOLUME:-qtr-crm-files}

networks:
  frontend:
  backend:
    internal: true

# Конфигурация nginx для установки без Docker.
#
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/qtr-crm
#   sudo ln -s /etc/nginx/sites-available/qtr-crm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените перед применением:
#   crm.example.kz            — домен системы
#   ОБЩИЙ_СЕКРЕТ_ИЗ_ENV       — значение AUTH_PROXY_SHARED_SECRET из .env
#
# Приложение доверяет заголовкам X-QTR-* только при совпадении секрета, поэтому
# прокси обязан затирать эти заголовки, пришедшие снаружи, и подставлять свои.

server {
    listen 80;
    server_name crm.example.kz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Запись совместима с nginx 1.24 из Ubuntu 24.04 (директива `http2 on` — с 1.25.1).
    listen 443 ssl http2;
    server_name crm.example.kz;

    ssl_certificate     /etc/letsencrypt/live/crm.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($host != "crm.example.kz") { return 444; }

    # Служебные маршруты корпоративного входа (oauth2-proxy на localhost:4180).
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
        proxy_set_header Authorization "";
    }

    location = /_qtr_auth {
        internal;
        proxy_pass http://127.0.0.1:4180/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    # Проверка доступности без входа — для мониторинга.
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-QTR-Proxy-Key "";
        proxy_set_header X-QTR-User-Id "";
        proxy_set_header X-QTR-User-Email "";
        proxy_set_header X-QTR-User-Name "";
    }

    location / {
        auth_request /_qtr_auth;
        error_page 401 = @signin;

        auth_request_set $qtr_user   $upstream_http_x_auth_request_user;
        auth_request_set $qtr_email  $upstream_http_x_auth_request_email;
        auth_request_set $qtr_name   $upstream_http_x_auth_request_preferred_username;
        auth_request_set $qtr_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $qtr_cookie always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header X-QTR-Proxy-Key "ОБЩИЙ_СЕКРЕТ_ИЗ_ENV";
        proxy_set_header X-QTR-User-Id    $qtr_user;
        proxy_set_header X-QTR-User-Email $qtr_email;
        proxy_set_header X-QTR-User-Name  $qtr_name;
        proxy_set_header Authorization "";
    }

    location @signin {
        return 302 https://$host/oauth2/start?rd=$request_uri;
    }
}

# Конфигурация nginx для установки без Docker.
#
#   sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/qtr-crm
#   sudo ln -s /etc/nginx/sites-available/qtr-crm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Замените перед применением: crm.example.kz — домен системы.
#
# Вход — в самом приложении (почта, пароль, код на почту). nginx отвечает за TLS,
# ограничение частоты и стирает служебные заголовки X-QTR-*, пришедшие снаружи:
# они нужны только для необязательного корпоративного входа (SSO_ENABLED).

# Вход, регистрация и восстановление пароля: не чаще 10 запросов в минуту с адреса
# (плюс собственные ограничения приложения).
limit_req_zone $binary_remote_addr zone=qtr_auth:10m rate=10r/m;

server {
    listen 80;
    server_name crm.example.kz;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Запись совместима с nginx 1.24 из Ubuntu 24.04 (директива `http2 on` — с 1.25.1).
    listen 443 ssl http2;
    server_name crm.example.kz;

    ssl_certificate     /etc/letsencrypt/live/crm.example.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($host != "crm.example.kz") { return 444; }

    # Общие настройки передачи в приложение.
    proxy_http_version 1.1;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-QTR-Proxy-Key "";
    proxy_set_header X-QTR-User-Id "";
    proxy_set_header X-QTR-User-Email "";
    proxy_set_header X-QTR-User-Name "";

    location /api/v1/auth/ {
        limit_req zone=qtr_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

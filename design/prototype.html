<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявки ОР ПСД — АО «Казтелерадио»</title>
<style>
/* inline: shell.css */
/*
 * Общее оформление: рабочее место ОР ПСД и портал допусков.
 * Вынесено из index.html без изменений, чтобы оба модуля выглядели одинаково.
 */
:root{
  /* Палитра перенесена из действующего прототипа QTR CRM и старого прототипа доски. */
  --blue:#003399; --blue-deep:#00246B; --blue-hover:#0045D9; --yellow:#FFCC00;
  /* Второстепенный текст — не ниже 4,5:1 на белом и на фонах колонок (WCAG AA). */
  --ink:#17243B; --muted:#5F6878; --muted-2:#646C7A;
  --line:#E6EAF1; --bg:#F3F5F9; --surface:#FFFFFF;
  --ok:#0E9F6E; --warn:#D98A00; --bad:#D6323C;
  /* Те же состояния для текста на светлых плашках: --ok/--warn годятся для заливок и значков, не для букв. */
  --ok-ink:#067A52; --warn-ink:#9A5B00; --bad-ink:#B4232D;
  --tint:#EDF2FB; --tint-2:#EAF0FC;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(23,36,59,.06), 0 8px 24px rgba(23,36,59,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--blue);text-decoration:none}
button{font:inherit;cursor:pointer}
/* Касание без задержки двойного нажатия и с фирменной подсветкой вместо серой. */
a,button,input,select,textarea,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,51,153,.12)}
/* Фокус с клавиатуры виден на любом элементе управления. */
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.nav button.on:focus-visible,.nav a.on:focus-visible,.btn.primary:focus-visible{outline-color:var(--yellow)}
/* Переход к содержимому — первым по Tab, виден только при фокусе. */
.skip-link{position:fixed;left:12px;top:-60px;z-index:90;background:var(--blue);color:#fff;font-weight:600;
  padding:9px 14px;border-radius:var(--r-sm)}
.skip-link:focus{top:12px}
#view:focus{outline:0}
/* Действие строки таблицы: ссылка или кнопка в первой ячейке, щелчок по строке — то же самое (shell.js). */
.row-link{cursor:pointer}
.row-main{color:inherit}
.row-main:hover b,.row-main:focus-visible b{color:var(--blue);text-decoration:underline;text-underline-offset:2px}
.link-btn{border:0;background:none;padding:0;color:inherit;text-align:left}
/* Выбор файла под кнопкой-подписью: поле скрыто визуально, но доступно с клавиатуры. */
label.btn{position:relative;cursor:pointer}
.file-pick{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn:focus-within{outline:2px solid var(--blue);outline-offset:2px}

/* ------------------------------- каркас ------------------------------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand img{width:46px;height:auto;flex:none;border-radius:7px}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand small{color:var(--muted);font-size:11.5px}
.side-label{font-size:11.5px;letter-spacing:.08em;color:var(--muted-2);font-weight:700;padding:14px 8px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.nav a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--ink);text-align:left;font-size:14px}
.nav button:hover,.nav a:hover{background:var(--tint)}
.nav button.on{background:var(--blue);color:#fff}
.nav button .i,.nav a .i{flex:none;color:var(--muted)}
.nav button:hover .i,.nav a:hover .i{color:var(--blue)}
.nav button.on .i{color:var(--yellow)}
.nav button .badge{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--bad);color:#fff;
  border-radius:20px;padding:1px 7px}
.nav button.on .badge{background:rgba(255,255,255,.22)}
.nav button .badge.calm{background:#DCE5F6;color:var(--blue)}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border-bottom:1px solid #F1F4F9;cursor:pointer;color:inherit}
.task:last-child{border-bottom:0}
.task:hover{background:#FAFBFE}
.task .k{flex:none;min-width:118px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.task .t{flex:1;min-width:0}
.task .t b{display:block;font-size:13.5px;font-weight:600}
.task .t small{color:var(--muted);font-size:12px}
.task .d{flex:none;text-align:right;font-size:12px}
@media (max-width:760px){.task{flex-wrap:wrap}.task .k{min-width:0;width:100%}.task .d{text-align:left}}

/* Иконки наследуют цвет текста и выравниваются по базовой линии подписи. */
.i{flex:none;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;gap:7px}
.btn .i{color:currentColor;opacity:.85}

.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 26px;
  display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.top .eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--muted-2);font-weight:700}
.top h1{font-size:23px;margin-top:2px}
.top p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.top .sp{flex:1}
.whoami{font-size:12px;color:var(--muted);text-align:right;line-height:1.35;max-width:260px}
.whoami b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.whoami:empty{display:none}
.wrap{padding:22px 26px 44px}

/* ------------------------------ элементы ------------------------------ */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:8px 14px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:#C9D3E4;background:#FAFBFE}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12.5px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.panel-head h2{font-size:16px}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.panel-body{padding:18px}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;
  font-size:12px;font-weight:700;background:var(--tint);color:var(--blue);white-space:nowrap}
.chip.g{background:#E7F6EF;color:var(--ok-ink)}
.chip.w{background:#FDF3E2;color:var(--warn-ink)}
.chip.r{background:#FBEAEB;color:var(--bad-ink)}
.chip.n{background:#F1F3F7;color:var(--muted)}
.chip.svc-tu{background:#E8EEFB;color:var(--blue)}
.chip.svc-psd{background:#EFEAFB;color:#5B3FBF}
.chip.svc-smr{background:#FFF6DA;color:#8A6500}

.ref{font-size:12px;color:var(--muted-2)}
.ref.pin{display:inline-block;border:1px dashed #D6DEEC;border-radius:6px;padding:1px 6px;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.04em;color:var(--muted-2);font-weight:700;
  padding:10px 12px;border-bottom:1px solid var(--line);text-transform:uppercase}
td{padding:11px 12px;border-bottom:1px solid #F1F4F9;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFE}
.num{text-align:right;font-variant-numeric:tabular-nums}

.meter{display:block;height:6px;border-radius:20px;background:#EDF0F6;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:20px}
.meter.w i{background:var(--warn)} .meter.r i{background:var(--bad)} .meter.g i{background:var(--ok)}

/* -------------------------------- доска -------------------------------- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
select,input[type=search],input[type=date],input[type=month]{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;
  font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);min-width:150px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{flex:0 0 262px;background:#EEF1F7;border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:9px}
.col-head{display:flex;align-items:flex-start;gap:8px;padding:2px 4px 8px}
.col-head .no{width:20px;height:20px;border-radius:6px;background:var(--surface);color:var(--muted);
  display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.col-head b{font-size:13px;display:block;line-height:1.3}
.col-head .sla{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.col-head .owner{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;
  background:var(--surface);border-radius:20px;padding:1px 7px;color:var(--blue)}
.col-head .cnt{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);
  background:var(--surface);border-radius:20px;padding:1px 8px}
.card{display:block;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;
  box-shadow:0 1px 2px rgba(23,36,59,.05);transition:border-color .15s,transform .15s}
.card:hover,.card:focus-visible{border-color:#BFCDE6;transform:translateY(-1px)}
.card .id{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-bottom:6px}
.card .id b{font-size:12px;letter-spacing:.01em}
.card .cust{font-size:13.5px;font-weight:600;line-height:1.3}
.card .obj{font-size:12px;color:var(--muted);margin-top:3px}
.card .foot{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.card.late{border-left:3px solid var(--bad)}
.card .who{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--ink)}
.card .who .ref{font-size:11.5px}
.ava{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;flex:none;
  background:#E6EDFA;color:var(--blue);font-size:10.5px;font-weight:800;letter-spacing:0}
.ava.none{background:#FBEAEB;color:var(--bad)}
.card.warn{border-left:3px solid var(--warn)}
.col-empty{color:var(--muted-2);font-size:12.5px;text-align:center;padding:14px 0}
.owner-customer{background:#FFF6DA;color:#8A6500}

/* ------------------------------ показатели ----------------------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow)}
.kpi .big{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .big small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi span{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}

.bar-row{display:grid;grid-template-columns:200px 1fr 92px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #F1F4F9}
.bar-row:last-child{border-bottom:0}
.bar-row .lbl b{font-size:13px;display:block}
.bar-row .lbl small{font-size:12px;color:var(--muted-2)}
.track{position:relative;height:22px;background:#F1F4F9;border-radius:6px;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--blue);opacity:.85}
.track .norm{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.track .norm::after{content:'норматив';position:absolute;top:-14px;left:4px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.bar-row .val{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bar-row .val small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.hot i{background:var(--bad)} .mid i{background:var(--warn)}

/* ------------------------------- карточка ------------------------------ */
.sheet{position:fixed;inset:0;background:rgba(15,23,40,.35);display:none;z-index:40}
.sheet.on{display:block}
.sheet-panel{position:absolute;right:0;top:0;bottom:0;width:min(720px,94vw);background:var(--bg);
  overflow:auto;overscroll-behavior:contain;scroll-padding-top:120px;box-shadow:-12px 0 40px rgba(15,23,40,.18)}
.sheet-panel:focus{outline:0}
.sheet-head{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 22px;position:sticky;top:0;z-index:2}
.sheet-head .row{display:flex;align-items:center;gap:10px}
.sheet-head h2{font-size:19px}
.sheet-body{padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:168px 1fr;gap:8px 14px;font-size:13.5px}
.kv b{color:var(--muted);font-weight:600}
.route{display:flex;gap:4px;margin:12px 0 4px;flex-wrap:wrap}
.route i{flex:1;min-width:14px;height:6px;border-radius:20px;background:#E4E9F2}
.route i.done{background:var(--blue);opacity:.45}
.route i.cur{background:var(--blue)}
.route i.skip{background:#EFF2F7;border:1px dashed #D8DFEA;height:6px}
.gate{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--surface)}
.gate h4{font-size:13px;margin-bottom:9px}
.gate .item{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px;border-bottom:1px solid #F4F6FA}
.gate .item:last-child{border-bottom:0}
.gate .item .st{width:17px;height:17px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#fff;background:var(--bad);margin-top:1px}
.gate .item.ok .st{background:var(--ok)}
.gate .item .tx{flex:1}
.gate .item .tx small{display:block;color:var(--muted-2);font-size:11px;margin-top:1px}
.blocked{background:#FBEAEB;border:1px solid #F3CFD1;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#8B2A2F}
.hist{display:flex;flex-direction:column}
.hist .e{display:grid;grid-template-columns:118px 1fr;gap:12px;font-size:12.5px;padding:8px 0;border-bottom:1px solid #F4F6FA}
.hist .e time{color:var(--muted-2)}
.hist .e:last-child{border-bottom:0}

/* ------------------------------- правила ------------------------------- */
.tog{width:34px;height:19px;border-radius:20px;background:#D9DFEA;position:relative;display:inline-block;flex:none;border:0;padding:0;vertical-align:middle}
button.tog:hover{background:#C9D3E4} button.tog.on:hover{background:var(--blue-hover)}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--blue)} .tog.on::after{left:17px}
.note{background:var(--tint);border-left:3px solid var(--blue);border-radius:0 9px 9px 0;
  padding:11px 14px;font-size:12.5px;color:#2B3B57}
.hidden{display:none}

/* --------------------------- мастер заявки --------------------------- */
.wizard{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media(max-width:1180px){.wizard{grid-template-columns:1fr}}
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.steps div{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.steps div .n{width:20px;height:20px;border-radius:50%;background:#E7ECF5;color:var(--muted);
  display:grid;place-items:center;font-size:11px;font-weight:800}
.steps div.cur{border-color:var(--blue);color:var(--blue);font-weight:700}
.steps div.cur .n{background:var(--blue);color:#fff}
.steps div.passed{color:var(--ok-ink);border-color:#CCEADC}
.steps div.passed .n{background:var(--ok);color:#fff}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .span2{grid-column:1/-1}
@media(max-width:760px){.form-grid{grid-template-columns:1fr}}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
.field textarea{min-height:74px;resize:vertical}
/* Поле в фокусе: синяя рамка и мягкий ореол — видно и с клавиатуры, и после щелчка. */
.field input:focus-visible,.field textarea:focus-visible,.field select:focus-visible{outline:2px solid var(--blue);outline-offset:0;
  border-color:var(--blue);box-shadow:0 0 0 4px var(--tint-2)}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--bad);background:#FFFBFB}
.field .err{display:none;font-size:11.5px;color:var(--bad);margin-top:4px}
.field.bad .err{display:block}
.field .hint{font-size:11.5px;color:var(--muted-2);margin-top:4px}
.field .ok-mark{float:right;color:var(--ok-ink);font-size:11.5px;font-weight:700}

.svc-pick{display:flex;gap:10px;flex-wrap:wrap}
.svc-pick label{flex:1;min-width:190px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;
  background:var(--surface);cursor:pointer;display:flex;gap:11px;align-items:flex-start}
.svc-pick label.on{border-color:var(--blue);background:var(--tint);box-shadow:0 0 0 1px var(--blue) inset}
.svc-pick input{margin-top:3px}
.svc-pick b{display:block;font-size:14px}
.svc-pick small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.svc-block{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px}
.svc-block>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.svc-block>div{padding:16px}

.price{position:sticky;top:18px}
.price .line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #F1F4F9;font-size:13px}
.price .line:last-of-type{border-bottom:0}
.price .line small{display:block;color:var(--muted-2);font-size:11px}
.price .total{display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--line);margin-top:8px;padding-top:11px;font-size:15px;font-weight:800}
.price .disclaimer{background:#FDF3E2;border-radius:9px;padding:10px 12px;font-size:11.5px;color:#7A5200;margin-top:12px}

.review-grid{display:grid;grid-template-columns:200px 1fr;gap:9px 16px;font-size:13.5px}
.review-grid b{color:var(--muted);font-weight:600}

/* --------------------------- реестр АМС и ТВ --------------------------- */
.tv{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media(max-width:1180px){.tv{grid-template-columns:1fr}}
.tier{display:block;width:100%;text-align:left;color:inherit;border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.tier:hover{border-color:#BFCDE6}
.tier.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.tier b{font-size:13.5px}
.tier .ref{display:block;margin:3px 0 7px}
.verdict{border-radius:11px;padding:13px 15px;font-size:13px;margin-top:14px;border:1px solid}
.verdict b{display:block;margin-bottom:4px;font-size:13.5px}
.verdict.g{background:#F0FAF5;border-color:#CCEADC;color:#0B6E4F}
.verdict.w{background:#FDF7EC;border-color:#F2DFBD;color:#7A5200}
.verdict.r{background:#FDF2F2;border-color:#F3CFD1;color:#8B2A2F}

/* --------------------------- полоса режима --------------------------- */
/* Элемент действующего прототипа: постоянно видно, рабочие это данные или примеры. */
.mode-bar{display:flex;align-items:center;gap:11px;border-radius:var(--r);padding:11px 16px;margin-bottom:18px;
  border:1px solid #F2DFBD;background:linear-gradient(180deg,#FEFAF1,#FDF5E7)}
.mode-bar .i{color:var(--warn)}
.mode-bar b{font-size:13px;color:#7A5200}
.mode-bar span{font-size:12.5px;color:#8A6500;opacity:.85}
.mode-bar .tail{margin-left:auto;font-size:11.5px;color:#8A6500;display:flex;align-items:center;gap:6px}

/* --------------------------- шапка портала --------------------------- */
.portal-intro{display:flex;gap:26px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 26px;margin-bottom:18px;box-shadow:var(--shadow)}
.portal-intro img{width:104px;height:auto;flex:none}
.portal-intro h2{font-size:19px;margin-bottom:5px}
.portal-intro p{margin:0;color:var(--muted);font-size:13.5px;max-width:560px}
.portal-steps{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.wiz-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.portal-steps div{display:flex;gap:9px;align-items:flex-start;background:var(--tint);border-radius:11px;
  padding:11px 14px;min-width:172px}
.portal-steps span{font-size:11px;font-weight:800;color:var(--blue);opacity:.55}
.portal-steps b{display:block;font-size:12.5px}
.portal-steps small{color:var(--muted);font-size:11.5px}
@media(max-width:1180px){.portal-intro{flex-wrap:wrap}.portal-steps{margin-left:0;width:100%}}

/* --------------------------- замечания --------------------------- */
.remark{display:flex;gap:10px;align-items:flex-start;border:1px solid #F2DFBD;background:#FDF7EC;
  border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:8px}
.remark .fld{font-weight:700;color:#7A5200;white-space:nowrap}

/* ------------------ состояния загрузки и уведомления ------------------ */
.mode-bar.live{border-color:#CCEADC;background:linear-gradient(180deg,#F4FBF7,#EDF8F2)}
.mode-bar.live .i{color:var(--ok)}
.mode-bar.live b{color:#0B6E4F}
.mode-bar.live span,.mode-bar.live .tail{color:#137A59}

.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--blue);display:inline-block;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;
  display:none;align-items:center;gap:9px;max-width:min(680px,92vw);
  background:var(--ink);color:#fff;border-radius:11px;padding:12px 16px;font-size:13.5px;
  box-shadow:0 10px 30px rgba(15,23,40,.28)}
.toast .i{color:var(--yellow);flex:none}
.toast.good{background:#0E6B4C}
.toast.good .i{color:#A8E6C9}
.toast.bad{background:#8B2A2F}
.toast.bad .i{color:#FFD3D5}

.btn:disabled{opacity:.55;cursor:not-allowed}
.btn[aria-busy="true"]{cursor:progress}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ------------------------------ диалог ------------------------------ */
/* Замена window.prompt: причина, сумма, дата вводятся в форме с проверкой. */
.dlg{position:fixed;inset:0;background:rgba(15,23,40,.42);display:grid;place-items:center;z-index:70;padding:16px}
.dlg{overscroll-behavior:contain}
.dlg-box{background:var(--surface);border-radius:var(--r);box-shadow:0 20px 60px rgba(15,23,40,.3);
  width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;overscroll-behavior:contain}
.dlg-box header{padding:16px 18px;border-bottom:1px solid var(--line)}
.dlg-box header h3{font-size:16px}
.dlg-box header p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.dlg-box .body{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.dlg-box footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* ------------------------ вспомогательное ------------------------ */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.muted{color:var(--muted)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cp{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #F4F6FA;font-size:13px}
.cp:last-child{border-bottom:0}
.cp .st{width:18px;height:18px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:800;
  color:#fff;background:#C9D3E4;margin-top:1px}
.cp.ok .st{background:var(--ok)}
.timeline{display:flex;flex-direction:column;gap:0}
.timeline .t{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid #F4F6FA;font-size:13px}
.timeline .t:last-child{border-bottom:0}
.menu-toggle{display:none}

/* ------------------------ телефон (С15) ------------------------ */
/* Работа «в командировках»: поиск и скачивание актов, статус заявки с телефона. */
@media(max-width:760px){
  .app{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:55;transform:translateX(-105%);
    transition:transform .2s;box-shadow:12px 0 40px rgba(15,23,40,.18);overscroll-behavior:contain;
    padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .side.open{transform:none}
  .menu-toggle{display:inline-flex}
  .top{padding:12px 16px;gap:10px;align-items:center}
  .top h1{font-size:19px}
  .top p{display:none}
  .wrap{padding:14px 16px 32px}
  .panel-body{padding:14px}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv b{margin-top:8px}
  .review-grid{grid-template-columns:1fr}
  .panel-body > table, section.panel > .panel-body > table{display:block;overflow-x:auto;white-space:nowrap}
  table{font-size:12.5px}
  .sheet-panel{width:100%}
  .sheet-head,.sheet-body{padding-left:14px;padding-right:14px}
  .bar-row{grid-template-columns:1fr 70px}
  .bar-row .track{grid-column:1/-1;order:3}
  .kpis{grid-template-columns:1fr 1fr}
  .portal-intro{padding:16px}
  .portal-intro img{width:72px}
  .filters select,.filters input[type=search]{min-width:0;flex:1 1 140px}
  #exportBtn span,#bellBtn span{display:none}
  .whoami{display:none}
  /* Палец, а не мышь: элементы управления не ниже 40 px. */
  .btn,select,input:not([type=checkbox]):not([type=radio]),textarea{min-height:40px}
  .btn{justify-content:center}
  .portal-intro{gap:12px}
  .portal-intro img{width:48px}
  .portal-intro h2{display:none}
  .portal-steps{display:none}
  /* Шаги мастера — одной строкой с прокруткой; текущий шаг прокручивается в видимую часть (index.html). */
  .steps{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}
  .steps div{flex:none}
  /* Главное действие мастера — первым и во всю ширину. */
  .wiz-actions .btn.primary{order:-1;flex:1 1 100%}
  .wiz-actions .sp-grow{display:none}
  /* Главные таблицы внешних пользователей на телефоне — карточками: всё видно без прокрутки вбок. */
  table.stack-sm,table.stack-sm tbody{display:block}
  section.panel .panel-body table.stack-sm{white-space:normal;overflow:visible}
  table.stack-sm thead{display:none}
  table.stack-sm tr{display:block;padding:12px 8px;border-bottom:1px solid var(--line)}
  table.stack-sm tr:last-child{border-bottom:0}
  table.stack-sm td{display:block;border:0;padding:3px 0}
  table.stack-sm td:empty{display:none}
  table.stack-sm td.num{text-align:left}
}
/* Колокольчик уведомлений */
.bell-host{position:relative}
.bell{position:relative;padding:7px 9px}
.bell-n{position:absolute;top:1px;right:1px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;
  font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bell-n[hidden]{display:none}
.bell-panel{position:absolute;right:0;top:calc(100% + 6px);width:min(380px,92vw);max-height:70vh;overflow:auto;overscroll-behavior:contain;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(15,23,40,.18);z-index:60}
.bell-panel[hidden]{display:none}
.bell-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.bell-item{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-bottom:1px solid #F1F4F9;color:var(--ink);text-decoration:none;font-size:12.5px}
.bell-item.new{background:var(--tint)}
.bell-item b{font-size:13px}
.bell-item span{color:var(--muted)}
.bell-item time{font-size:11px;color:var(--muted-2)}
.chip.b{background:#E8EEFB;color:var(--blue)}

/* Демонстрационный стенд (DEMO_MODE): полоса над страницей. */
.demo-ribbon{position:sticky;top:0;z-index:30;background:#F6C344;color:#3A2E05;font-size:12px;font-weight:600;text-align:center;
  padding:4px 12px;letter-spacing:.01em}

/* Справка и приветствие */
.help-box{max-width:560px}
.help-box .body{max-height:65vh;overflow:auto}
.help-box h4{font-size:14px;margin:0 0 6px}
.help-box ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.45}
.help-box section + section{border-top:1px solid var(--line);padding-top:12px}

/* Пользователь попросил меньше движения: без вращения, сдвигов и плавных переходов. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  .card:hover,.card:focus-visible{transform:none}
  .spinner{animation:none;border-top-color:var(--line);border-color:var(--blue) var(--line) var(--line)}
}

</style>
</head>

<script>
/* inline: api.js */
/**
 * Клиент API.
 *
 * Единственное место, где интерфейс обращается к серверу. Здесь же разбор
 * ошибок: сервер возвращает машинный код и — при нарушении Регламента —
 * перечень невыполненных условий со ссылками на пункты, который нужно показать
 * пользователю дословно.
 */
(function () {
  const BASE = '/api/v1';

  /** Ошибка API: несёт код состояния, машинный код и подробности. */
  class ApiError extends Error {
    constructor(message, status, code, details) {
      super(message);
      this.name = 'ApiError';
      this.status = status;
      this.code = code;
      /** Ошибки по полям формы — для подсветки. */
      this.fields = details?.fields ?? null;
      /** Невыполненные условия Регламента со ссылками на пункты. */
      this.failures = details?.failures ?? null;
    }
    /** Заявку правит кто-то ещё — нужно перечитать карточку. */
    get isConflict() { return this.status === 409; }
    get isForbidden() { return this.status === 403; }
    get isUnauthorized() { return this.status === 401; }
  }

  async function request(method, path, options = {}) {
    const init = { method, headers: {}, credentials: 'same-origin' };

    if (options.body instanceof FormData) {
      // Content-Type проставит браузер вместе с границей multipart.
      init.body = options.body;
    } else if (options.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(options.body);
    }

    let res;
    try {
      res = await fetch(BASE + path, init);
    } catch (cause) {
      // Сеть недоступна — отличаем от ответа сервера с ошибкой.
      throw new ApiError('Сервер недоступен. Проверьте соединение.', 0, 'network_error');
    }

    if (res.status === 204) return null;

    const isJson = (res.headers.get('content-type') || '').includes('application/json');
    const payload = isJson ? await res.json().catch(() => null) : null;

    if (!res.ok) {
      throw new ApiError(
        payload?.error || `Ошибка ${res.status}`,
        res.status,
        payload?.code || 'unknown',
        payload,
      );
    }
    return payload;
  }

  const query = (params = {}) => {
    const search = new URLSearchParams();
    for (const [key, value] of Object.entries(params)) {
      if (value !== undefined && value !== null && value !== '') search.set(key, String(value));
    }
    const text = search.toString();
    return text ? `?${text}` : '';
  };

  window.QTR_API = {
    ApiError,
    /** Произвольный вызов: портал допусков строит свои методы поверх него. */
    call: (method, path, body) => request(method, path, body === undefined ? {} : { body }),
    query,
    base: BASE,

    health: () => request('GET', '/health'),
    config: () => request('GET', '/config'),
    me: () => request('GET', '/me'),

    facilities: () => request('GET', '/facilities'),
    /** Карточка объекта с ярусами и арендаторами — для оценки ТВ (п. 16.2). */
    facility: (id) => request('GET', `/facilities/${id}`),
    tariffs: () => request('GET', '/tariffs'),

    requests: (params) => request('GET', '/requests' + query(params)),
    request: (id) => request('GET', `/requests/${id}`),
    /** «Мои задачи» сотрудника и нагрузка команды (п. 102). */
    tasks: (user) => request('GET', '/tasks' + query({ user })),
    tasksCount: () => request('GET', '/tasks/count'),
    tasksLoad: () => request('GET', '/tasks/load'),
    /** Замещение на время отсутствия (src/server/people.ts). */
    absences: () => request('GET', '/absences'),
    saveAbsence: (body) => request('POST', '/absences', { body }),
    deleteAbsence: (id) => request('POST', `/absences/${id}/delete`, { body: {} }),
    colleagues: () => request('GET', '/colleagues'),
    /** Тексты писем в справочнике (src/server/templates.ts). */
    mailTemplates: () => request('GET', '/mail-templates'),
    saveMailTemplate: (key, body) => request('POST', `/mail-templates/${key}`, { body }),
    /** Ответственный ОР ПСД, исполнитель этапа и кому их можно передать (п. 102). */
    executors: (id) => request('GET', `/requests/${id}/executors`),
    setExecutor: (id, body) => request('POST', `/requests/${id}/executor`, { body }),
    createRequest: (body) => request('POST', '/requests', { body }),
    /** Входящий номер и дата регистрации делопроизводством (п. 6). */
    register: (id, body) => request('POST', `/requests/${id}/registration`, { body }),
    /** Переход по этапу — единственный способ сменить этап. */
    transition: (id, body) => request('POST', `/requests/${id}/transition`, { body }),
    /** Фиксация оценки ТВ с версией мастер-файла (п. 16.5). */
    setTv: (id, body) => request('POST', `/requests/${id}/tv`, { body }),
    /** Расчёт ТВ сервером по мастер-файлу; сохраняется с версией реестра (пп. 16.2, 16.5). */
    capacityCheck: (id, tierId) => request('POST', `/requests/${id}/capacity-check`, { body: { tierId } }),
    capacityChecks: (id) => request('GET', `/requests/${id}/capacity-checks`),
    /** Возврат на доработку с перечнем замечаний (ТЗ №11). */
    addRemarks: (id, remarks) => request('POST', `/requests/${id}/remarks`, { body: { remarks } }),
    /** Исправление заявки по замечаниям и повторная отправка (ТЗ №11). */
    amendRequest: (id, body) => request('PATCH', `/requests/${id}`, { body }),
    resubmit: (id) => request('POST', `/requests/${id}/resubmit`, { body: {} }),
    resolveRemark: (id, remarkId, note) =>

    /** Договор на услугу заявки (пп. 21, 32, 48) и оплата по нему (пп. 86, 88). */
    addContract: (id, body) => request('POST', `/requests/${id}/contracts`, { body }),

    terminateContract: (contractId, body) => request('POST', `/contracts/${contractId}/terminate`, { body }),
    /** Смета, распоряжение, передача результата, АВР и приёмка (пп. 41, 60, 24, 91, 94). */
    setFlags: (id, body) => request('POST', `/requests/${id}/flags`, { body }),
    /** Продление срока этапа с основанием (пп. 33, 45). */
    extendStage: (id, body) => request('POST', `/requests/${id}/extension`, { body }),

    /** Поручения по зарегистрированным заявкам (ТЗ №7, №8). */
    assignments: (params) => request('GET', '/assignments' + query(params)),
    acceptAssignment: (id) => request('POST', `/assignments/${id}/accept`, { body: {} }),
    closeAssignment: (id, body) => request('POST', `/assignments/${id}/close`, { body }),
    assignmentsExportUrl: () => `${BASE}/assignments/export`,

    /** Служебные записки в филиал (п. 10). */
    memos: (params) => request('GET', '/memos' + query(params)),
    createMemo: (id, body) => request('POST', `/requests/${id}/memos`, { body }),
    answerMemo: (memoId, answer) => request('POST', `/memos/${memoId}/answer`, { body: { answer } }),

    board: () => request('GET', '/board'),
    metrics: () => request('GET', '/metrics'),

    documents: (params) => request('GET', '/documents' + query(params)),
    document: (id) => request('GET', `/documents/${id}`),
    uploadDocument: (form) => request('POST', '/documents', { body: form }),
    replaceFile: (id, form) => request('POST', `/documents/${id}/versions`, { body: form }),
    approveDocument: (id) => request('POST', `/documents/${id}/approve`, { body: {} }),
    deleteDocument: (id) => request('POST', `/documents/${id}/delete`, { body: {} }),
    /** Ссылка на файл: скачивание идёт обычным переходом, чтобы работал диалог сохранения. */

<script>
/* inline: phone.js */
/**
 * Телефон РК: маска «+7 XXX XXX XX XX» при вводе и проверка номера.
 *
 * Поле всегда начинается с «+7 », цифры раскладываются по группам по мере
 * ввода. Вставка «8 701 …», «+7701…», «87011234567» приводится к тому же виду.
 * Принимаются только номера Казахстана: после +7 идёт 7 (мобильные 7XX и
 * городские 7XXX). Та же проверка — на сервере (src/domain/validation.ts).
 *
 * Подключение: <script src="phone.js"><\/script>, затем QTR_PHONE.attach(input)
 * либо обработчики onInput/onKeydown/onFocus/onBlur прямо в разметке.
 */
(function () {
  const PREFIX = '+7 ';

  /** Десять цифр номера без кода страны. */
  function digitsOf(value) {
    let text = String(value ?? '').trim();
    if (text.startsWith('+7')) text = text.slice(2);
    let d = text.replace(/\D/g, '');
    // Вставлен полный номер: «8 701 …» или «7 701 …».
    if (d.length === 11 && (d[0] === '8' || d[0] === '7')) d = d.slice(1);
    // Привычная «восьмёрка» в начале: номера РК после +7 с 8 не начинаются.
    if (d[0] === '8') d = d.slice(1);
    return d.slice(0, 10);
  }

  /** «7011234567» → «+7 701 123 45 67»; незаконченный номер — по мере ввода. */
  function format(value) {
    const d = digitsOf(value);
    if (!d) return '';
    const parts = [d.slice(0, 3), d.slice(3, 6), d.slice(6, 8), d.slice(8, 10)].filter(Boolean);
    return PREFIX + parts.join(' ');
  }

  /** Пустая строка — номер верный, иначе — что не так. */
  function problem(value) {
    const d = digitsOf(value);
    if (!d) return 'Укажите телефон';
    if (d.length < 10) return 'Номер неполный: +7 XXX XXX XX XX';
    if (d[0] !== '7') return 'Номер Казахстана начинается с +7 7…';
    if (/(\d)\1{7}/.test('7' + d)) return 'Проверьте номер';
    return '';
  }

  function onInput(el) {
    const next = format(el.value) || PREFIX;
    if (el.value !== next) el.value = next;
    el.setSelectionRange(el.value.length, el.value.length);
  }

  /** Стирание: удаляется цифра, а не пробел-разделитель; «+7 » не стирается. */
  function onKeydown(event) {
    const el = event.target;
    if (event.key !== 'Backspace' || el.selectionStart !== el.selectionEnd || el.selectionEnd !== el.value.length) return;
    event.preventDefault();
    const d = digitsOf(el.value).slice(0, -1);
    el.value = format(d) || PREFIX;
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function onFocus(el) {
    if (!el.value) el.value = PREFIX;
    requestAnimationFrame(() => el.setSelectionRange(el.value.length, el.value.length));
  }

  function onBlur(el) {
    if (!digitsOf(el.value)) el.value = '';
  }

  function attach(el) {
    el.type = 'tel';
    el.inputMode = 'tel';
    el.autocomplete = 'tel';
    el.maxLength = 16;
    el.placeholder = '+7 7XX XXX XX XX';
    if (el.value) el.value = format(el.value);
    el.addEventListener('input', () => onInput(el));
    el.addEventListener('keydown', onKeydown);
    el.addEventListener('focus', () => onFocus(el));
    el.addEventListener('blur', () => onBlur(el));
  }

  window.QTR_PHONE = { attach, format, problem, digitsOf, onInput, onKeydown, onFocus, onBlur };
})();

</script>

const icon = (name, size = 18) =>
  `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true">${ICONS[name] || ''}</svg>`;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Дата без года — только для текущего года: на рубеже лет «05 янв.» путается (Н5). */
const fmt = (d) => {
  if (!d) return '—';
  const date = new Date(String(d).slice(0, 10) + 'T12:00:00Z');
  if (Number.isNaN(date.getTime())) return '—';
  const sameYear = date.getUTCFullYear() === new Date().getFullYear();
  return date.toLocaleDateString('ru-RU', sameYear ? { day: '2-digit', month: 'short' } : { day: '2-digit', month: '2-digit', year: 'numeric' });
};
const fmtFull = (d) => d ? new Date(String(d).slice(0, 10) + 'T12:00:00Z').toLocaleDateString('ru-RU') : '—';

/* ---------------------------------- вход --------------------------------- */

/** Нет сессии — на страницу входа с возвратом туда, где был пользователь. */
function toLogin() {
  location.replace('/login.html?next=' + encodeURIComponent(location.pathname + location.search + location.hash));
}

/** Выход: сессия закрывается на сервере, cookie стирается. */
async function logout() {
  try { await window.QTR_API.call('POST', '/auth/logout'); } catch { /* сессия уже закрыта */ }
  location.replace('/login.html');
}

/* -------------------------------- диалог -------------------------------- */

/**
 * Диалог с полями вместо window.prompt (К2): причина отказа, сумма возврата,
 * дата, текст поручения. Обязательные поля проверяются до отправки.
 * Возвращает объект значений или null, если пользователь отказался.
 */
function ask({ title, text = '', fields = [], ok = 'Подтвердить', danger = false }) {
  return new Promise((resolve) => {
    const box = document.createElement('div');
    box.className = 'dlg';
    const input = (f) => {
      const id = 'dlg-' + f.key;
      const common = `id="${id}" ${f.required ? 'required' : ''}`;
      if (f.type === 'textarea') return `<textarea ${common} name="${esc(f.key)}" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>`;
      if (f.type === 'select') return `<select ${common}>${(f.options || []).map((o) =>
        `<option value="${esc(o.value)}" ${String(o.value) === String(f.value ?? '') ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
      return `<input ${common} name="${esc(f.key)}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.ph || '')}"
        autocomplete="off" ${f.max ? `max="${f.max}"` : ''} ${f.min !== undefined ? `min="${f.min}"` : ''}>`;
    };
    const titleId = 'dlg-title-' + (++dialogSeq);
    // Форма: Enter в поле подтверждает, как кнопка.
    box.innerHTML = `<form class="dlg-box" role="dialog" aria-modal="true" aria-labelledby="${titleId}" novalidate>
      <header><h3 id="${titleId}">${esc(title)}</h3>${text ? `<p>${text}</p>` : ''}</header>
      <div class="body">${fields.map((f) => `<div class="field" data-key="${f.key}">
        <label for="dlg-${f.key}">${esc(f.label)}${f.required ? '' : ' <span class="ref">необязательно</span>'}</label>${input(f)}
        ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}<div class="err"></div></div>`).join('')}</div>
      <footer><button type="button" class="btn" data-act="cancel">Отмена</button>
        <button type="submit" class="btn ${danger ? '' : 'primary'}" data-act="ok" ${danger ? 'style="border-color:var(--bad);color:var(--bad)"' : ''}>${esc(ok)}</button></footer>
    </form>`;
    const release = holdModal(box);
    const close = (value) => { box.remove(); release(); resolve(value); };
    box.addEventListener('click', (ev) => {
      if (ev.target === box || ev.target.closest('[data-act="cancel"]')) close(null);
    });
    box.querySelector('form').addEventListener('submit', (ev) => {
      ev.preventDefault();
      const values = {};
      let bad = false;
      for (const f of fields) {
        const el = box.querySelector('#dlg-' + f.key);
        const value = el.value.trim();
        const wrap = box.querySelector(`[data-key="${f.key}"]`);
        const problem = f.required && !value ? 'Заполните поле'
          : f.minLength && value && value.length < f.minLength ? `Не менее ${f.minLength} символов` : '';
        wrap.classList.toggle('bad', !!problem);
        wrap.querySelector('.err').textContent = problem;
        if (problem) bad = true;
        values[f.key] = value;
      }
      if (!bad) close(values);
      else focusFirstError(box);
    });
    box.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { ev.preventDefault(); close(null); } });
    document.body.appendChild(box);
    box.querySelector('input,textarea,select')?.focus();
  });
}
let dialogSeq = 0;

/* --------------------------- сообщения и ошибки -------------------------- */

/** Показ ошибки API: нарушения Регламента выводятся со ссылками на пункты. */
function describeError(error) {
  if (!error) return '';
  if (error.failures?.length) {
    return error.failures.map((f) => `${f.message} (${f.regulationRef})`).join('; ');
  }
  if (error.fields) {
    return `${error.message}: ${Object.values(error.fields).join('; ')}`;
  }
  return error.message;
}

/* Сообщение внизу экрана. Область объявлений создаётся заранее и пустой — иначе экранный диктор
   пропускает первое сообщение. Пока указатель на сообщении, оно не исчезает. */
let toastTimer = null;
function toastBox() {
  let box = document.getElementById('toast');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toast';
    box.className = 'toast';
    box.setAttribute('role', 'status');
    box.setAttribute('aria-live', 'polite');
    box.setAttribute('aria-atomic', 'true');
    box.addEventListener('mouseenter', () => clearTimeout(toastTimer));
    box.addEventListener('mouseleave', () => {
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { box.style.display = 'none'; }, 2500);
    });
    document.body.appendChild(box);
  }
  return box;
}
function toast(text, kind = 'info') {
  const box = toastBox();
  box.className = 'toast ' + kind;
  // Ошибку диктор объявляет сразу, остальное — закончив фразу.
  box.setAttribute('aria-live', kind === 'bad' ? 'assertive' : 'polite');
  box.innerHTML = `${icon(kind === 'bad' ? 'warn' : 'check', 16)}<span>${esc(text)}</span>`;
  box.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.style.display = 'none'; }, kind === 'bad' ? 7000 : 3500);
}


/* ------------------------------ колокольчик ------------------------------
   Уведомления в системе: копия каждого письма пользователю. Кнопка в шапке,
   число непрочитанных, список с переходом в карточку. Опрос раз в минуту. */

let bellTimer = null;
function mountBell(host) {
  if (!host) return;
  const api = window.QTR_API;
  host.innerHTML = `<button class="btn ghost bell" aria-label="Уведомления" title="Уведомления" aria-expanded="false"
      aria-controls="bellPanel">${icon('bell', 18)}<span class="bell-n" hidden></span></button>
    <div class="bell-panel" id="bellPanel" role="region" aria-label="Уведомления" hidden></div>`;
  const button = host.querySelector('.bell');
  const badge = host.querySelector('.bell-n');
  const panel = host.querySelector('.bell-panel');
  const show = (n) => {
    badge.hidden = !n;
    badge.textContent = n > 99 ? '99+' : String(n);
    button.setAttribute('aria-label', n ? `Уведомления: непрочитанных ${n}` : 'Уведомления');
  };
  const hide = () => { panel.hidden = true; button.setAttribute('aria-expanded', 'false'); };
  const refresh = async () => { try { show((await api.call('GET', '/inbox/count')).unread); } catch { /* сеть */ } };
  const when = (v) => new Date(v).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  async function open() {
    panel.hidden = false;
    button.setAttribute('aria-expanded', 'true');
    panel.innerHTML = '<div class="ref" style="padding:14px">Загрузка…</div>';
    try {
      const { items, unread } = await api.call('GET', '/inbox?limit=40');
      show(unread);
      panel.innerHTML = `<div class="bell-head"><b>Уведомления</b>
        ${unread ? '<button class="btn ghost sm" data-all>Прочитать все</button>' : ''}</div>
        ${items.length ? items.map((i) => `<a class="bell-item ${i.read_at ? '' : 'new'}" data-id="${i.id}" href="${esc(i.link || '#')}">
          <b>${esc(i.subject)}</b><span>${esc(String(i.body || '').split('\n')[0].slice(0, 160))}</span><time>${when(i.created_at)}</time></a>`).join('')
          : '<div class="ref" style="padding:14px">Уведомлений нет</div>'}`;
    } catch (error) {
      panel.innerHTML = `<div class="ref" style="padding:14px">${esc(describeError(error))}</div>`;
    }
  }
  button.addEventListener('click', (ev) => { ev.stopPropagation(); panel.hidden ? open() : hide(); });
  // Escape закрывает список и возвращает фокус на колокольчик.
  host.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Escape' || panel.hidden) return;
    ev.preventDefault();
    hide();
    button.focus();
  });
  panel.addEventListener('click', async (ev) => {
    ev.stopPropagation();
    if (ev.target.closest('[data-all]')) {
      show((await api.call('POST', '/inbox/read', { all: true })).unread);
      return open();
    }
    const item = ev.target.closest('.bell-item');
    if (!item) return;
    if (item.getAttribute('href') === '#') ev.preventDefault();
    hide();
    // По ссылке переходит сам браузер; адрес («#ЗК-…», «#ЗД-…») открывает карточку в приложении (popstate).
    // Отметка «прочитано» — в фоне, чтобы не задерживать переход.
    api.call('POST', '/inbox/read', { ids: [Number(item.dataset.id)] }).then((r) => show(r.unread)).catch(() => {});
  });
  document.addEventListener('click', hide);
  refresh();
  clearInterval(bellTimer);
  bellTimer = setInterval(refresh, 60_000);
}

/* ------------------------------ модальные окна ------------------------------
   Пока открыт диалог или карточка, остальная страница «инертна»: Tab не уходит за окно,
   экранный диктор не читает фон. После закрытия фокус возвращается туда, откуда открыли. */

function holdModal(el) {
  const opener = document.activeElement;
  // Сообщения (toast) не глушим: они должны звучать и поверх окна.
  const muted = [...document.body.children].filter((x) => x !== el && !x.inert && x.tagName !== 'SCRIPT' && x.id !== 'toast');
  muted.forEach((x) => { x.inert = true; });
  return () => {
    muted.forEach((x) => { x.inert = false; });
    if (opener && opener !== document.body && opener.isConnected && !opener.closest('[inert]')) opener.focus({ preventScroll: true });
  };
}

/** Фокус на первое поле с ошибкой — после неудачной проверки формы. */
function focusFirstError(root = document) {
  // Сначала само поле; если в блоке с ошибкой поля нет (список отметок), — весь блок.
  const bad = root.querySelector('.field.bad input:not([type=hidden]), .field.bad select, .field.bad textarea')
    || root.querySelector('.field.bad, .blocked');
  if (!bad) return;
  if (!bad.matches('input,select,textarea')) bad.setAttribute('tabindex', '-1');
  bad.focus();
}

/**
 * Боковая карточка (#sheet) — модальное окно: имя из заголовка, фокус внутрь при открытии
 * и обратно при закрытии. Карточку открывают из многих мест добавлением класса «on»,
 * поэтому за открытием следим здесь, а не в каждом из них.
 */
function watchSheet() {
  const sheet = document.getElementById('sheet');
  const panel = document.getElementById('sheetPanel');
  if (!sheet || !panel) return;
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'true');
  panel.tabIndex = -1;
  let release = null;
  new MutationObserver(() => {
    const open = sheet.classList.contains('on');
    if (open && !release) {
      release = holdModal(sheet);
      panel.scrollTop = 0;
      panel.focus({ preventScroll: true });
    } else if (!open && release) {
      release();
      release = null;
    }
  }).observe(sheet, { attributes: true, attributeFilter: ['class'] });
  new MutationObserver(() => {
    const heading = panel.querySelector('h2');
    if (heading) {
      heading.id ||= 'sheetTitle';
      panel.setAttribute('aria-labelledby', heading.id);
    }
    // Содержимое перерисовано вместе с полем в фокусе — фокус остаётся в карточке, а не уходит на страницу.
    if (release && (document.activeElement === document.body || !document.activeElement)) panel.focus({ preventScroll: true });
  }).observe(panel, { childList: true });
}

/* Escape: сначала закрывается верхнее — меню на телефоне, затем карточка. Диалоги и колокольчик
   закрываются своими обработчиками и отменяют событие. */
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape' || ev.defaultPrevented || document.querySelector('.dlg')) return;
  const side = document.querySelector('.side.open');
  if (side) {
    side.classList.remove('open');
    document.querySelector('.menu-toggle')?.focus();
    return;
  }
  if (document.getElementById('sheet')?.classList.contains('on') && typeof closeSheet === 'function') {
    ev.preventDefault();
    closeSheet();
  }
});

/* ---------------------------- ссылки и строки ----------------------------
   Карточка заявки, задача, строка реестра — настоящие ссылки на адрес в приложении:
   доходят с клавиатуры, Ctrl+щелчок и колесо мыши открывают новую вкладку.
   Обычный щелчок выполняет действие на месте, без перезагрузки. */

/** Щелчок без клавиш-модификаторов — действие внутри приложения. */
const plainClick = (ev) => ev.button === 0 && !(ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey);

/** Ссылка с действием: адрес для новой вкладки, `action` — код для обычного щелчка. */
const appLink = (href, action, inner, attrs = '') =>
  `<a href="${esc(href)}" ${attrs} onclick="if(plainClick(event)){event.preventDefault();${esc(action)}}">${inner}</a>`;

/* Строка .row-link откликается на щелчок целиком, но действие у неё одно — .row-main в первой ячейке.
   Щелчок по своим ссылкам и кнопкам строки и выделение текста мышью строку не открывают. */
document.addEventListener('click', (ev) => {
  const row = ev.target.closest('.row-link');
  if (!row || ev.target.closest('a,button,input,select,textarea,label')) return;
  if (String(window.getSelection?.() || '')) return;
  row.querySelector('.row-main')?.click();
});

/* ------------------------------- поля форм -------------------------------
   Подпись связывается с полем (щелчок по подписи ставит курсор, диктор читает её), ошибка
   и подсказка — с полем через aria-describedby, поле с ошибкой помечено aria-invalid.
   Разметку рисуют десятки шаблонов, поэтому связи проставляются после каждой отрисовки. */

let fieldSeq = 0;
const CONTROL = 'input:not([type=hidden]),select,textarea';
function linkFields() {
  for (const label of document.querySelectorAll('label:not([for])')) {
    if (label.querySelector(CONTROL) || !label.parentElement) continue;
    const control = [...label.parentElement.querySelectorAll(CONTROL)].find((c) =>
      label.compareDocumentPosition(c) & Node.DOCUMENT_POSITION_FOLLOWING && !c.closest('label'));
    if (!control) continue;
    control.id ||= 'fld-' + (++fieldSeq);
    label.htmlFor = control.id;
  }
  for (const field of document.querySelectorAll('.field')) {
    const control = field.querySelector(CONTROL);
    if (!control) continue;
    const bad = field.classList.contains('bad');
    const notes = [...field.querySelectorAll(':scope > .hint, :scope > .err')].filter((n) => n.classList.contains('hint') || bad);
    notes.forEach((n) => { n.id ||= 'fld-note-' + (++fieldSeq); });
    const ids = notes.map((n) => n.id).join(' ');
    if (ids) control.setAttribute('aria-describedby', ids); else control.removeAttribute('aria-describedby');
    if (bad) control.setAttribute('aria-invalid', 'true'); else control.removeAttribute('aria-invalid');
  }
}
let fieldsQueued = false;
function watchFields() {
  new MutationObserver(() => {
    if (fieldsQueued) return;
    fieldsQueued = true;
    queueMicrotask(() => { fieldsQueued = false; linkFields(); });
  }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
  linkFields();
}

if (document.body) {
  toastBox();
  watchSheet();
  watchFields();
}

  loaded: new Set(),

const can = (permission) => !state.live || !!state.me?.permissions?.includes(permission);

const stageBy = Object.fromEntries(C.stages.map(s => [s.code, s]));

const today = () => new Date().toISOString().slice(0, 10);
const money = n => n == null ? 'по смете' : new Intl.NumberFormat('ru-RU').format(n) + ' ₸';

/* Остаток срока в рабочих днях — та же логика, что в src/domain/calendar.ts */
function daysLeft(due) {
  const a = new Date(today() + 'T12:00:00Z'), b = new Date(due + 'T12:00:00Z');
  const back = b < a; const from = back ? b : a, to = back ? a : b;
  let n = 0; const cur = new Date(from);
  while (cur < to) { cur.setUTCDate(cur.getUTCDate() + 1);
    if (![0,6].includes(cur.getUTCDay())) n++; }
  return back ? -n : n;
}
function slaChip(r) {
  const s = stageBy[r.stageCode];
  if (s?.terminal) {
    const cls = { done: 'g', rejected: 'r' }[s.customerStatus] || 'n';
    return `<span class="chip ${r.stageCode === 'closed_done' ? 'g' : r.stageCode === 'closed_rejected' ? 'r' : 'n'}">${esc(s.short)}${r.closedAt ? ' ' + fmt(r.closedAt) : ''}</span>`;
  }
  if (r.stageCode === 'draft') return '<span class="chip n">черновик</span>';
  const n = daysLeft(r.dueAt);
  if (n < 0) return `<span class="chip r">просрочка ${-n} дн.${r.escalationLevel ? ' · эск. ' + r.escalationLevel : ''}</span>`;
  if (n === 0) return '<span class="chip w">срок сегодня</span>';
  if (n <= 3) return `<span class="chip w">${n} дн.</span>`;
  return `<span class="chip g">${n} дн.</span>`;
}

const iso10 = (v) => (v ? String(v).slice(0, 10) : null);

function adaptRequest(r) {

    id: r.uuid,

    tvRecheckRequired: !!r.tvRecheckRequired,
    services: r.services || [],
    stageCode: r.stageCode,

    amount: r.totalAmount === null || r.totalAmount === undefined ? null : Number(r.totalAmount),

    incomingDate: iso10(r.incomingDate),

    // Договор и оплата — по каждой услуге (пп. 21, 32, 48, 59).
    contracts: r.contracts || [],
    freeServices: r.freeServices || [],
    contractNumber: (r.contracts || []).map((c) => c.number).join(', ') || null,
    paidAt: (r.contracts || []).length && r.contracts.every((c) => c.paidAt)
      ? r.contracts.map((c) => c.paidAt).sort().at(-1) : null,
    estimateApproved: r.estimateApproved,
    orderNumber: r.orderNumber,
    transferAct: iso10(r.transferActApprovedDate),
    technicalAvrApproved: r.technicalAvrApproved,
    avrApproved: r.avrApproved,
    avrSentAt: iso10(r.avrSentAt),
    avrObjection: r.avrObjection,
    resultDelivered: r.resultDelivered,
    closingConfirmed: r.closingConfirmed,
    openRemarks: Number(r.openRemarks || 0),
    escalationLevel: Number(r.escalationLevel || 0),
    version: r.version,
    bin: '',

    registrationConfirmedBy: r.registrationConfirmedBy || null,
    // Исполнители (п. 102): ответственный ОР ПСД ведёт заявку, исполнитель этапа действует сейчас.
    responsibleId: r.responsibleId || null,

/** Первичная загрузка: определяем режим и получаем то, что нужно всем экранам. */
async function boot() {
  try {
    C = await api.config();
    state.me = await api.me();
    state.live = true;
    document.getElementById('logoutBtn').style.display = '';
    document.getElementById('logoutBtn').title = `Выйти (${state.me.email})`;
    // Кто вошёл — в шапке, а не полосой над каждым экраном.
    document.getElementById('whoami').innerHTML = `<b>${esc(state.me.fullName)}</b>${esc(state.me.roles.map((r) => ROLE_LABEL[r] || r).join(', '))}`;
    mountBell(document.getElementById('bellHost'));
    mountDemoRibbon(state.me);
    // Подрядчику доступен только портал допусков: сразу туда.
    const modules = state.me.modules || [];
    if (modules.includes('permits') && !modules.includes('orpsd')) { location.replace('/dopusk/'); return; }
    mountHelp(document.getElementById('helpHost'), state.me, 'orpsd');
  } catch (error) {
    state.loading = false;
    if (error.status === 401) { toLogin(); return; }
    if (error.status === 0) {
      // Сервер недоступен — например, файл открыт прямо с диска.
      // Это нормальный демонстрационный режим на встроенных примерах.
      state.live = false;
      state.error = null;
      render();
      return;
    }
    // Сервер ответил отказом: показывать вместо рабочих данных примеры нельзя —
    // пользователь решит, что видит настоящие заявки.
    renderAccessDenied(error);
    return;
  }

  const initial = routeOf();
  try {
    D = { requests: [], facilities: [], tariffs: [], documents: [], branches: [], metrics: null };
    // Стартовый экран по роли: Заказчику — «Мои заявки» (В1).
    if (isCustomerUser()) view = 'mine';
    // Сотрудник начинает с «Моих задач»: то, что лежит именно на нём (п. 102).
    else if (state.live) { view = 'tasks'; api.tasksCount().then((c) => { D.tasksBadge = c; renderNav(); }).catch(() => {}); }
    else if (!viewAllowed(view)) view = [...MENU, ...MENU2, ...MENU3].map(([k]) => k).find(viewAllowed) || 'board';
    // Адрес из закладки, обновления страницы или письма: «#/board», «#/board?who=none», «#ЗК-2026-0001».
    if (initial.view && viewAllowed(initial.view)) view = initial.view;
    readFilters();
    if (can('documents.approve')) {
      D.pendingVisa = (await api.pendingCount().catch(() => ({ count: 0 }))).count;
    }
    await loadView(view, true);
  } catch (error) {
    state.error = error.message;
  } finally {
    state.loading = false;
    render();
  }
  if (!state.live) return;
  history.replaceState(null, '', '#/' + view + (initial.card ? '/' + initial.card : '') + filterQuery());
  window.addEventListener('popstate', applyRoute);
  if (initial.card) await withRoute(() => openSheet(initial.card));
}

/* ------------------------------ адрес в браузере ------------------------------
   Экран и открытая заявка записываются в адрес: работают «Назад» и «Вперёд» браузера, обновление
   страницы оставляет на месте, ссылка из письма или колокольчика («/#ЗК-2026-0001») открывает заявку. */

let routing = false;      // переход вызван самим адресом — новую запись в историю не добавлять
let cardInHistory = false; // карточка открыта изнутри системы — закрытие возвращает на шаг назад

function routeOf() {
  const h = decodeURIComponent(location.hash.slice(1));
  return { view: /^\/([a-z]+)/.exec(h)?.[1] || null, card: /ЗК-\d{4}-\d{4}/.exec(h)?.[0] || null };
}

async function withRoute(fn) {
  routing = true;
  try { await fn(); } finally { routing = false; }
}

function pushRoute(card = null) {
  if (routing || !state.live) return;
  const hash = '#/' + view + (card ? '/' + card : '') + filterQuery();
  if (location.hash === hash) return;
  history.pushState(null, '', hash);
  cardInHistory = !!card;
}

async function applyRoute() {
  const r = routeOf();
  await withRoute(async () => {
    const refilter = readFilters();
    if (r.view && r.view !== view && viewAllowed(r.view)) await go(r.view);
    else if (refilter) render();
    const open = document.getElementById('sheet').classList.contains('on');
    if (r.card && (!open || sheetRequest?.number !== r.card)) await openSheet(r.card);
    if (!r.card && open) closeSheet();
  });
}

/** Догрузка данных под конкретный экран. Повторно не запрашиваем. */
async function loadView(target, force = false) {
  if (!state.live) return;
  const need = async (key, loader) => {
    if (!force && state.loaded.has(key)) return;
    await loader();
    state.loaded.add(key);
  };

  // Доска и узкие места — только действующие заявки; реестр — по отбору (С10).
  const listParams = target === 'registry' ? { state: registryFilter.state || undefined, q: registryFilter.q || undefined }
    : ['board', 'bottlenecks'].includes(target) ? { state: 'open' } : {};
  const listKey = 'requests:' + JSON.stringify(listParams);
  const loadRequests = async () => {
    if (!force && state.loaded.has('requests') && state.loaded.has(listKey)) return;
    const { requests } = await api.requests({ limit: 300, ...listParams });
    D.requests = requests.map(adaptRequest);
    D.branches = [...new Set(D.requests.map((r) => r.branch))].filter(Boolean);
    for (const key of [...state.loaded]) if (key.startsWith('requests:')) state.loaded.delete(key);
    state.loaded.add('requests');
    state.loaded.add(listKey);
  };

  const loadCounterparties = () => need('counterparties', async () => {
    // Собственник оборудования выбирается из справочника контрагентов:
    // свободный ввод наименования ломает поиск и защиту от дублей.
    const { requests } = await api.requests({ limit: 300 });
    const seen = new Map();
    for (const r of requests) if (!seen.has(r.counterpartyId)) seen.set(r.counterpartyId, r.counterpartyName);
    D.counterparties = [...seen].map(([id, name]) => ({ id, name }));
  });

  const loadFacilities = () => need('facilities', async () => {
    const { facilities } = await api.facilities();
    D.facilities = facilities.map(adaptFacility);
    if (!D.branches.length) D.branches = [...new Set(D.facilities.map((f) => f.branch))];
  });

  if (['board', 'registry', 'mine'].includes(target)) await loadRequests();
  if (target === 'assignments') {
    await need('assignments', async () => {
      const { assignments } = await api.assignments({ status: assignmentFilter });
      D.assignments = assignments;
    });
  }
  if (target === 'reports') {
    await need('reports', async () => {
      if (!can('reports.view')) reportTab = 'branch';
      if (!(D.branchList || []).length) D.branchList = (await api.branches()).branches;
      if (reportTab === 'requests') D.report = await api.reportRequests(reportFilters);
      if (reportTab === 'branch') {
        if (!reportBranch.branch) reportBranch.branch = state.me?.branchId || D.branchList[0]?.id || '';
        D.report = await api.reportBranch(reportBranch);
        D.reportStatus = can('reports.view') ? await api.reportBranchStatus(D.report.period) : null;
      }
      if (reportTab === 'annual') D.report = await api.reportAnnual(reportYear);
    });
  }
  if (target === 'users') {
    await need('users', async () => {
      const [{ users }, { branches }] = await Promise.all([api.users(userQuery), api.branches()]);
      D.users = users;
      D.branchList = branches;
    });
  }
  if (target === 'tasks') {
    // Список сотрудника; руководитель может открыть задачи другого (из «Нагрузки команды»).
    D.tasks = await api.tasks(tasksUser === 'me' ? undefined : tasksUser);
    D.tasksBadge = tasksUser === 'me' ? D.tasks.counts : D.tasksBadge;
    D.absences = tasksUser === 'me' ? (await api.absences().catch(() => ({ absences: [] }))).absences : D.absences;
  }
  if (target === 'team') {
    D.team = (await api.tasksLoad()).people;
  }
  if (target === 'audit') {
    await need('audit', async () => {
      const { events } = await api.audit({ ...auditFilters, limit: AUDIT_PAGE });
      D.audit = events;
      D.auditMore = events.length === AUDIT_PAGE;
    });
  }
  if (target === 'monitoring') {
    await need('monitoring', async () => {
      D.escalations = await api.escalations();
      D.notifications = can('admin') ? await api.notifications(notificationFilter) : null;
    });
  }
  if (target === 'rules') {
    await need('rules', async () => { D.rules = (await api.rules()).rules; });
  }
  if (target === 'stages' && can('admin')) {
    await need('stages', async () => { D.adminStages = (await api.adminStages()).stages; });
  }
  if (target === 'memos') {
    await need('memos', async () => {
      const { memos } = await api.memos({ open: memoFilter === 'open' ? 1 : '' });
      D.memos = memos;
    });
  }
  if (target === 'bottlenecks') {
    await loadRequests();
    await need('metrics', async () => { D.metrics = await api.metrics(); });
  }
  if (target === 'archive') {
    await need('documents', async () => {
      const { documents } = await api.documents({ limit: 100 });
      D.documents = documents.map(adaptDocument);
    });
    if (can('documents.upload')) { await loadFacilities(); await loadCounterparties(); }
  }
  if (target === 'ams') {
    await loadFacilities();
    if (D.facilities.length) {
      if (!tv.inv || !D.facilities.some((f) => String(f.inv) === String(tv.inv))) tv.inv = String(D.facilities[0].inv);
      await loadFacilityDetails(tv.inv);
    }
    await need('registry', async () => {
      const [versions, changes] = await Promise.all([
        api.registryVersions().catch(() => ({ versions: [] })),
        api.registryChanges(true).catch(() => ({ changes: [] })),
      ]);
      D.registryVersions = versions.versions;
      D.registryChanges = changes.changes;
    });
    if (can('request.tv')) await loadRequests();
  }
  if (target === 'directories') await loadDirectory(force);
  if (target === 'new') {
    await loadFacilities();
    await need('tariffs', async () => {
      const { tariffs } = await api.tariffs();
      D.tariffs = tariffs.map((t) => ({
        id: t.id, service: t.service, name: t.name, unit: t.unit,
        amount: Number(t.amount), source: t.source, placement: t.placement || null, isDefault: !!t.is_default,
      }));
    });
  }
}

/** Ярусы и арендаторы объекта — нужны калькулятору ТВ (п. 16.2). */
async function loadFacilityDetails(inv) {
  const facility = D.facilities.find((f) => String(f.inv) === String(inv));
  if (!facility || facility.detailsLoaded) return;
  const data = await api.facility(facility.id);
  facility.detailsLoaded = true;
  facility.tiers = (data.tiers || []).map((t) => ({
    id: t.id,
    h: Number(t.height_m),
    cap: t.capacity_kg === null ? null : Number(t.capacity_kg),
    load: Number(t.occupied_kg || 0),
  }));
  facility.tenants = (data.tenants || []).map((t) => ({
    c: t.counterparty_name || '—',
    eq: t.equipment || '—',
    kg: Number(t.weight_kg || 0),
    m2: Number(t.windage_m2 || 0),
    kw: Number(t.power_kw || 0),
    tu: t.tu_number || '—',
  }));
  // Текущая загрузка объекта — сумма по ярусам, как в мастер-файле.
  facility.load = facility.tiers.reduce((sum, t) => sum + t.load, 0);
  facility.powerUsed = facility.tenants.reduce((sum, t) => sum + t.kw, 0);
}

/**
 * Экран отказа в доступе.
 * Показывается, когда сервер доступен, но вход не выполнен либо учётная запись
 * не заведена: подменять это демонстрационными данными нельзя — пользователь
 * принял бы примеры за настоящие заявки.
 */
function renderAccessDenied(error) {
  document.getElementById('view').innerHTML = `
    <section class="panel" style="max-width:640px;margin:40px auto">
      <div class="panel-body" style="text-align:center;padding:36px">
        <div style="width:52px;height:52px;border-radius:50%;background:#FBEAEB;color:var(--bad);
          display:grid;place-items:center;margin:0 auto 16px">${icon('warn', 26)}</div>
        <h2 style="font-size:19px">Доступ к системе не предоставлен</h2>
        <p style="color:var(--muted);margin:10px 0 0">${esc(error.message)}</p>
        <div class="note" style="margin-top:20px;text-align:left">
          Роли назначает Департамент информационных технологий. Укажите свою
          рабочую почту и подразделение — администратор заведёт учётную запись
          и выдаст права, предусмотренные для вашей роли.
        </div>
        <button class="btn primary" style="margin-top:18px" onclick="location.reload()">
          ${icon('refresh', 15)} Проверить снова</button>
      </div>
    </section>`;
  document.getElementById('nav').innerHTML = '';
  document.getElementById('navPortal').innerHTML = '';
  document.getElementById('nav2').innerHTML = '';
  document.getElementById('title').textContent = 'Нет доступа';
  document.getElementById('subtitle').textContent = '';
  document.getElementById('brandMark').src = A.mark;
  for (const id of ['bellBtn', 'exportBtn', 'newBtn']) {
    document.getElementById(id).style.display = 'none';
  }
}

/** Обёртка действия: блокирует кнопку, показывает результат, обновляет экран. */
async function act(button, fn, successText) {
  const label = button ? button.innerHTML : null;
  if (button) { button.disabled = true; button.setAttribute('aria-busy', 'true'); button.innerHTML = 'Выполняется…'; }
  try {
    const result = await fn();
    if (successText) toast(successText, 'good');
    return result;
  } catch (error) {
    toast(describeError(error), 'bad');
    if (error.isConflict) {
      // Заявку изменил кто-то ещё — перечитываем, чтобы не затереть чужую правку.
      state.loaded.delete('requests');
      await loadView(view, true);
    }
    return null;
  } finally {
    if (button) { button.disabled = false; button.removeAttribute('aria-busy'); button.innerHTML = label; }
  }
}

};
let view = 'board';
let filters = { branch: '', service: '', party: '', who: '' };
/* Отбор доски — в адресе («#/board?who=none»): ссылкой на «Без исполнителя» можно поделиться,
   обновление страницы и «Назад» его сохраняют. */
const FILTER_KEYS = ['branch', 'service', 'party', 'who'];
function filterQuery() {
  if (view !== 'board') return '';
  const q = new URLSearchParams(FILTER_KEYS.filter((k) => filters[k]).map((k) => [k, filters[k]])).toString();
  return q ? '?' + q : '';
}
function readFilters() {
  const i = location.hash.indexOf('?');
  const q = new URLSearchParams(i < 0 ? '' : location.hash.slice(i + 1));
  const before = JSON.stringify(filters);
  filters = Object.fromEntries(FILTER_KEYS.map((k) => [k, q.get(k) || '']));
  return JSON.stringify(filters) !== before;
}
function setFilter(key, value) {
  filters[key] = value;
  if (state.live) history.replaceState(null, '', '#/' + view + filterQuery());
  render();
}
function resetFilters() {
  filters = { branch: '', service: '', party: '', who: '' };
  setFilter('branch', '');
}
/** Реестр заявок: действующие / закрытые / все и поиск по номеру, Заказчику, БИН (С10). */
const registryFilter = { state: 'open', q: '' };
function setRegistryFilter(key, value) {
  registryFilter[key] = value;
  state.loaded.delete('requests');
  reloadCurrent();
}

/** Раздел показывается, только если у роли есть соответствующее право. */
const VIEW_PERMISSION = {
  board: 'request.view', registry: 'request.view', bottlenecks: 'metrics.view',
  ams: 'registry.view', archive: 'documents.view',
  new: 'request.create', mine: 'request.view', assignments: 'assignment.view',
  users: 'admin', monitoring: 'metrics.view',
};
/** Кто видит нагрузку команды: руководитель подразделения и контроль (п. 102). */
const canSeeTeam = () => can('admin') || !!state.me?.isHead || can('metrics.view') && (hasRole('orpsd', 'oko', 'management'));
function viewAllowed(key) {
  // Заказчику — только портал: подача и свои заявки; внутренние разделы скрыты (В1).
  if (isCustomerUser()) return ['new', 'mine'].includes(key);
  // Кабинет Заказчика сотрудникам не нужен: у них реестр заявок.
  if (key === 'mine') return !state.live;
  // Личный список задач — у каждого сотрудника (в демонстрационном режиме данных нет).
  if (key === 'tasks') return state.live;
  if (key === 'team') return state.live && canSeeTeam();
  if (key === 'directories') return can('admin') || can('counterparty.verify') || can('registry.edit') || can('request.tv') || hasRole('permits');
  // Служебные записки: ОР ПСД направляет, филиал отвечает (п. 10).
  if (key === 'memos') return can('memo.create') || can('memo.answer');
  // Журнал действий — ДИТ, ОКО и аудитор СБ (ТЗ №12, А8).
  if (key === 'audit') return can('audit.view');
  if (key === 'reports') return can('reports.view') || can('reports.branch');
  const permission = VIEW_PERMISSION[key];
  return !permission || can(permission);
}

function taskDue(t) {
  if (!t.dueAt) return '<span class="ref">без срока</span>';
  const n = daysLeft(t.dueAt);
  const chip = n < 0 ? `<span class="chip r">просрочено на ${-n} дн.</span>` : n === 0 ? '<span class="chip w">сегодня</span>'
    : n <= 3 ? `<span class="chip w">${n} дн.</span>` : `<span class="chip g">${n} дн.</span>`;
  return `${fmt(t.dueAt)}<br>${chip}`;
}

async function openAbsence() {
  const { people } = await api.colleagues().catch(() => ({ people: [] }));
  const others = people.filter((p) => p.id !== state.me.id);
  const manage = can('admin') || state.me.isHead;
  const values = await ask({
    title: 'Отсутствие и замещение',
    text: 'На эти дни новые заявки на вас не назначаются, ваши задачи и письма видит замещающий. По окончании всё возвращается само.',
    fields: [
      ...(manage ? [{ key: 'userId', label: 'Кто отсутствует', type: 'select', value: state.me.id,
        options: [{ value: state.me.id, label: state.me.fullName + ' (я)' }, ...others.map((p) => ({ value: p.id, label: `${p.full_name}${p.department ? ' · ' + p.department : ''}` }))] }] : []),
      { key: 'dateFrom', label: 'С', type: 'date', required: true, value: new Date().toISOString().slice(0, 10) },
      { key: 'dateTo', label: 'По', type: 'date', required: true },
      { key: 'substituteId', label: 'Замещает', type: 'select', required: true,
        options: [{ value: '', label: '— выберите сотрудника —' }, ...others.map((p) => ({ value: p.id, label: `${p.full_name}${p.department ? ' · ' + p.department : ''}${p.absent ? ' (сам отсутствует)' : ''}` }))] },
      { key: 'reason', label: 'Причина', type: 'select', value: 'отпуск',
        options: ['отпуск', 'командировка', 'болезнь', 'обучение', 'иное'].map((x) => ({ value: x, label: x })) },
    ],
    ok: 'Оформить',
  });
  if (!values) return;
  if (await act(null, () => api.saveAbsence(values), 'Замещение оформлено')) { state.loaded.delete('tasks'); await go('tasks'); }
}

async function removeAbsence(button, id) {
  if (!confirm('Отменить замещение?')) return;
  if (await act(button, () => api.deleteAbsence(id), 'Замещение отменено')) { state.loaded.delete('tasks'); await go('tasks'); }
}

async function go(v, keep = false) {
  // Из меню «Мои задачи» открываются свои; чужие — только из «Нагрузки команды».
  if (v === 'tasks' && !keep) tasksUser = 'me';
  view = v;
  pushRoute();
  window.scrollTo(0, 0);
  document.querySelector('.side')?.classList.remove('open');
  // Задачи и нагрузка меняются каждую минуту — перечитываются при каждом входе на экран.
  if (state.live && (!state.loaded.has(v) || v === 'tasks' || v === 'team')) {
    state.loading = true;
    render();
    try { await loadView(v); state.error = null; }
    catch (error) { state.error = describeError(error); }
    finally { state.loading = false; }
  }
  render();
}

/** Открытая заявка без исполнителя этапа или ответственного ОР ПСД — слепая зона (п. 102). */
const unassigned = (r) => state.live && !stageBy[r.stageCode].terminal && r.stageCode !== 'draft' &&
  (!r.executorId || !r.responsibleId);
const isMine = (r) => !!state.me && (r.executorId === state.me.id || r.responsibleId === state.me.id);

function filtered() {
  return D.requests.filter(r =>
    (!filters.branch || r.branch === filters.branch) &&
    (!filters.service || r.services.includes(filters.service)) &&
    (!filters.party || stageBy[r.stageCode].ownerParty === filters.party) &&
    (!filters.who || (filters.who === 'me' ? isMine(r) : filters.who === 'none' ? unassigned(r)
      : r.executorId === filters.who || r.responsibleId === filters.who)));
}
/** Сотрудники, у которых есть заявки, — для отбора по исполнителю. */
function executorOptions() {
  const people = new Map();
  for (const r of D.requests) {
    if (r.executorId) people.set(r.executorId, r.executorName);
    if (r.responsibleId) people.set(r.responsibleId, r.responsibleName);
  }
  return [...people].sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'ru'));
}
function filterBar() {
  const parties = [...new Set(boardStages.map(s => s.ownerParty))];
  return `<div class="filters">
    <select aria-label="Филиал" onchange="setFilter('branch', this.value)">

      ${D.branches.map(b => `<option ${filters.branch===b?'selected':''}>${b}</option>`).join('')}

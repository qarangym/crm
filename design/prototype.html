    <select aria-label="Услуга" onchange="setFilter('service', this.value)">
      <option value="">Все услуги</option>
      ${['ТУ','ПСД','СМР'].map(s => `<option ${filters.service===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <select aria-label="Ответственная сторона" onchange="setFilter('party', this.value)">
      <option value="">Любая ответственная сторона</option>

    </select>
    ${state.live ? `<select aria-label="Исполнитель" onchange="setFilter('who', this.value)">

    <button class="btn ghost" onclick="resetFilters()">Сбросить</button>
    <span class="ref">${filtered().length} из ${D.requests.length} заявок</span>

function cardHtml(r) {
  const n = daysLeft(r.dueAt);
  const cls = n < 0 ? 'late' : n <= 3 ? 'warn' : '';
  return appLink(`#/${view}/${r.number}`, `openSheet('${r.number}')`, `
    <div class="id"><b>${esc(r.number)}</b>${slaChip(r)}</div>
    <div class="cust">${esc(r.customer)}</div>
    <div class="obj">${esc(r.object)} · ${esc(r.branch)}</div>
    ${executorLine(r)}
    <div class="foot">${svcChips(r)}
      ${r.openRemarks ? '<span class="chip w">замечания: ' + r.openRemarks + '</span>' : ''}
      <span class="ref" style="margin-left:auto">${money(r.amount)}</span>
    </div>`, `class="card ${cls}"`);
}
const initials = (name) => String(name || '').split(/[\s@.]+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('');
/**
 * Кто держит карточку. На этапе Заказчика действует Заказчик, а срок контролирует
 * ответственный ОР ПСД (пп. 56, 88, 93) — видно обоих.
 */
function executorLine(r) {
  if (!state.live || stageBy[r.stageCode].terminal || r.stageCode === 'draft') return '';
  if (!r.executorId) return `<div class="who"><span class="ava none">?</span><b style="color:var(--bad)">Нет исполнителя</b></div>`;
  const customerStage = stageBy[r.stageCode].ownerParty === 'customer';
  return `<div class="who" title="${customerStage ? 'Ждём Заказчика; срок контролирует' : 'Исполнитель этапа'}: ${esc(r.executorName)}">
    <span class="ava">${esc(initials(r.executorName))}</span>
    ${customerStage ? `<span><span class="ref">Заказчик · контроль:</span> ${esc(r.executorName)}</span>` : `<span>${esc(r.executorName)}</span>`}
  </div>`;
}

/* ----------------------------- узкие места ------------------------------ */
function metrics() {
  // В рабочем режиме медианы и доли нарушений считает сервер по истории этапов:
  // выгружать её целиком в браузер нельзя.
  if (state.live && D.metrics) {
    return D.metrics.stages
      .filter((m) => m.slaValue > 0 && m.completed > 0)
      .map((m) => ({
        ...stageBy[m.stageCode],
        median: m.medianDays,
        ratio: m.slaRatio ?? (m.slaValue ? m.medianDays / m.slaValue : 0),
        n: m.completed,
        breachShare: m.breachShare,
        inProgress: m.inProgress,
      }))
      .sort((a, b) => b.ratio - a.ratio);
  }
  return boardStages.filter(s => s.slaValue > 0).map(s => {
    const samples = D.history.filter(h => h.stageCode === s.code).map(h => h.spent).sort((a,b)=>a-b);
    const median = samples.length ? samples[Math.floor(samples.length/2)] : 0;
    const breached = samples.filter(v => v > s.slaValue).length;
    return { ...s, median, ratio: median / s.slaValue, n: samples.length,
      breachShare: samples.length ? breached / samples.length : 0,
      inProgress: D.requests.filter(r => r.stageCode === s.code).length };
  }).sort((a,b) => b.ratio - a.ratio);
}
function renderBottlenecks() {
  const m = metrics();
  if (!m.length) {
    return `<div class="panel"><div class="panel-body" style="color:var(--muted)">
      Недостаточно данных: показатели считаются по завершённым прохождениям этапов.
      Проведите несколько заявок по маршруту — и здесь появятся медианы против нормативов.
    </div></div>`;
  }
  // Для заголовка берём этап с наибольшим абсолютным превышением норматива:
  // по отношению медианы к нормативу наверх всплывали бы короткие этапы в 1 день.
  const worst = m.slice().sort((a, b) => (b.median - b.slaValue) - (a.median - a.slaValue))[0];
  // «В работе» — только незакрытые заявки (С12).
  const rows = D.requests.filter((r) => !stageBy[r.stageCode].terminal && r.stageCode !== 'draft');
  const late = rows.filter(r => daysLeft(r.dueAt) < 0);
  const byParty = {};
  if (state.live && D.metrics) {
    for (const row of D.metrics.byParty) {
      byParty[row.ownerParty] = { total: row.total, late: row.overdue };
    }
  } else {
    rows.forEach(r => {
      const p = stageBy[r.stageCode].ownerParty;
      byParty[p] = byParty[p] || { total: 0, late: 0 };
      byParty[p].total++;
      if (daysLeft(r.dueAt) < 0) byParty[p].late++;

  }
  const max = Math.max(...m.map(x => x.median / x.slaValue));

  return `<div class="kpis">
    <div class="kpi"><div class="big">${rows.length}</div><span>заявок в работе</span></div>
    <div class="kpi"><div class="big" style="color:${late.length?'var(--bad)':'var(--ok)'}">${late.length}</div>

    <div class="kpi"><div class="big">${rows.length ? Math.round((1 - late.length/rows.length)*100) : 100}<small>%</small></div>
      <span>заявок в нормативном сроке</span></div>
    <div class="kpi"><div class="big">${worst.median}<small>дн.</small></div>
      <span>медиана на этапе «${esc(worst.short)}» при нормативе ${worst.slaValue}</span></div>
  </div>

  <div class="grid2">
    <section class="panel">
      <div class="panel-head"><div><h2>Время на этапе против норматива</h2>
        <p>Медиана по завершённым прохождениям. Чёрная риска — норматив Регламента</p></div></div>
      <div class="panel-body">
        ${m.map(x => {
          const cls = x.ratio >= 1.5 ? 'hot' : x.ratio > 1 ? 'mid' : '';
          const w = Math.min(100, x.ratio / max * 100);
          const normPos = Math.min(100, (1 / max) * 100);
          return `<div class="bar-row">
            <div class="lbl"><b>${esc(x.name)}</b><small>${C.ownerParties[x.ownerParty]} · ${esc(x.regulationRef)}</small></div>
            <div class="track ${cls}"><i style="width:${w}%"></i><span class="norm" style="left:${normPos}%"></span></div>
            <div class="val">${x.median} дн.<small>норматив ${x.slaValue}</small></div>
          </div>`;
        }).join('')}
      </div>
    </section>

    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="panel">
        <div class="panel-head"><div><h2>Кто держит срок</h2>
          <p>Просрочки по ответственной стороне</p></div></div>
        <div class="panel-body">
          <table><tbody>
          ${Object.entries(byParty).sort((a,b)=>b[1].late-a[1].late).map(([p, v]) => `
            <tr><td>${C.ownerParties[p]}</td>
              <td style="width:110px"><div class="meter ${v.late/v.total>.4?'r':v.late?'w':'g'}">
                <i style="width:${Math.round(v.late/v.total*100)}%"></i></div></td>

          </tbody></table>
          <div class="note" style="margin-top:12px">

async function approveDoc(button, id) {
  if (!state.live) { toast('Демонстрационный режим: визирование не сохраняется'); return; }
  const ok = await act(button, () => api.approveDocument(id),
    'Документ завизирован: правка и удаление закрыты');
  if (ok) { D.pendingVisa = Math.max(0, (D.pendingVisa || 1) - 1); await searchDocuments(); }
}

async function deleteDoc(button, id, number) {
  if (!state.live) { toast('Демонстрационный режим: удаление не сохраняется'); return; }
  if (!window.confirm(`Удалить невизированную карточку ${number} вместе с файлом?`)) return;
  const ok = await act(button, () => api.deleteDocument(id), 'Карточка удалена');
  if (ok) await searchDocuments();
}

/** Срок действия по умолчанию: ТУ — 6 месяцев (п. 31), рабочий проект — 36 (п. 47). */
function defaultValidUntil(kind, date) {
  const months = kind === 'ТУ' ? 6 : kind === 'ПСД (РП)' ? 36 : 0;
  if (!months || !date) return '';
  const d = new Date(date + 'T12:00:00Z');
  d.setUTCMonth(d.getUTCMonth() + months);
  return d.toISOString().slice(0, 10);
}

  const kind = document.getElementById('upKind').value;
  const valid = document.getElementById('upValid');
  if (valid && !valid.dataset.touched) valid.value = defaultValidUntil(kind, document.getElementById('upDate').value);
  const form = document.getElementById('upFormField');
  if (form) form.style.display = kind === 'АВР' ? '' : 'none';

async function submitUpload(button) {
  if (!state.live) { toast('Демонстрационный режим: загрузка недоступна', 'bad'); return; }
  const file = document.getElementById('upFile').files[0];
  if (!file) { toast('Выберите файл', 'bad'); return; }

  const form = new FormData();
  form.set('kind', document.getElementById('upKind').value);
  form.set('number', document.getElementById('upNumber').value.trim());
  form.set('facilityId', document.getElementById('upFacility').value);
  form.set('ownerId', document.getElementById('upOwner').value);
  form.set('contractor', document.getElementById('upContractor').value.trim());
  form.set('docDate', document.getElementById('upDate').value);
  const valid = document.getElementById('upValid').value;
  if (valid) form.set('validUntil', valid);
  const formCode = document.getElementById('upForm').value;
  if (formCode && form.get('kind') === 'АВР') form.set('formCode', formCode);
  const linked = uploadFor;
  if (linked) form.set('requestId', linked.requestId);
  if (linked?.contractId) form.set('contractId', linked.contractId);
  form.set('file', file, file.name);

  const result = await act(button, () => api.uploadDocument(form), 'Документ загружен в архив');
  if (!result) return;
  uploadFor = null;
  state.loaded.delete('documents');
  if (can('documents.approve')) D.pendingVisa = (await api.pendingCount().catch(() => ({ count: D.pendingVisa || 0 }))).count;
  if (linked) await refreshSheet();
  else { closeSheet(); await searchDocuments(); }
}

/**

/**

 */
const PARAM_LABEL = {
  scope: 'Состав и объём работ', equipment: 'Оборудование', quantity: 'Количество',
  power: 'Потребляемая мощность', weight: 'Масса оборудования', windage: 'Парусность',
  height: 'Высота размещения', area: 'Площадь размещения', length: 'Протяжённость кабеля',
  route: 'Маршрут кабеля', designTask: 'Задание на проектирование', channel: 'Телерадиоканал',
  signalType: 'Тип сигнала', deliveryPoint: 'Точка доведения сигнала', bitrate: 'Информационная скорость',
  basisReference: 'Основание для СМР',
};
const GENERAL_REMARKS = ['Приложения к заявке', 'Реквизиты Заказчика', 'Общее'];
function remarkFields() {
  const services = (sheetCard?.services || []).slice().sort((a, b) => a.service.localeCompare(b.service));

      out.push({ key: `services.${i}.${key}`, label: `${s.service} · ${PARAM_LABEL[key] || key}` });
    }
  });
  for (const g of GENERAL_REMARKS) {
    out.push({ key: g, label: g + (g === 'Приложения к заявке' ? ' (снимается загрузкой файла)' : ' (снимает ОР ПСД)') });
  }
  return out;
}

/** Карточка перечитывается после действия — видно результат и новые условия. */
async function refreshSheet() {

/**
 * Переход по этапу. Условия проверяет сервер — ответ показываем дословно.
 * Отказ и расторжение спрашивают причину в диалоге (К2): кнопка не блокируется
 * из-за того, что причина ещё не введена.
 */
async function doTransition(button, to) {
  const t = (sheetCard?.transitions || []).find((x) => x.to === to);
  const needsReason = t ? t.needsReason : ['closed_rejected', 'closed_cancelled'].includes(to);
  let reason = null;
  if (needsReason) {
    const titles = {
      closed_rejected: ['Мотивированный отказ', 'Причина будет направлена Заказчику письменно (п. 19, табл. 1).'],
      closed_cancelled: ['Расторжение', 'Действующие договоры заявки будут расторгнуты. Если нужен возврат средств — сначала расторгните оплаченный договор с суммой возврата (пп. 96–97).'],
    };
    const [title, text] = titles[to] || ['Укажите причину', ''];
    const values = await ask({ title, text, danger: true, ok: 'Подтвердить',
      fields: [{ key: 'reason', label: 'Основание', type: 'textarea', required: true, minLength: 10,
        ph: to === 'closed_cancelled' ? 'Письмо Заказчика исх. № … от …, соглашение о расторжении' : 'Недостаточно несущей способности яруса 58 м по расчёту …' }] });
    if (!values) return;
    reason = values.reason;
  } else if (to === 'closed_done' || to === 'closed_expired') {
    const text = to === 'closed_done' ? 'Заявка будет закрыта как исполненная, договоры — отмечены исполненными (п. 127).'
      : 'Оплата не поступила в срок оферты — заявка закрывается с уведомлением Заказчика (табл. 1).';
    if (!await ask({ title: t?.title || 'Подтвердите', text, ok: 'Закрыть заявку' })) return;
  }
  if (!state.live) { toast('Демонстрационный режим: переход не сохраняется'); return; }

  const body = { to, version: sheetRequest.version };
  if (reason) body.reason = reason;
  const result = await act(button, () => api.transition(sheetRequest.id, body), 'Этап изменён');
  if (result) {
    closeSheet();
    await reloadCurrent();
  }
}

/** Фиксация оценки ТВ с версией мастер-файла (п. 16.5); вопреки расчёту — с основанием (п. 16.4). */
async function saveTv(button, overrideReason) {
  const status = document.getElementById('tvStatus').value;
  const versionInput = document.getElementById('tvVersion');
  const masterFileVersion = versionInput.value.trim();
  const verificationCalc = document.getElementById('tvCalc').value || null;
  if (!state.live) { toast('Демонстрационный режим: оценка не сохраняется'); return; }
  try {
    button.disabled = true;
    await api.setTv(sheetRequest.id, { status, masterFileVersion, verificationCalc, overrideReason, version: sheetRequest.version });
    toast('Оценка технической возможности зафиксирована', 'good');
    await refreshSheet();
  } catch (error) {
    if (error.failures?.some((f) => f.code === 'calc_insufficient')) {
      const values = await ask({ title: 'Подтверждение вопреки расчёту',
        text: 'Последний расчёт по реестру показал недостаток ёмкости. Решение принимает инженер (п. 16.4) — укажите его основание.',
        fields: [{ key: 'reason', label: 'Основание решения', type: 'textarea', required: true, minLength: 10,
          ph: 'Поверочный расчёт № … от …; демонтаж оборудования арендатора …' }] });
      button.disabled = false;
      if (values) await saveTv(button, values.reason);
      return;
    }
    toast(describeError(error), 'bad');
  } finally {
    button.disabled = false;
  }
}

async function openSheet(number, keepOpen = false) {
  sheetRequest = D.requests.find((x) => x.number === number);
  if (!sheetRequest && state.live) {
    // Заявки может не быть в текущей выборке (закрытая, другой отбор) — находим по номеру.
    const found = (await api.requests({ q: number, limit: 5 }).catch(() => ({ requests: [] }))).requests
      .map(adaptRequest).find((x) => x.number === number);
    if (found) { D.requests.push(found); sheetRequest = found; }
  }
  if (!sheetRequest) { toast('Заявка не найдена', 'bad'); return; }
  if (!keepOpen) { draftRemarks = []; pushRoute(number); }
  document.getElementById('sheet').classList.add('on');

  if (state.live) {
    if (!keepOpen) {
      document.getElementById('sheetPanel').innerHTML =
        `<div class="sheet-head"><div class="row"><h2>${esc(number)}</h2>
          <button class="btn ghost" style="margin-left:auto" onclick="closeSheet()" aria-label="Закрыть">${icon('close', 16)}</button>
        </div></div><div class="sheet-body">${skeleton()}</div>`;
    }
    try {
      sheetCard = await api.request(sheetRequest.id);
      // Список мог устареть: берём актуальную версию карточки для проверки версии.
      sheetRequest = { ...sheetRequest, ...adaptRequest(sheetCard.request) };
      const staff = !isCustomerUser();
      const [docsRes, checks, versions, cps] = await Promise.all([
        api.requestDocuments(sheetRequest.id).catch(() => ({ documents: [], attachmentsOpen: { ok: false } })),
        staff && sheetRequest.stageCode === 'tv_review' && can('request.tv')
          ? api.capacityChecks(sheetRequest.id).then((x) => x.checks).catch(() => []) : [],
        staff && sheetRequest.stageCode === 'tv_review' && can('request.tv')
          ? api.registryVersions().then((x) => x.versions).catch(() => []) : [],
        staff ? api.checkpoints(sheetRequest.id).catch(() => ({ checkpoints: [], amendments: [] })) : { checkpoints: [], amendments: [] },
      ]);
      sheetCard.executors = staff ? await api.executors(sheetRequest.id).catch(() => null) : null;
      sheetCard.documents = docsRes.documents || [];
      sheetCard.attachmentsOpen = docsRes.attachmentsOpen || { ok: false };
      sheetCard.capacityChecks = checks;
      sheetCard.registryVersions = versions;
      sheetCard.checkpoints = cps.checkpoints || [];
      sheetCard.amendments = cps.amendments || [];
      if (staff && !sheetRequest.facilityId && (can('request.register') || can('request.tv')) && !(D.facilities || []).length) {
        D.facilities = ((await api.facilities().catch(() => ({ facilities: [] }))).facilities || []).map(adaptFacility);
      }
    } catch (error) {
      document.getElementById('sheetPanel').innerHTML =
        `<div class="sheet-body">${errorBanner(describeError(error))}</div>`;
      return;
    }
  } else {
    sheetCard = null;
  }
  if (isCustomerUser()) renderCustomerSheet(); else renderSheet();
}

/**
 * Исполнители в карточке (п. 102): кто ведёт заявку и кто действует на этапе.
 * Передать может ОР ПСД, а исполнителя этапа — и само подразделение-исполнитель.
 */
function executorRows(r) {
  const x = sheetCard?.executors;
  if (!x || r.stageCode === 'draft') return '';
  const party = C.ownerParties[x.ownerParty] || '';
  const person = (p) => p ? `<span class="ava">${esc(initials(p.name))}</span> ${esc(p.name)}` : '<span class="chip r">не назначен</span>';
  const btn = (kind) => `<button class="btn sm ghost" style="margin-left:6px" onclick="changeExecutor(this, '${kind}')">Передать</button>`;
  const customerStage = x.ownerParty === 'customer';
  return `
    <b>Ответственный ОР ПСД</b><span>${person(x.responsible)}${x.canChangeResponsible ? btn('responsible') : ''}
      <span class="ref">ведёт заявку до закрытия · п. 102</span></span>
    ${stageBy[r.stageCode].terminal ? '' : `<b>Исполнитель этапа</b><span>${person(x.stage)}${x.canChangeStage && !customerStage ? btn('stage') : ''}
      <span class="ref">${customerStage ? 'этап Заказчика — срок контролирует ОР ПСД (пп. 56, 88, 93)' : esc(party)}</span></span>`}`;
}

async function changeExecutor(button, kind) {
  const x = sheetCard?.executors;
  if (!x) return;
  const list = kind === 'responsible' ? x.responsibleCandidates : x.stageCandidates;
  const current = kind === 'responsible' ? x.responsible : x.stage;
  if (!list.length) { toast('В подразделении нет действующих сотрудников', 'bad'); return; }
  const values = await ask({
    title: kind === 'responsible' ? 'Передать заявку другому специалисту ОР ПСД' : 'Передать этап другому сотруднику',
    text: `Заявка ${esc(sheetRequest.number)}. Новый исполнитель получит письмо; передача попадёт в журнал.`,
    fields: [
      { key: 'userId', label: 'Кому', type: 'select', required: true, value: current?.id || '',
        options: list.map((c) => ({ value: c.id, label: `${c.name}${c.id === state.me?.id ? ' (я)' : ''} — в работе ${c.load}` })) },
      { key: 'reason', label: 'Причина', type: 'textarea', ph: 'Отпуск, перераспределение нагрузки…' },
    ],
    ok: 'Передать',
  });
  if (!values) return;
  const result = await act(button, () => api.setExecutor(sheetRequest.id, { kind, userId: values.userId, reason: values.reason }),
    'Исполнитель назначен');
  if (!result) return;
  await reloadCurrent();
  await refreshSheet();
}

/** Итог закрытой заявки — вместо таймера (С11). */
function outcomeText(r) {
  const s = stageBy[r.stageCode];
  if (!s.terminal) return '';
  const when = r.closedAt ? fmtFull(r.closedAt) : '';
  return `${s.name}${when ? ' ' + when : ''}`;
}

/** Печатные формы из карточки (А4): данные заявки подставлены, остальное инженер дописывает на странице. */
function printBar(r) {
  const url = (form, extra = '') => `/api/v1/requests/${encodeURIComponent(r.id)}/print/${form}${extra}`;
  const staff = !isCustomerUser();
  const tuForms = [[1, 'канал'], [2, 'кабель по территории'], [3, 'кабель в помещении'], [4, 'электроснабжение'], [5, 'размещение']];
  return `<div class="row-actions" style="justify-content:flex-start">
    <a class="btn ghost sm" target="_blank" rel="noopener" href="${url('card')}">${icon('download', 14)}Карточка заявки</a>
    ${staff && r.services.includes('ТУ') && can('request.edit') ? `<select class="btn ghost sm" aria-label="Проект ТУ: открыть форму" onchange="if(this.value){window.open(this.value,'_blank','noopener');this.value=''}">
      <option value="">Проект ТУ…</option>${tuForms.map(([n, t]) => `<option value="${url('tu', '?form=' + n)}">Приложение ${n} — ${t}</option>`).join('')}</select>` : ''}
    ${staff && r.services.includes('СМР') ? `<a class="btn ghost sm" target="_blank" rel="noopener" href="${url('avr')}">Технический АВР</a>` : ''}
  </div>`;
}

function renderSheet() {
  const r = sheetRequest;
  const s = stageBy[r.stageCode];
  const route = C.stages.filter((x) => !x.terminal);
  const closed = s.terminal;

  // В рабочем режиме условия перехода считает сервер — они уже пришли с карточкой.
  // Сводим по тексту: у двух договоров один код, но разные услуги. Причина отказа
  // и срок оферты — не «условие этапа», их спросит диалог либо покажет дата.
  const hiddenCodes = ['stage_passed', 'no_reason', 'offer_active', 'closing_not_confirmed'];
  const items = sheetCard
    ? [...new Map(sheetCard.transitions.filter((t) => !t.to.startsWith('closed')).flatMap((t) => t.failures)
        .filter((f) => !hiddenCodes.includes(f.code))
        .map((f) => [f.code + f.message, { ok: false, text: f.message, ref: f.regulationRef }])).values()]
    : gateItems(r);
  if (sheetCard && !items.length && !closed) {
    items.push({ ok: true, text: 'Все условия текущего этапа выполнены', ref: s.regulationRef });
  }
  const blocked = items.filter((i) => !i.ok);

  // Пройденный этап услуги не показывается как «заблокированный переход» (Н3).
  const transitions = (sheetCard
    ? sheetCard.transitions
    : C.transitions
        .filter((t) => t.from === r.stageCode &&
          (!stageBy[t.to].serviceScope || r.services.includes(stageBy[t.to].serviceScope)))
        .map((t) => ({ ...t, allowed: !blocked.length || t.to.startsWith('closed'), failures: [], needsReason: ['closed_rejected', 'closed_cancelled'].includes(t.to) })))
    .filter((t) => !(t.failures || []).some((f) => f.code === 'stage_passed'))
    // Подтверждение регистрации — кнопкой в блоке регистрации, без дубля в списке переходов.
    .filter((t) => !(r.stageCode === 'registered' && t.to === 'tv_review' && registrationBlock(r)));

  const myRoles = state.live ? (state.me?.roles ?? []) : null;
  const allowedForMe = (t) => !myRoles || t.roles.some((x) => myRoles.includes(x));

  const services = sheetCard?.services ?? [];
  const remarks = sheetCard?.remarks ?? [];
  const history = sheetCard?.events ?? [];
  const current = sheetCard?.currentStage;

  document.getElementById('sheetPanel').innerHTML = `
  <div class="sheet-head">
    <div class="row">
      <div><div class="ref">${esc(r.customer)}</div><h2>${esc(r.number)}</h2></div>
      <div style="margin-left:auto">${slaChip(r)}</div>
      <button class="btn ghost" onclick="closeSheet()" aria-label="Закрыть">${icon('close', 16)}</button>
    </div>
    <div class="route">
      ${route.map((x) => {
        const skip = x.serviceScope && !r.services.includes(x.serviceScope);
        const cls = skip ? 'skip' : closed || x.order < s.order ? 'done' : x.order === s.order ? 'cur' : '';
        return `<i class="${cls}" title="${x.order}. ${esc(x.name)}${skip ? ' — не заказано' : ''}"></i>`;
      }).join('')}
    </div>
    <div class="ref">${closed
      ? `<b>${esc(outcomeText(r))}</b>${r.closedReason ? ' · ' + esc(r.closedReason) : ''} · ${esc(s.regulationRef)}`
      : `Этап ${s.order} из ${route.length}: ${esc(s.name)} · норматив ${esc(s.slaText)} ·
        отвечает ${esc(C.ownerParties[s.ownerParty])} · ${esc(s.regulationRef)}${current?.paused_at || current?.pausedAt ? ' · <b>срок приостановлен</b>' : ''}`}</div>
  </div>
  <div class="sheet-body">
    ${state.live && r.id ? printBar(r) : ''}
    ${blocked.length && !closed ? `<div class="blocked"><b>Переход невозможен.</b> ${blocked.map((b) =>
      esc(b.text) + ' (' + esc(b.ref) + ')').join('; ')}</div>` : ''}

    ${closed ? '' : `<div class="gate">
      <h4>Условия перехода по Регламенту</h4>
      ${items.map((i) => `<div class="item ${i.ok ? 'ok' : ''}">
        <span class="st">${i.ok ? '✓' : '!'}</span>
        <span class="tx">${esc(i.text)}<small>${esc(i.ref)}</small></span></div>`).join('')}
    </div>`}

    <section class="panel"><div class="panel-body">
      <div class="kv">
        ${executorRows(r)}
        <b>Заказчик</b><span>${esc(r.customer)}</span>
        <b>Объект</b><span>${r.facilityId || !state.live ? esc(r.object) : `<span class="chip w">не определён</span> адрес из заявки: ${esc(r.facilityAddress || '—')}`}</span>
        <b>Филиал</b><span>${esc(r.branch || '—')} <span class="ref">определён по объекту, Приложение 7</span></span>
        <b>Услуги</b><span>${svcChips(r)}</span>
        <b>Внутренний номер</b><span>${esc(r.number)} <span class="ref">присвоен при подаче</span></span>
        <b>Регистрация</b><span>${r.incomingNumber
          ? esc(r.incomingNumber) + ' от ' + fmt(r.incomingDate) + (!state.live ? ''
            : r.registrationConfirmedAt
              ? ` <span class="chip g">подтверждена</span> <span class="ref">${fmtFull(r.registrationConfirmedAt)}${r.registrationConfirmedBy ? ' · ' + esc(r.registrationConfirmedBy) : ''}</span>`
              : ' <span class="chip w">ждёт подтверждения канцелярии</span>')
          : '<span class="ref">присваивается при подаче</span>'} <span class="ref">п. 6</span></span>
        <b>Оценка ТВ</b><span>${r.tvStatus === 'confirmed'
          ? '<span class="chip g">подтверждена</span> реестр ' + esc(r.masterFileVersion || '')
            + (r.tvOverrideReason ? `<br><span class="ref">вопреки расчёту: ${esc(r.tvOverrideReason)}</span>` : '')
          : r.tvStatus === 'unavailable'
            ? '<span class="chip r">отсутствует</span>'
            : '<span class="chip w">не проверена</span>'}
          ${r.tvRecheckRequired ? '<br><span class="chip r">нужна повторная оценка — условия ПСД устарели (п. 47)</span>' : ''}</span>
        <b>Договоры</b><span>${contractsSummary(r)}</span>
        <b>Стоимость</b><span>${money(r.amount)} ${r.services.includes('СМР')
          ? '<span class="ref">СМР — по утверждённой смете, п. 49</span>'
          : '<span class="ref">сумма позиций, п. 21</span>'}</span>
      </div>
      ${services.length ? `<div style="margin-top:14px">
        <div class="ref" style="margin-bottom:6px">Состав заявки</div>
        ${services.map((x) => `<div class="remark" style="border-color:var(--line);background:#FAFBFE">
          <span class="fld">${esc(x.service)}</span>
          <span style="flex:1;color:var(--ink)">${esc((x.params && x.params.scope) || '')}
            ${paramsLine(x)}</span>
          <span class="ref">${x.amount === null ? 'по смете' : money(Number(x.amount))}</span>
        </div>`).join('')}
      </div>` : ''}
      ${r.stageCode === 'offer' && state.live ? `<div style="margin-top:12px"><button class="btn sm" onclick="printOffer()">${icon('download', 14)}Коммерческое предложение — печать</button>
        <span class="ref">по позициям заявки и Прейскуранту, п. 21</span></div>` : ''}
    </div></section>

    ${facilityBlock(r)}
    ${registrationBlock(r)}
    ${tvBlock(r)}
    ${contractsBlock(r)}
    ${closingBlock(r)}
    ${checkpointsBlock(r)}
    ${documentsBlock(r)}
    ${attachmentsBlock(r)}
    ${memosBlock(r)}
    ${assignmentsBlock(r)}
    ${escalationsBlock()}
    ${pauseBlock(r)}
    ${extensionBlock(r)}

    <section class="panel">
      <div class="panel-head"><div><h2>Следующий шаг</h2>
        <p>Доступные переходы и кто вправе их выполнить</p></div></div>
      <div class="panel-body" style="display:flex;flex-direction:column;gap:9px">
        ${transitions.length ? transitions.map((t) => {
          const mine = allowedForMe(t);
          const disabled = !t.allowed || !mine;
          const why = !mine ? 'Выполняет другое подразделение'
            : !t.allowed ? (t.failures || []).map((f) => `${f.message} (${f.regulationRef})`).join('; ')
            : '';
          const after = t.availableAfter && !t.allowed ? `<span class="ref">доступно после ${fmt(t.availableAfter)}</span>` : '';
          return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <button class="btn ${t.to.startsWith('closed') ? '' : 'primary'} sm" ${disabled ? 'disabled' : ''}
              ${why ? `title="${esc(why)}"` : ''}
              onclick="doTransition(this, '${t.to}')">${esc(t.title)}</button>
            <span class="ref pin">${esc(t.regulationRef)}</span>${after}
            <span class="ref" style="margin-left:auto">${t.roles.map((x) => esc(ROLE_LABEL[x] || x)).join(', ')}</span>
          </div>`;
        }).join('') : `<div class="ref">${closed ? 'Заявка закрыта: переходов нет.' : 'Переходов нет.'}</div>`}
      </div>
    </section>

    ${can('request.remark') && !closed ? `
    <section class="panel">
      <div class="panel-head"><div><h2>Возврат на доработку</h2>
        <p>Замечания привязываются к полям формы — ТЗ №11</p></div></div>
      <div class="panel-body">
        ${remarks.filter((m) => !m.resolved_at).map((m) => `<div class="remark">
          <span class="fld">${esc(remarkLabel(m.field_key))}</span>
          <span style="flex:1">${esc(m.text)}</span>
          <button class="btn ghost sm" onclick="resolveRemark(this,'${m.id}')">Снять</button>
        </div>`).join('')}
        ${draftRemarks.map((m, i) => `<div class="remark">
          <span class="fld">${esc(remarkLabel(m.field))}</span>
          <span style="flex:1">${esc(m.text)}</span>
          <button class="btn ghost sm" onclick="removeRemark(${i})">Убрать</button>
        </div>`).join('')}
        ${!draftRemarks.length && !remarks.filter((m) => !m.resolved_at).length
          ? '<div class="ref" style="margin-bottom:10px">Замечаний нет. Без хотя бы одного замечания вернуть заявку нельзя.</div>'
          : ''}
        <div class="form-grid" style="margin-top:12px">
          <div class="field"><label>Поле формы</label>
            <select id="rmField">${remarkFields().map((f) => `<option value="${esc(f.key)}">${esc(f.label)}</option>`).join('')}</select></div>
          <div class="field"><label>Что исправить</label>
            <input id="rmText" placeholder="например: приложите схему крепления"></div>
        </div>
        <div style="display:flex;gap:9px;margin-top:12px;align-items:center;flex-wrap:wrap">
          <button class="btn sm" onclick="addRemark()">Добавить замечание</button>
          <div style="flex:1"></div>
          <span class="ref pin">ТЗ №11</span>
          <button class="btn primary sm" ${draftRemarks.length ? '' : 'disabled'}
            onclick="returnToCustomer(this)">Вернуть Заказчику</button>
        </div>
        <div class="note" style="margin-top:12px">
          Заказчик исправляет ту же заявку — номер и история сохраняются. Замечание к полю
          снимается, когда поле исправлено; пока замечания открыты, заявка дальше не движется.
        </div>
      </div></section>` : ''}

    <section class="panel">
      <div class="panel-head"><div><h2>История</h2><p>Журнал обработки заявки, ТЗ №12</p></div></div>
      <div class="panel-body"><div class="hist">
        ${history.length ? history.map((e) => `<div class="e">
            <time>${fmt(String(e.occurred_at).slice(0, 10))}</time>
            <span>${esc(e.action)}${e.detail ? ' — ' + esc(String(e.detail).slice(0, 200)) : ''}
              ${e.actor_name ? `<span class="ref"> · ${esc(e.actor_name)}</span>` : ''}
              ${e.regulation_ref ? `<span class="ref pin" style="margin-left:6px">${esc(e.regulation_ref)}</span>` : ''}
              ${e.result === 'denied' ? '<span class="chip r" style="margin-left:6px">отказ</span>' : ''}
              ${e.result === 'error' ? '<span class="chip w" style="margin-left:6px">нарушение</span>' : ''}
            </span></div>`).join('')
          : '<div class="ref">Записей пока нет.</div>'}
      </div></div>
    </section>
  </div>`;
}

/** Краткие параметры позиции: оборудование, масса, высота, мощность. */
function paramsLine(x) {
  const p = x.params || {};
  const parts = [p.equipment, p.quantity && `${p.quantity} шт.`, p.weight && `${p.weight} кг`, p.height && `${p.height} м`,
    p.area && `${p.area} м²`, p.power !== undefined && p.power !== '' && `${p.power} кВт`, p.length && `${p.length} м кабеля`]
    .filter(Boolean);
  return parts.length ? `<br><span class="ref">${esc(parts.join(' · '))}</span>` : '';
}

/** Объект по адресу из заявки определяют документооборот либо ОР ПСД (п. 16.1, С5). */
function facilityBlock(r) {
  if (!state.live || r.facilityId || stageBy[r.stageCode].terminal) return '';
  if (!can('request.register') && !can('request.tv')) return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Определить объект</h2>
      <p>Заказчик указал адрес: объект и филиал определяются по мастер-файлу — п. 16.1</p></div></div>
    <div class="panel-body">
      <div class="note" style="margin-bottom:12px">Адрес из заявки: <b>${esc(r.facilityAddress || '—')}</b></div>
      <div class="form-grid"><div class="field span2"><label>Объект из справочника</label>
        <select id="fcFacility"><option value="">— выберите —</option>${(D.facilities || []).map((f) =>
          `<option value="${f.id}">${esc(f.name)} · инв. № ${esc(String(f.inv))} · ${esc(f.branch)}${f.address ? ' · ' + esc(f.address) : ''}</option>`).join('')}</select></div></div>
      <div style="margin-top:12px"><button class="btn primary sm" onclick="saveFacility(this)">Сохранить объект</button>
        <span class="ref">без объекта заявка не уходит на оценку ТВ</span></div>
    </div></section>`;
}

/**
 * Регистрация автоматическая (п. 6): номер и дата присвоены при подаче. Канцелярия
 * проверяет заявку и подтверждает регистрацию — заявка уходит в ОР ПСД и филиал.
 * Номер и дату можно исправить, если нужен номер из журнала канцелярии.
 */
function registrationBlock(r) {
  if (!can('request.register') || r.stageCode !== 'registered') return '';
  const confirm = (sheetCard?.transitions || []).find((t) => t.to === 'tv_review');
  const blocked = confirm && !confirm.allowed;
  return `<section class="panel">
    <div class="panel-head"><div><h2>Подтверждение регистрации</h2>
      <p>Номер и дата присвоены автоматически при подаче — пункт 6 Регламента</p></div></div>
    <div class="panel-body">
      <div class="kv">
        <b>Регистрационный номер</b><span>${esc(r.incomingNumber || r.number)}</span>
        <b>Дата регистрации</b><span>${fmtFull(r.incomingDate)}</span>
      </div>
      ${blocked ? `<div class="blocked" style="margin-top:12px">${confirm.failures.map((f) => esc(f.message) + ' (' + esc(f.regulationRef) + ')').join('; ')}</div>` : ''}
      <div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        ${confirm ? `<button class="btn primary sm" ${blocked ? 'disabled' : ''} onclick="doTransition(this,'tv_review')">Подтвердить регистрацию</button>` : ''}
        <button class="btn sm ghost" onclick="editRegistration(this)">Исправить номер или дату</button>
        <span class="ref">После подтверждения заявка уходит в ОР ПСД, филиал получает письмо</span>
      </div>
    </div></section>`;
}

/** Фиксация оценки ТВ — доступна ОР ПСД на этапе оценки и для повторной оценки по п. 47. */
function tvBlock(r) {
  const recheck = r.tvRecheckRequired && !stageBy[r.stageCode].terminal;
  if (!can('request.tv') || (r.stageCode !== 'tv_review' && !recheck)) return '';
  const opt = (value, label, current) =>
    `<option value="${value}" ${current === value ? 'selected' : ''}>${label}</option>`;
  const versions = sheetCard?.registryVersions || [];
  const lastCheck = (sheetCard?.capacityChecks || [])[0];
  const suggested = r.masterFileVersion || lastCheck?.registry_version || versions[0]?.version || '';
  const versionInput = versions.length
    ? `<select id="tvVersion">${versions.map((v) => `<option ${v.version === suggested ? 'selected' : ''}>${esc(v.version)}</option>`).join('')}</select>
       <div class="hint">Опубликованные версии; по умолчанию — версия последнего расчёта</div>`
    : `<input id="tvVersion" value="${esc(suggested)}" placeholder="2026-09-01">
       <div class="hint">Версии ещё не публикуются в системе — укажите версию мастер-файла, как в нём записано</div>`;
  return `<section class="panel">
    <div class="panel-head"><div><h2>${recheck ? 'Повторная оценка ТВ' : 'Оценка технической возможности'}</h2>
      <p>${recheck ? 'Условия ПСД устарели (п. 47): до повторной оценки к СМР не перейти' : 'Результат фиксируется с версией мастер-файла — пункт 16.5'}</p></div></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="field"><label>Результат</label>
          <select id="tvStatus">
            ${opt('pending', 'Не проверена', r.tvStatus)}
            ${opt('confirmed', 'Подтверждена', r.tvStatus)}
            ${opt('unavailable', 'Отсутствует', r.tvStatus)}
          </select></div>
        <div class="field"><label>Версия мастер-файла «Реестр АМС и загрузки»</label>${versionInput}</div>
        <div class="field span2"><label>Решение о поверочном расчёте (п. 16.4)</label>
          <select id="tvCalc">
            <option value="">— не зафиксировано —</option>
            ${opt('not_required', 'Не требуется', r.verificationCalc)}
            ${opt('required', 'Требуется — запросить филиал', r.verificationCalc)}
            ${opt('done', 'Выполнен, решения подтверждены', r.verificationCalc)}
          </select>
          <div class="hint">Числовой порог Регламентом не установлен, система его не задаёт</div>
        </div>
      </div>
      <div style="margin-top:12px">
        <button class="btn primary sm" onclick="saveTv(this)">Зафиксировать оценку</button>
      </div>
      ${r.stageCode === 'tv_review' ? capacityPanel() : ''}
    </div></section>`;
}

/** Расчёт по мастер-файлу на сервере: подсказка инженеру, решение — за ним (п. 16.4). */
function capacityPanel() {
  if (!state.live) return '';
  const last = (sheetCard?.capacityChecks || [])[0];
  const r = last?.result;
  const VERDICT = { ok: ['g', 'Ёмкости достаточно'], insufficient: ['r', 'Ёмкости недостаточно'], unknown: ['w', 'Данных недостаточно'] };
  return `<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <b>Расчёт по мастер-файлу</b><span class="ref pin">пп. 16.2, 17</span>
      <button class="btn sm" style="margin-left:auto" onclick="runCapacity(this)">${last ? 'Пересчитать' : 'Рассчитать по реестру'}</button>
    </div>
    ${r ? `<div class="verdict ${VERDICT[r.verdict][0]}" style="margin-top:10px"><b>${VERDICT[r.verdict][1]}</b>${esc(r.message)}</div>
      <div class="scroll-x"><table style="margin-top:8px"><thead><tr><th>Проверка</th><th class="num">Было</th><th class="num">Станет</th><th class="num">Предел</th><th class="num">%</th></tr></thead><tbody>
      ${r.checks.map((c) => `<tr><td>${esc(c.label)}</td><td class="num">${c.before}</td><td class="num">${c.after}</td>
        <td class="num">${c.limit ?? '<span class="ref">не заполнено</span>'}</td>
        <td class="num">${c.percent === null ? '—' : `<b style="color:${c.ok === false ? 'var(--bad)' : 'inherit'}">${c.percent}</b>`}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="ref" style="margin-top:6px">Реестр ${esc(last.registry_version || 'не опубликован')} ·
        ${esc(last.author || '')} · ${fmt(String(last.created_at).slice(0, 10))}<br>Версию реестра укажите при фиксации оценки (п. 16.5).</div>`
      : '<div class="ref" style="margin-top:8px">Расчёт ещё не выполнялся.</div>'}
  </div>`;
}

async function runCapacity(button) {
  const ok = await act(button, () => api.capacityCheck(sheetRequest.id, null), 'Расчёт выполнен и сохранён');
  if (ok) await openSheet(sheetRequest.number, true);
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('on');
  if (routing || !routeOf().card) return;
  // Открыли из системы — «Назад» в истории; пришли по ссылке — просто убираем номер из адреса.
  if (cardInHistory) { cardInHistory = false; history.back(); }
  else history.replaceState(null, '', '#/' + view + filterQuery());
}

/* --------------------- договоры и оплата по услугам (A1, В6, В8) --------------------- */

/** Сводка договоров: по каждой услуге — номер, оплата, АВР (пп. 21, 32, 48, 86, 91–95). */
function contractsSummary(r) {
  if (!state.live) {
    return r.contractNumber
      ? `${esc(r.contractNumber)} · ${r.paidAt ? '<span class="chip g">оплачен</span>' : '<span class="chip n">не оплачен</span>'}`
      : '<span class="ref">не заключены</span>';
  }
  return r.services.map((s) => {
    if ((r.freeServices || []).includes(s)) return `<div>${s} — <span class="ref">безвозмездно, п. 20</span></div>`;
    const c = (r.contracts || []).find((x) => x.service === s);
    if (!c) return `<div>${s} — <span class="ref">договора нет</span></div>`;
    return `<div>${s} — ${esc(c.number)} ${c.acceptedAt ? `<span class="chip g">исполнен ${fmt(c.acceptedAt)}</span>`
      : c.avrSentAt ? `<span class="chip w">АВР направлен ${fmt(c.avrSentAt)}</span>`
      : c.paidAt ? `<span class="chip g">оплата ${fmt(c.paidAt)}</span>` : '<span class="chip n">не оплачен</span>'}</div>`;
  }).join('');
}

/** Услуга договора оказана — можно оформлять АВР (раздел 11). */
function serviceDone(r, service) {
  if (['avr', 'closing'].includes(r.stageCode)) return true;
  const passed = sheetCard?.request?.passedStages || [];
  if (service === 'ТУ') return passed.includes('tu');
  if (service === 'ПСД') return passed.includes('psd');
  return passed.includes('smr') || !!r.technicalAvrApproved;
}

function avrCell(c, r) {
  if (!c.paid_at) return '<span class="ref">после оплаты</span>';
  if (c.accepted_at) return `<span class="chip g">принято ${fmt(c.accepted_at)}</span>${c.accepted_by_silence ? '<br><span class="ref">по истечении срока, п. 94</span>' : ''}`;
  const done = serviceDone(r, c.service);
  if (!done) return '<span class="ref">услуга оказывается</span>';
  const canAct = can('request.contract');
  const parts = [];
  if (c.avr_sent_at) {
    parts.push(`<span class="chip w">направлен ${fmt(c.avr_sent_at)}</span>`);
    if (c.avr_objection) parts.push(`<br><span class="ref" style="color:var(--bad)">замечания: ${esc(c.avr_objection)}</span>`);
    if (canAct) parts.push(`<div class="row-actions" style="justify-content:flex-start;margin-top:6px">
      <button class="btn primary sm" onclick="contractAvr(this,'${c.id}','accept')">Подписан</button>
      <button class="btn sm" onclick="contractAvr(this,'${c.id}','objection')">${c.avr_objection ? 'Замечания урегулированы' : 'Замечания'}</button></div>`);
  } else {
    parts.push(c.avr_approved ? '<span class="chip g">АВР завизирован</span>' : '<span class="chip n">АВР не загружен</span>');
    if (c.avr_formed_at) parts.push(`<br><span class="ref">оформлен ${fmt(c.avr_formed_at)}</span>`);
    if (canAct) parts.push(`<div class="row-actions" style="justify-content:flex-start;margin-top:6px">
      ${!c.avr_formed_at ? `<button class="btn sm" onclick="contractAvr(this,'${c.id}','formed')">АВР и ЭСФ оформлены</button>` : ''}
      <button class="btn primary sm" ${c.avr_approved ? '' : 'disabled title="Сначала загрузите и завизируйте АВР по договору"'}
        onclick="contractAvr(this,'${c.id}','sent')">Направлен Заказчику</button></div>`);
  }
  return parts.join('');
}

function contractsBlock(r) {
  if (!state.live || !can('request.contract')) return '';
  if (r.tvStatus !== 'confirmed' && !(sheetCard?.contracts || []).length) return '';
  const all = sheetCard?.contracts || [];
  const contracts = all.filter((c) => c.status !== 'terminated');
  const terminated = all.filter((c) => c.status === 'terminated');
  const closed = stageBy[r.stageCode].terminal;
  const withoutContract = closed ? [] : r.services.filter((s) =>
    !(r.freeServices || []).includes(s) && !contracts.some((c) => c.service === s));
  const amendments = sheetCard?.amendments || [];
  return `<section class="panel">
    <div class="panel-head"><div><h2>Договоры, оплата и АВР</h2>
      <p>Свой договор, оплата и АВР на каждую услугу — пп. 21, 32, 48, 86, 91–95. СМР — после утверждения сметы, п. 53</p></div></div>
    <div class="panel-body">
      ${contracts.length ? `<div class="scroll-x"><table><thead><tr><th>Услуга</th><th>Договор</th><th class="num">Сумма</th>
        <th>Оплата</th><th>АВР и приёмка</th><th></th></tr></thead><tbody>
        ${contracts.map((c) => `<tr><td>${esc(c.service)}</td>
          <td><b>${esc(c.number)}</b><br><span class="ref">${c.signed_at ? 'подписан ' + fmt(c.signed_at) : 'не подписан'}</span></td>
          <td class="num">${c.amount === null ? '—' : money(Number(c.amount))}</td>
          <td>${c.paid_at ? `<span class="chip g">100 % · ${fmt(c.paid_at)}</span>`
            : closed ? '—' : `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                <input type="date" id="pay-${c.id}" aria-label="Дата поступления оплаты" value="${today()}" max="${today()}" style="width:150px">
                <button class="btn primary sm" onclick="payContract(this,'${c.id}')">Оплата поступила</button></div>`}</td>
          <td>${avrCell(c, r)}</td>
          <td>${closed || c.accepted_at ? '' : `<div class="row-actions">
            <button class="btn ghost sm" onclick="addAmendment(this,'${c.id}','${esc(c.number)}','${esc(c.service)}')">Допсоглашение</button>
            <button class="btn ghost sm" onclick="terminateContract(this,'${c.id}','${esc(c.number)}',${c.paid_at ? 'true' : 'false'})">Расторгнуть</button></div>`}</td></tr>`).join('')}
        </tbody></table></div>` : '<div class="ref" style="margin-bottom:10px">Договоров пока нет.</div>'}
      ${amendments.length ? `<div class="ref" style="margin-top:10px">Дополнительные соглашения (пп. 45, 64–65):</div>
        ${amendments.map((a) => `<div class="ref">· ${esc(a.contract_number)}: № ${esc(a.number)} от ${fmt(a.signed_at)}
          ${a.amount !== null ? ` — сумма ${money(Number(a.amount))}` : ''}${a.extend_days ? ` — срок +${a.extend_days} р.д.` : ''} · ${esc(a.reason)}</div>`).join('')}` : ''}
      ${terminated.length ? `<div class="ref" style="margin-top:10px">Расторгнутые: ${terminated.map((c) =>
        `${esc(c.service)} ${esc(c.number)} (${fmt(c.terminated_at)}${c.refund_amount ? `, возврат ${money(Number(c.refund_amount))}` : ''})`).join('; ')}</div>` : ''}
      ${withoutContract.length && r.tvStatus === 'confirmed' ? `<div class="form-grid" style="margin-top:14px">
        <div class="field"><label>Услуга</label>
          <select id="ctService">${withoutContract.map((s) => `<option>${s}</option>`).join('')}</select>
          ${withoutContract.includes('СМР') && !r.estimateApproved
            ? '<div class="hint">Договор на СМР — после утверждения сметы (п. 53)</div>' : ''}</div>
        <div class="field"><label>Номер договора</label><input id="ctNumber" placeholder="ДП-101/26"></div>
        <div class="field"><label>Сумма, ₸</label><input id="ctAmount" inputmode="decimal"></div>
        <div class="field"><label>Дата подписания</label><input id="ctSigned" type="date" max="${today()}"></div>
        <div class="field"><label>Дата счёта</label><input id="ctInvoice" type="date" max="${today()}"></div>
      </div>
      <div style="margin-top:12px"><button class="btn primary sm" onclick="addContract(this)">Зарегистрировать договор</button>
        <span class="ref">расчётам с контрагентами уйдёт письмо на выставление счёта, пп. 84–85</span></div>` : ''}
    </div></section>`;
}

async function addContract(button) {
  const body = {
    service: document.getElementById('ctService').value,
    number: document.getElementById('ctNumber').value.trim(),
    amount: document.getElementById('ctAmount').value.trim() || null,
    signedAt: document.getElementById('ctSigned').value || null,
    invoiceAt: document.getElementById('ctInvoice').value || null,
  };
  const ok = await act(button, () => api.addContract(sheetRequest.id, body), 'Договор зарегистрирован');
  if (ok) await refreshSheet();
}

async function payContract(button, contractId) {
  const paidAt = document.getElementById('pay-' + contractId).value;
  const ok = await act(button, () => api.payContract(contractId, paidAt), 'Поступление оплаты зафиксировано');
  if (ok) await refreshSheet();
}

/** Расторжение договора и возврат средств (пп. 96–97, В8). */
async function terminateContract(button, contractId, number, paid) {
  const values = await ask({
    title: `Расторжение договора ${number}`, danger: true, ok: 'Расторгнуть',
    text: 'Договор перестаёт действовать. Возврат указывается только по оплаченному договору — расчётам с контрагентами уйдёт заявка на возврат (п. 97).',
    fields: [
      { key: 'reason', label: 'Основание', type: 'textarea', required: true, minLength: 5, ph: 'Письмо Заказчика исх. № … от …; соглашение о расторжении' },
      ...(paid ? [{ key: 'refundAmount', label: 'Сумма возврата, ₸', type: 'text', ph: '0' }] : []),
    ],
  });
  if (!values) return;
  const ok = await act(button, () => api.terminateContract(contractId, values), 'Договор расторгнут');
  if (ok) await refreshSheet();
}

/** Дополнительное соглашение: новая сумма и (или) продление срока (пп. 45, 64–65). */
async function addAmendment(button, contractId, number, service) {
  const values = await ask({
    title: `Дополнительное соглашение к договору ${number}`,
    text: `Услуга «${service}». Продление срока действует, пока услуга оказывается.`,
    fields: [
      { key: 'number', label: 'Номер соглашения', required: true },
      { key: 'signedAt', label: 'Дата подписания', type: 'date', required: true, value: today(), max: today() },
      { key: 'amount', label: 'Новая сумма договора, ₸', ph: 'по пересчитанной смете' },
      { key: 'extendDays', label: 'Продлить срок на, рабочих дней', type: 'number', min: 1 },
      { key: 'reason', label: 'Основание', type: 'textarea', required: true, minLength: 5, ph: 'Пересчёт сметы, изменение объёма работ' },
    ],
  });
  if (!values) return;
  const body = { ...values, extendDays: values.extendDays ? Number(values.extendDays) : null, amount: values.amount || null };
  const ok = await act(button, () => api.addAmendment(contractId, body), 'Дополнительное соглашение зарегистрировано');
  if (ok) await refreshSheet();
}

/** Реквизиты АВР договора: оформлен, направлен, подписан, замечания (п. 91–95). */
async function contractAvr(button, contractId, what) {
  let body = null;
  if (what === 'formed') {
    const v = await ask({ title: 'АВР и ЭСФ оформлены', text: 'Не позднее 1 операционного дня после оказания услуги (п. 91).',
      fields: [{ key: 'formedAt', label: 'Дата оформления', type: 'date', required: true, value: today(), max: today() }] });
    if (v) body = v;
  }
  if (what === 'sent') {
    const v = await ask({ title: 'АВР и ЭСФ направлены Заказчику', text: 'От этой даты — 10 рабочих дней на подписание или мотивированные замечания (п. 94). Заказчику уйдёт письмо.',
      fields: [{ key: 'sentAt', label: 'Дата направления', type: 'date', required: true, value: today(), max: today() }] });
    if (v) body = v;
  }
  if (what === 'accept') {
    const v = await ask({ title: 'Заказчик подписал АВР', text: 'Работы по договору приняты, договор исполнен (пп. 95, 127). Подписанный АВР загрузите новой версией документа.',
      fields: [{ key: 'acceptedAt', label: 'Дата подписания', type: 'date', required: true, value: today(), max: today() }] });
    if (v) body = v;
  }
  if (what === 'objection') {
    const c = (sheetCard?.contracts || []).find((x) => x.id === contractId);
    if (c?.avr_objection) {
      if (await ask({ title: 'Замечания урегулированы', text: 'Срок приёмки по молчанию снова отсчитывается от даты направления АВР.' })) body = { objection: null };
    } else {
      const v = await ask({ title: 'Мотивированные замечания Заказчика к АВР', text: 'Пока замечания не урегулированы, приёмка по истечении срока не наступает (п. 94).',
        fields: [{ key: 'objection', label: 'Замечания', type: 'textarea', required: true, minLength: 10 }] });
      if (v) body = v;
    }
  }
  if (!body) return;
  const ok = await act(button, () => api.contractAvr(contractId, body), 'Сохранено');
  if (ok) await refreshSheet();
}

/** Печатная форма КП по позициям заявки и Прейскуранту (п. 21; правило 4). */

  const r = sheetRequest;
  const lines = (sheetCard?.services || []).map((s) => [C.services[s.service] || s.service, (s.params || {}).scope || '',

    <style>body{font:13px/1.5 Arial,sans-serif;margin:32px;color:#111}h1{font-size:17px}table{border-collapse:collapse;width:100%;margin:14px 0}
    th,td{border:1px solid #999;padding:6px 8px;text-align:left;vertical-align:top}th{background:#eee}.r{text-align:right}
    @page{size:A4;margin:16mm}</style></head><body>
    <p style="text-align:right">АО «Казтелерадио»</p>
    <h1>Коммерческое предложение по заявке ${esc(r.number)}</h1>
    <p>Заказчик: ${esc(r.customer)}<br>Объект: ${esc(r.object)}<br>Дата: ${new Date().toLocaleDateString('ru-RU')}</p>
    <table><thead><tr><th>Услуга</th><th>Состав работ</th><th class="r">Стоимость</th></tr></thead><tbody>
    ${lines.map((l) => `<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td><td class="r">${esc(l[2])}</td></tr>`).join('')}
    <tr><th colspan="2">Итого</th><th class="r">${esc(money(r.amount))}</th></tr></tbody></table>
    <p>Стоимость определена по действующему Прейскуранту Общества суммой всех позиций заявки (п. 21 Регламента ОРПСД-Р-01).
    Стоимость СМР определяется по утверждённой сметной документации (п. 49). Работы выполняются после 100 % предварительной
    оплаты (п. 86); срок оплаты по оферте — 10 рабочих дней.</p>
    <p style="margin-top:40px">Исполнитель: ____________________</p>
    <script>window.onload = () => window.print();<\/script></body></html>`);
  w.document.close();
}

/* ------------- реквизиты, от которых зависят переходы (A1, A6) ------------- */

function closingBlock(r) {
  if (!state.live || !can('request.contract') || stageBy[r.stageCode].terminal) return '';
  const orpsd = hasRole('orpsd', 'admin');
  const rows = [];
  if (orpsd && (r.services.includes('ПСД') || r.services.includes('СМР')) &&
      ['offer', 'awaiting_payment', 'psd', 'tu'].includes(r.stageCode)) {
    rows.push(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${r.estimateApproved ? 'checked' : ''}
        onchange="saveFlags(this, { estimateApproved: this.checked })"> Сметная документация утверждена</label>
      <span class="ref pin">пп. 41, 52</span>${r.services.includes('ПСД') ? '<span class="ref">после двух уровней проверки</span>' : ''}</div>`);
  }
  if (orpsd && r.services.includes('СМР') && ['smr_prep'].includes(r.stageCode)) {
    rows.push(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input id="flOrder" value="${esc(r.orderNumber || '')}" placeholder="№ распоряжения" style="max-width:200px">
      <button class="btn sm" onclick="saveFlags(this, { orderNumber: document.getElementById('flOrder').value })">Сохранить распоряжение</button>
      <span class="ref pin">п. 60</span></div>`);
  }
  if (orpsd && ['tu', 'psd'].includes(r.stageCode)) {
    rows.push(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${r.resultDelivered ? 'checked' : ''}
        onchange="saveFlags(this, { resultDelivered: this.checked })"> Результат утверждён и передан Заказчику</label>
      <span class="ref pin">пп. 24, 42</span>${r.stageCode === 'tu' ? '<span class="ref">копия ТУ уйдёт в филиал, п. 26</span>' : ''}</div>`);
  }
  if (r.stageCode === 'avr' && !(r.contracts || []).length) {
    rows.push(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="date" id="flAvrSent" value="${r.avrSentAt || today()}" max="${today()}" style="width:160px">
      <button class="btn sm" ${r.avrApproved ? '' : 'disabled title="Сначала загрузите и завизируйте АВР"'}
        onclick="saveFlags(this, { avrSentAt: document.getElementById('flAvrSent').value })">АВР и ЭСФ направлены</button>
      <span class="ref pin">пп. 91–92</span></div>`);
  }
  if (r.stageCode === 'avr' && (r.contracts || []).length) {
    rows.push(`<div class="ref">АВР и ЭСФ отмечаются по каждому договору в таблице «Договоры, оплата и АВР» (п. 91).</div>`);
  }
  if (r.stageCode === 'closing') {
    rows.push(`<div class="ref">АВР направлен ${fmt(r.avrSentAt)}; без подтверждения и мотивированных
      замечаний в течение 10 рабочих дней работы считаются принятыми (п. 94). Приёмка отмечается по договорам.</div>`);
    if (!(r.contracts || []).length) {
      rows.push(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn primary sm" onclick="saveFlags(this, { closingConfirmed: true })">Заказчик подтвердил приёмку</button></div>`);
    }
  }
  if (!rows.length) return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Реквизиты этапа</h2>
      <p>Каждое изменение пишется в журнал со ссылкой на пункт</p></div></div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:12px">${rows.join('')}</div></section>`;
}

async function saveFlags(control, body) {
  const ok = await act(control.tagName === 'BUTTON' ? control : null,
    () => api.setFlags(sheetRequest.id, { ...body, version: sheetRequest.version }), 'Сохранено');
  if (ok) await refreshSheet();
  else if (control.type === 'checkbox') control.checked = !control.checked;
}

/* ------------------ контрольные точки (пп. 23, 34, 41, 57, 67–69) ------------------ */

function checkpointsBlock(r) {
  if (!state.live || isCustomerUser()) return '';
  const list = (sheetCard?.checkpoints || []).filter((c) => c.stages.includes(r.stageCode) || c.done);
  if (!list.length) return '';
  const myRoles = state.me?.roles || [];
  return `<section class="panel">
    <div class="panel-head"><div><h2>Контрольные точки</h2>
      <p>Согласования и проверки, установленные Регламентом; от части из них зависит передача результата</p></div></div>
    <div class="panel-body">
      ${list.map((c) => {
        const mine = c.roles.some((x) => myRoles.includes(x));
        const active = c.stages.includes(r.stageCode) && !stageBy[r.stageCode].terminal;
        return `<div class="cp ${c.done ? 'ok' : ''}">
          <span class="st">${c.done ? '✓' : ''}</span>
          <span style="flex:1">${esc(c.title)} <span class="ref pin">${esc(c.regulationRef)}</span>
            ${c.done ? `<br><span class="ref">${fmt(c.done.done_at)} · ${esc(c.done.author)}${c.done.note ? ' · ' + esc(c.done.note) : ''}</span>` : ''}</span>
          ${active && mine ? (c.done
            ? (c.done.done_by === state.me?.id || hasRole('admin') ? `<button class="btn ghost sm" onclick="unmarkCheckpoint(this,'${c.code}')">Снять</button>` : '')
            : `<button class="btn sm" onclick="markCheckpoint(this,'${c.code}')">Отметить</button>`) : ''}
        </div>`;
      }).join('')}
    </div></section>`;
}

async function markCheckpoint(button, code) {
  const def = (sheetCard?.checkpoints || []).find((c) => c.code === code);
  const values = await ask({
    title: def?.title || 'Отметка', text: def?.differentFrom ? 'Второй уровень проверки выполняет не тот специалист, что первый (пп. 40–41).' : '',
    fields: [
      { key: 'doneAt', label: 'Дата', type: 'date', required: true, value: today(), max: today() },
      { key: 'note', label: def?.noteRequired ? 'Причина и реквизиты' : 'Комментарий', type: 'textarea', required: !!def?.noteRequired, minLength: def?.noteRequired ? 10 : 0 },
    ],
  });
  if (!values) return;
  const ok = await act(button, () => api.markCheckpoint(sheetRequest.id, { code, ...values }), 'Отметка сохранена');
  if (ok) await refreshSheet();
}

async function unmarkCheckpoint(button, code) {
  if (!await ask({ title: 'Снять отметку?', text: 'Отметка будет удалена, действие запишется в журнал.', ok: 'Снять', danger: true })) return;
  const ok = await act(button, () => api.unmarkCheckpoint(sheetRequest.id, code), 'Отметка снята');
  if (ok) await refreshSheet();
}

/* ------------------------ документы этапа (пп. 24, 42, 58, 60, 66, 91) ------------------------ */

/** Какие документы подразделение загружает на этапе (В2). */
function stageDocuments(r) {
  const out = [];
  const branch = hasRole('branch', 'admin');
  const orpsd = hasRole('orpsd', 'admin');
  if (orpsd && r.stageCode === 'offer') out.push(['КП', 'Коммерческое предложение', 'п. 21'], ['Договор', 'Договор', 'пп. 21, 32, 48']);
  if (orpsd && r.stageCode === 'tu') out.push(['ТУ', 'Технические условия', 'пп. 24, 31']);
  if (orpsd && r.stageCode === 'psd') out.push(['ПСД (РП)', 'Рабочий проект', 'пп. 42, 47']);
  if (orpsd && r.stageCode === 'smr_prep') out.push(['Распоряжение', 'Распоряжение на СМР', 'п. 60']);
  if (branch && r.stageCode === 'smr_prep') out.push(['Акт приема-передачи', 'Акт приёма-передачи оборудования', 'п. 58']);
  if (branch && r.stageCode === 'smr') out.push(['Технический АВР', 'Технический АВР', 'п. 66']);
  return out;
}

function documentsBlock(r) {
  if (!state.live || isCustomerUser()) return '';
  const docs = (sheetCard?.documents || []).filter((d) => d.kind !== 'Приложение');
  const upload = can('documents.upload') && !stageBy[r.stageCode].terminal ? stageDocuments(r) : [];
  // АВР — по каждому договору, чья услуга оказана (В6).
  const avrContracts = hasRole('orpsd', 'admin') && can('documents.upload')
    ? (sheetCard?.contracts || []).filter((c) => c.status !== 'terminated' && c.paid_at && !c.accepted_at && serviceDone(r, c.service)) : [];
  if (!docs.length && !upload.length && !avrContracts.length) return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Документы по заявке</h2>
      <p>Документ привязывается к заявке; переход открывается после визирования</p></div></div>
    <div class="panel-body">
      ${docs.length ? `<div class="scroll-x"><table><tbody>${docs.map((d) => `<tr>
        <td><b>${esc(d.kind)}</b> ${esc(d.number)}<br><span class="ref">${fmt(d.doc_date)}${d.valid_until ? ' · действует до ' + fmt(d.valid_until) : ''}${d.form_code ? ' · форма ' + esc(d.form_code) : ''}</span></td>
        <td>${d.approved ? '<span class="chip g">завизирован</span>' : '<span class="chip w">ожидает визы</span>'}${d.late_upload ? ' <span class="chip r">позже 2 р.д.</span>' : ''}</td>
        <td><div class="row-actions">
          <a class="btn sm" href="${api.requestFileUrl(r.id, d.id)}">${icon('download', 14)}Скачать</a>
          ${can('documents.approve') && !d.approved ? `<button class="btn primary sm" onclick="approveInSheet(this,'${d.id}')">Завизировать</button>` : ''}
          ${can('documents.view') ? `<button class="btn ghost sm" onclick="openDocument('${d.id}')">Карточка</button>` : ''}
        </div></td></tr>`).join('')}</tbody></table></div>` : ''}
      ${upload.length || avrContracts.length ? `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:${docs.length ? 12 : 0}px">
        ${upload.map(([kind, label, ref]) => `<button class="btn sm" onclick="openUploadFor('${kind}')">
          ${icon('filePlus', 15)}Загрузить: ${label}</button><span class="ref pin">${ref}</span>`).join('')}
        ${avrContracts.map((c) => `<button class="btn sm" onclick="openUploadFor('АВР','${c.id}')">
          ${icon('filePlus', 15)}АВР по договору ${esc(c.number)} (${esc(c.service)})</button>`).join('')}
      </div>` : ''}
    </div></section>`;
}

async function approveInSheet(button, id) {
  const ok = await act(button, () => api.approveDocument(id), 'Документ завизирован');
  if (ok) { D.pendingVisa = Math.max(0, (D.pendingVisa || 1) - 1); await refreshSheet(); }
}

/* ------------------------ приложения к заявке (п. 7.6, К5) ------------------------ */

function attachmentsBlock(r) {
  if (!state.live) return '';
  const list = (sheetCard?.documents || []).filter((d) => d.kind === 'Приложение');
  const open = sheetCard?.attachmentsOpen?.ok && can('request.attach');
  if (!list.length && !open) return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Приложения к заявке</h2>
      <p>Ситуационный план, схема, чертёж, пояснительная документация — п. 7.6</p></div></div>
    <div class="panel-body">
      ${list.length ? list.map((d) => `<div class="remark" style="border-color:var(--line);background:#FAFBFE;align-items:center">
        <span style="flex:1">${esc(d.file_name || d.number)} <span class="ref">${fileSize(d.size_bytes)} · ${fmt(d.doc_date)}</span></span>
        <a class="btn sm" href="${api.requestFileUrl(r.id, d.id)}">${icon('download', 14)}Скачать</a>
        ${open ? `<button class="btn ghost sm" onclick="deleteAttachment(this,'${d.id}')">Удалить</button>` : ''}
      </div>`).join('') : '<div class="ref">Файлов нет.</div>'}
      ${open ? `<div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
        <input id="attFiles" type="file" multiple aria-label="Файлы для приложения к заявке" accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx,.zip">
        <button class="btn primary sm" onclick="uploadAttachments(this)">Приложить</button>
        <span class="ref">PDF, PNG, JPG, DOCX, XLSX, ZIP — до 20 МБ каждый, не более 10 за раз</span></div>` : ''}
    </div></section>`;
}

async function uploadAttachments(button, inputId = 'attFiles', requestId = null) {
  const files = [...document.getElementById(inputId).files];
  if (!files.length) { toast('Выберите файлы', 'bad'); return null; }
  const form = new FormData();
  for (const f of files) form.append('file', f, f.name);
  const ok = await act(button, () => api.uploadAttachments(requestId || sheetRequest.id, form), `Приложено файлов: ${files.length}`);
  if (ok && !requestId) await refreshSheet();
  return ok;
}

async function deleteAttachment(button, docId) {
  if (!await ask({ title: 'Удалить приложение?', text: 'Файл будет удалён из заявки.', ok: 'Удалить', danger: true })) return;
  const ok = await act(button, () => api.deleteAttachment(sheetRequest.id, docId), 'Приложение удалено');
  if (ok) await refreshSheet();
}

/* ---------------------- служебные записки в филиал (A3) ---------------------- */

function memosBlock(r) {
  if (!state.live || isCustomerUser()) return '';
  const memos = sheetCard?.memos || [];
  const canCreate = can('memo.create') && !stageBy[r.stageCode].terminal && !!r.branchId;
  if (!memos.length && !canCreate) return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Служебные записки в филиал</h2>
      <p>Ответ филиала — не позднее 3 рабочих дней, п. 10; просрочка эскалируется по п. 100</p></div></div>
    <div class="panel-body">
      ${memos.map(memoRow).join('')}
      ${canCreate ? `<div class="form-grid" style="margin-top:12px">
        <div class="field span2"><label>Тема</label><input id="mmSubject" placeholder="Загрузка яруса 35 м"></div>
        <div class="field span2"><label>Запрос</label>
          <textarea id="mmBody" rows="3" placeholder="Какая информация требуется от филиала"></textarea></div>
      </div>
      <div style="margin-top:10px"><button class="btn primary sm" onclick="createMemo(this)">Направить в ${esc(r.branch)}</button></div>` : ''}
    </div></section>`;
}

function memoRow(m) {
  const late = !m.answered_at && m.due_at < today();
  return `<div class="remark" style="flex-direction:column;align-items:stretch;gap:6px;border-color:var(--line);background:#FAFBFE">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <b>${esc(m.subject || 'Служебная записка')}</b>
      <span class="ref">${esc(m.request_number || '')} · ${esc(m.branch_name || '')} · срок ${fmt(m.due_at)}</span>
      <span style="margin-left:auto">${m.answered_at ? '<span class="chip g">ответ получен</span>'
        : late ? `<span class="chip r">просрочен${m.escalation_level ? ' · эск. ' + m.escalation_level : ''}</span>`
        : '<span class="chip w">ожидает ответа</span>'}</span>
    </div>
    <div style="color:var(--ink)">${esc(m.body)}</div>
    ${m.answered_at ? `<div class="note">${esc(m.answer)}<br><span class="ref">${esc(m.answered_by_name || '')}</span></div>`
      : can('memo.answer') ? `<div style="display:flex;gap:8px;flex-wrap:wrap">
          <input id="ans-${m.id}" placeholder="Ответ филиала по существу запроса" style="flex:1;min-width:200px">
          <button class="btn primary sm" onclick="answerMemo(this,'${m.id}')">Ответить</button></div>` : ''}
  </div>`;
}

async function createMemo(button) {
  const body = { subject: document.getElementById('mmSubject').value.trim(), body: document.getElementById('mmBody').value.trim() };
  const ok = await act(button, () => api.createMemo(sheetRequest.id, body), 'Служебная записка направлена в филиал');
  if (ok) await openSheet(sheetRequest.number, true);
}

async function answerMemo(button, memoId) {
  const answer = document.getElementById('ans-' + memoId).value.trim();
  const ok = await act(button, () => api.answerMemo(memoId, answer), 'Ответ зафиксирован');
  if (!ok) return;
  if (document.getElementById('sheet').classList.contains('on') && sheetRequest) await openSheet(sheetRequest.number, true);
  else { state.loaded.delete('memos'); await reloadCurrent(); }
}

/* ------------------------------ поручения по заявке (В5) ------------------------------ */

function assignmentsBlock(r) {
  if (!state.live || !can('assignment.view')) return '';
  const list = sheetCard?.assignments || [];
  const canCreate = can('assignment.close') && !stageBy[r.stageCode].terminal;
  if (!list.length && !canCreate) return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Поручения</h2>
      <p>Контроль ОКО: что поручено, кому и исполнено ли в срок — ТЗ №7, раздел 4</p></div>
      ${canCreate ? `<button class="btn sm" style="margin-left:auto" onclick="newAssignment(this)">${icon('plus', 14)}Поручить</button>` : ''}</div>
    <div class="panel-body">
      ${list.length ? list.map((a) => {
        const [label, cls] = ASSIGNMENT_STATUS[a.status] || [a.status, 'n'];
        return `<div class="remark" style="border-color:var(--line);background:#FAFBFE;flex-wrap:wrap">
          <span class="chip ${cls}">${label}</span>
          <span style="flex:1;min-width:200px"><b>${esc(a.department)}</b>${a.assignee_name ? ' · ' + esc(a.assignee_name) : ''}
            — ${esc(a.body || 'ответ о технической возможности')}<br>
            <span class="ref">срок ${fmt(a.due_at)}${a.fulfilled_at ? ` · исполнено ${fmt(String(a.fulfilled_at).slice(0, 10))} ${a.fulfilled_on_time ? '<b style="color:var(--ok-ink)">в срок</b>' : '<b style="color:var(--bad)">с нарушением срока</b>'}` : ''}
            ${a.close_note ? ' · ' + esc(a.close_note) : ''}</span></span>
          <span class="row-actions">
            ${a.status === 'open' && can('assignment.accept') ? `<button class="btn sm" onclick="acceptAssignment(this,'${a.id}')">Принять</button>` : ''}
            ${['open', 'in_progress'].includes(a.status) && can('assignment.close') ? `<button class="btn sm" onclick="closeAssignment(this,'${a.id}')">Закрыть</button>` : ''}
          </span></div>`;
      }).join('') : '<div class="ref">Поручений нет.</div>'}
    </div></section>`;
}

async function newAssignment(button) {
  if (!D.departments) D.departments = (await api.assignmentDepartments().catch(() => ({ departments: [] }))).departments;
  const deps = D.departments || [];
  const users = deps.flatMap((d) => d.users.map((u) => ({ value: u.id, label: `${u.name} — ${d.name}` })));
  const values = await ask({
    title: `Поручение по заявке ${sheetRequest.number}`,
    text: 'Исполнителю или подразделению уйдёт письмо; исполнение контролирует ОКО.',
    fields: [
      { key: 'department', label: 'Подразделение', type: 'select', required: true, options: deps.map((d) => ({ value: d.name, label: d.name })) },
      { key: 'assigneeId', label: 'Исполнитель', type: 'select', options: [{ value: '', label: '— подразделение целиком —' }, ...users] },
      { key: 'dueAt', label: 'Срок', type: 'date', required: true, value: today() },
      { key: 'body', label: 'Что поручается', type: 'textarea', required: true, minLength: 10 },
    ],
  });
  if (!values) return;
  const ok = await act(button, () => api.createAssignment(sheetRequest.id, { ...values, assigneeId: values.assigneeId || null }), 'Поручение направлено');
  if (ok) await refreshSheet();
}

/* --------------------------- приостановка СМР (пп. 63, 80) --------------------------- */

function pauseBlock(r) {
  if (!state.live || r.stageCode !== 'smr' || !hasRole('branch', 'orpsd', 'admin')) return '';
  const current = sheetCard?.currentStage;
  const paused = current?.pausedAt || current?.paused_at;

    <div class="panel-head"><div><h2>Приостановка работ</h2>
      <p>Изменения в проекте (п. 63) и неблагоприятная погода (п. 80): время приостановки не входит в срок СМР</p></div></div>
    <div class="panel-body" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      ${paused
        ? `<span class="chip w">приостановлено с ${fmt(paused)}</span><span class="ref">${esc(current.pauseReason || current.pause_reason || '')}</span>
           <button class="btn primary sm" onclick="resumeWorks(this)">Возобновить работы</button>`
        : `<button class="btn sm" onclick="pauseWorks(this)">Приостановить СМР</button>
           ${current?.pausedDays || current?.paused_days ? `<span class="ref">уже приостанавливалось на ${current.pausedDays || current.paused_days} дн.</span>` : ''}`}

async function pauseWorks(button) {
  const values = await ask({ title: 'Приостановить выполнение СМР', text: 'Заказчику уйдёт уведомление; срок продлится на время приостановки.',
    fields: [{ key: 'reason', label: 'Основание', type: 'textarea', required: true, minLength: 10,
      ph: 'Изменение проектных решений по письму …; штормовое предупреждение МЧС от …' }] });
  if (!values) return;
  const ok = await act(button, () => api.pause(sheetRequest.id, values.reason), 'Работы приостановлены');
  if (ok) await refreshSheet();
}

async function resumeWorks(button) {
  const ok = await act(button, () => api.resume(sheetRequest.id), 'Работы возобновлены, срок продлён');
  if (ok) await refreshSheet();
}

/* --------------------------- продление срока ПСД (п. 33, Н4) --------------------------- */

/**
 * Продление без допсоглашения — только разработка ПСД, не более 15 рабочих дней
 * с письменным уведомлением Заказчика (п. 33). Остальные сроки продлеваются
 * дополнительным соглашением к договору (пп. 45, 64) — в таблице договоров.
 */
function extensionBlock(r) {
  if (!state.live || !can('request.extend') || r.stageCode !== 'psd') return '';
  const current = sheetCard?.currentStage;
  if (!current || !current.dueAt) return '';
  const used = current.extendedBy || 0;
  return `<section class="panel">
    <div class="panel-head"><div><h2>Продление срока ПСД</h2>
      <p>Не более 15 рабочих дней с письменным уведомлением Заказчика — п. 33</p></div></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="field"><label>Рабочих дней</label><input id="exDays" type="number" min="1" max="${Math.max(1, 15 - used)}" value="${Math.min(5, Math.max(1, 15 - used))}"></div>
        <div class="field"><label>Основание</label><input id="exReason" placeholder="Уведомление Заказчика исх. № …"></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">

async function resolveRemark(button, remarkId) {

let cpTimer = null;
function searchCounterparties(q) {
  clearTimeout(cpTimer);
  cpTimer = setTimeout(async () => {
    if (q.trim().length < 2) return;
    const { counterparties } = await api.counterparties(q.trim()).catch(() => ({ counterparties: [] }));
    cpOptions = counterparties;
    document.getElementById('usCp').innerHTML = '<option value="">—</option>' +
      counterparties.map((c) => `<option value="${c.id}">${esc(c.name_full)} · БИН ${esc(c.bin)}</option>`).join('');
  }, 300);
}

async function saveUserForm(button, existing) {
  const body = {
    email: document.getElementById('usEmail').value.trim(),
    fullName: document.getElementById('usName').value.trim(),
    position: document.getElementById('usPosition').value.trim(),
    department: document.getElementById('usDepartment').value.trim(),
    roles: [...document.querySelectorAll('input[name=usRole]:checked')].map((x) => x.value),
    branchId: document.getElementById('usBranch').value || null,
    counterpartyId: document.getElementById('usCp').value || null,
    isHead: document.getElementById('usHead').checked,
  };
  if (existing) body.isActive = (D.users || []).find((u) => u.email === body.email)?.is_active !== false;
  const ok = await act(button, () => api.saveUser(body), 'Учётная запись сохранена');
  if (ok) { closeSheet(); state.loaded.delete('users'); await reloadCurrent(); }
}

async function toggleUser(button, id, on) {
  if (!on && !window.confirm('Отключить учётную запись? Сотрудник потеряет доступ.')) return;
  const ok = await act(button, () => (on ? api.enableUser(id) : api.disableUser(id)),
    on ? 'Учётная запись включена' : 'Учётная запись отключена');
  if (ok) { state.loaded.delete('users'); await reloadCurrent(); }
}

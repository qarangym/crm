      <div style="margin-top:22px;display:flex;gap:10px;justify-content:center">
        <button class="btn" onclick="wiz=null;go('mine')">Мои заявки</button>
        <button class="btn primary" onclick="wiz=null;render()">Подать ещё одну</button>
      </div>
    </div></section>`;
}

/* ====================== КАБИНЕТ ЗАКАЗЧИКА ====================== */
function renderMine() {
  // В рабочем режиме сервер уже ограничил выборку своей организацией (ТЗ №14).
  const mine = state.live ? D.requests : D.requests.filter(r => r.customer === 'ТОО «Спектр Телеком»');
  return `<section class="panel"><div class="panel-body" style="padding:0 6px">
    <table><thead><tr><th>Номер</th><th>Объект</th><th>Услуги</th>
      <th>Статус</th><th>Что происходит</th><th class="num">Стоимость</th></tr></thead><tbody>
    ${mine.map(r => { const s = stageBy[r.stageCode];
      const status = r.openRemarks ? 'Требуются уточнения' : s.customerStatusName;
      return `<tr ${r.openRemarks && state.live ? `onclick="openAmend('${r.number}')" style="cursor:pointer"` : ''}>
        <td><b>${r.number}</b><br><span class="ref">от ${fmt(r.createdAt)}</span>
          ${r.openRemarks && state.live ? '<br><span class="chip w">исправить</span>' : ''}</td>
        <td>${esc(r.object)}</td><td>${svcChips(r)}</td>
        <td><span class="chip ${r.openRemarks?'w':s.customerStatus==='done'?'g':'n'}">${status}</span></td>
        <td style="color:var(--muted)">${esc(s.hint)}</td>
        <td class="num">${money(r.amount)}</td></tr>`;
    }).join('')}
    </tbody></table></div></section>
    <div class="note" style="margin-top:14px">
      Заказчик видит семь статусов ТЗ №10, а не внутренние этапы: детализация нужна
      подразделениям Общества, Заказчику — понятное состояние заявки.
    </div>`;
}

/* ====================== РЕЕСТР АМС И ОЦЕНКА ТВ ====================== */
let tv = { inv: 1187, tier: 0, kg: 900, m2: 1.6, kw: 2.5, decision: null };
function renderAms() {
  const f = D.facilities.find(x => x.inv === tv.inv) || D.facilities[0];
  const tier = f.tiers[tv.tier] || f.tiers[0];
  const pct = (a, b) => b ? Math.round(a / b * 100) : null;

  const objAfter = f.load + Number(tv.kg);
  const objPct = pct(objAfter, f.passportLoad);
  const tierAfter = tier.load + Number(tv.kg);
  const tierPct = pct(tierAfter, tier.cap);
  const powerAfter = +(f.powerUsed + Number(tv.kw)).toFixed(1);
  const powerOk = powerAfter <= f.powerInput;
  const unknown = f.passportLoad === null || tier.cap === null;

  let verdict;
  if (unknown) verdict = ['w', 'Паспортные данные неполны',
    'В мастер-файле не заполнены паспортные значения (Приложение 8 помечено [ЗАПОЛНИТЬ]). ' +
    'Требуется запрос в филиал либо поверочный расчёт — решение принимает инженер (п. 16.4).'];
  else if ((objPct ?? 0) > 100 || (tierPct ?? 0) > 100) verdict = ['r', 'Техническая возможность отсутствует',
    `Превышение паспортной нагрузки: ${tierPct > 100 ? 'ярус ' + tier.h + ' м — ' + tierPct + ' %' : 'объект — ' + objPct + ' %'}. ` +
    'Готовится мотивированный отказ в срок 2 рабочих дня (табл. 1).'];
  else if (!powerOk) verdict = ['r', 'Недостаточно электрической мощности',
    `Свободно ${(f.powerInput - f.powerUsed).toFixed(1)} кВт, требуется ${tv.kw} кВт. ` +
    'Запрос в филиал служебной запиской, срок ответа 3 рабочих дня (п. 10).'];
  else verdict = ['g', 'Расчёт выполнен',
    `Объект после размещения — ${objPct} %, ярус ${tier.h} м — ${tierPct} %, мощность ${powerAfter} из ${f.powerInput} кВт. ` +
    'Решение о необходимости поверочного расчёта принимает инженер: числовой порог Регламентом не установлен (п. 16.4).'];

  return `<div class="tv">
    <div>
      <section class="panel" style="margin-bottom:16px"><div class="panel-body" style="padding:0 6px">
        <table><thead><tr><th>Инв. №</th><th>Объект</th><th>Тип, высота</th>
          <th>Загрузка, кг</th><th>Мощность, кВт</th><th>Версия</th><th>Проверка</th></tr></thead><tbody>
        ${D.facilities.map(x => { const p = x.passportLoad ? Math.round(x.load / x.passportLoad * 100) : null;
          return `<tr onclick="tv.inv=${x.inv};tv.tier=0;tv.decision=null;render()"
            style="cursor:pointer;${x.inv===f.inv?'background:#F0F4FC':''}">
            <td><b>${x.inv}</b></td>
            <td>${esc(x.name)}<br><span class="ref">${esc(x.branch)}</span></td>
            <td>${esc(x.kind)}, ${x.height} м</td>
            <td style="min-width:130px">${x.load.toLocaleString('ru-RU')} / ${x.passportLoad ? x.passportLoad.toLocaleString('ru-RU') : '<span class="ref">[не заполнено]</span>'}
              ${p !== null ? `<div class="meter ${p>=95?'r':p>=85?'w':''}"><i style="width:${Math.min(100,p)}%"></i></div>` : ''}</td>
            <td>${x.powerUsed} / ${x.powerInput}</td>
            <td>${esc(x.version)}</td>
            <td>${fmt(x.checkedAt)}</td></tr>`;
        }).join('')}
        </tbody></table></div></section>

      <section class="panel"><div class="panel-head"><div><h2>${esc(f.name)}</h2>
        <p>инв. № ${f.inv} · ${esc(f.branch)} · версия мастер-файла ${esc(f.version)}</p></div>
        <button class="btn sm" style="margin-left:auto">Запросить изменение</button></div>
        <div class="panel-body">
          <div class="form-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
            ${f.tiers.map((t, i) => `<div class="tier ${i===tv.tier?'on':''}" onclick="tv.tier=${i};render()">
              <b>Ярус ${t.h} м</b>
              <span class="ref">${t.load.toLocaleString('ru-RU')} / ${t.cap ? t.cap.toLocaleString('ru-RU') + ' кг' : '[не заполнено]'}</span>
              ${t.cap ? `<div class="meter ${t.load/t.cap>=.95?'r':t.load/t.cap>=.85?'w':''}">
                <i style="width:${Math.min(100,Math.round(t.load/t.cap*100))}%"></i></div>` : ''}
            </div>`).join('')}
          </div>
          <table><thead><tr><th>Арендатор</th><th>Оборудование</th><th class="num">кг</th>
            <th class="num">м²</th><th class="num">кВт</th><th>ТУ</th></tr></thead><tbody>
          ${f.tenants.map(t => `<tr><td>${esc(t.c)}</td><td>${esc(t.eq)}</td>
            <td class="num">${t.kg}</td><td class="num">${t.m2}</td><td class="num">${t.kw}</td>
            <td>${esc(t.tu)}</td></tr>`).join('')}
          </tbody></table>
          <div class="note" style="margin-top:14px">
            Изменения вносит только СП ЦА, ответственное за технический учёт активов (п. 12);
            коммерческий блок правит свои поля, остальным доступно чтение.
            Режим ведения реестра — организационное решение по п. 15.
          </div>
        </div></section>
    </div>

    <aside>
      <section class="panel" style="position:sticky;top:18px">
        <div class="panel-head"><div><h2>Оценка технической возможности</h2>
          <p>Раздел 4 Регламента · п. 16.2</p></div></div>
        <div class="panel-body">
          <div class="field"><label>Ярус размещения</label>
            <select onchange="tv.tier=+this.value;render()">
              ${f.tiers.map((t, i) => `<option value="${i}" ${i===tv.tier?'selected':''}>
                ${t.h} м — свободно ${t.cap ? (t.cap - t.load).toLocaleString('ru-RU') + ' кг' : 'не определено'}</option>`).join('')}
            </select></div>
          <div class="form-grid" style="grid-template-columns:repeat(3,1fr)">
            <div class="field"><label>Масса, кг</label>
              <input type="number" value="${tv.kg}" oninput="tv.kg=+this.value||0;render()"></div>
            <div class="field"><label>Парусность, м²</label>
              <input type="number" step="0.1" value="${tv.m2}" oninput="tv.m2=+this.value||0;render()"></div>
            <div class="field"><label>Мощность, кВт</label>
              <input type="number" step="0.1" value="${tv.kw}" oninput="tv.kw=+this.value||0;render()"></div>
          </div>
          <div class="kv" style="margin:6px 0 2px;font-size:13px">
            <b>Объект после</b><span>${objAfter.toLocaleString('ru-RU')} / ${f.passportLoad ? f.passportLoad.toLocaleString('ru-RU') : '—'} кг${objPct!==null?` · ${objPct} %`:''}</span>
            <b>Ярус после</b><span>${tierAfter.toLocaleString('ru-RU')} / ${tier.cap ? tier.cap.toLocaleString('ru-RU') : '—'} кг${tierPct!==null?` · ${tierPct} %`:''}</span>
            <b>Мощность после</b><span>${powerAfter} / ${f.powerInput} кВт</span>
          </div>
          <div class="verdict ${verdict[0]}"><b>${verdict[1]}</b>${verdict[2]}</div>

          <div class="field" style="margin-top:14px">
            <label>Решение инженера о поверочном расчёте (п. 16.4)</label>
            <select onchange="tv.decision=this.value;render()">
              <option value="" ${!tv.decision?'selected':''}>— не зафиксировано —</option>
              <option value="not_required" ${tv.decision==='not_required'?'selected':''}>Не требуется</option>
              <option value="required" ${tv.decision==='required'?'selected':''}>Требуется — запросить филиал</option>
              <option value="done" ${tv.decision==='done'?'selected':''}>Выполнен, решения подтверждены</option>
            </select>
            <div class="hint">Числовой порог Регламентом не установлен, система его не задаёт</div>
          </div>

          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            <button class="btn primary sm" ${verdict[0]==='g' && (tv.decision==='not_required'||tv.decision==='done') ? '' : 'disabled'}>
              Зафиксировать ТВ и версию реестра</button>
            <button class="btn sm">СЗ в филиал</button>
          </div>
          <div class="ref" style="margin-top:10px">
            Результат сохраняется в заявке с указанием версии мастер-файла ${esc(f.version)} (п. 16.5) —
            без этого переход к КП заблокирован.
          </div>
        </div></section>
    </aside>
  </div>`;
}

/* Полоса режима: видно, рабочие это данные или примеры. */
function modeBar() {
  if (state.live) {
    const who = state.me ? `${esc(state.me.fullName)} · ${state.me.roles.map((r) => esc(ROLE_LABEL[r] || r)).join(', ')}` : '';
    return `<div class="mode-bar live">${icon('check', 17)}
      <div><b>Рабочие данные</b><span> · заявки и файлы сохраняются в системе</span></div>
      <div class="tail">${who}</div>
    </div>`;
  }
  return `<div class="mode-bar">${icon('warn', 17)}
    <div><b>Демонстрационный режим</b>
      <span> · примеры заявок и документов; сервер недоступен, изменения не сохраняются</span></div>
    <div class="tail">${icon('refresh', 14)} данные не сохраняются</div>
  </div>`;
}

/* Шапка портала Заказчика с полным фирменным знаком. */
function portalIntro() {
  return `<div class="portal-intro">
    <img src="${A.logo}" alt="АО «Казтелерадио»">
    <div>
      <h2>Заявка на услуги ОР ПСД</h2>
      <p>Технические условия, проектно-сметная документация и строительно-монтажные работы
         на объектах АО «Казтелерадио». Форма подскажет, какие исходные данные нужны
         для выбранной услуги.</p>
    </div>
    <div class="portal-steps">
      ${[['01','Выберите услуги','ТУ, ПСД или СМР — можно вместе'],
         ['02','Заполните данные','Форма покажет только нужные поля'],
         ['03','Отслеживайте заявку','Номер, статус и замечания в кабинете']]
        .map(([n,t,d]) => `<div><span>${n}</span><div><b>${t}</b><small>${d}</small></div></div>`).join('')}
    </div>
  </div>`;
}

function render() {
  renderNav();
  document.getElementById('brandMark').src = A.mark;
  document.getElementById('bellBtn').innerHTML =
    icon('bell', 17) + (D.requests.filter(r => daysLeft(r.dueAt) < 0).length
      ? `<b style="color:var(--bad);margin-left:5px">${D.requests.filter(r => daysLeft(r.dueAt) < 0).length}</b>` : '');
  document.getElementById('exportBtn').innerHTML = icon('download', 16) + '<span>Выгрузить</span>';
  const newBtn = document.getElementById('newBtn');
  newBtn.innerHTML = icon('plus', 16) + '<span>Новая заявка</span>';
  newBtn.style.display = can('request.create') ? '' : 'none';
  const [t, sub] = TITLES[view];
  document.getElementById('title').textContent = t;
  document.getElementById('subtitle').textContent = sub;
  document.getElementById('eyebrow').textContent =
    ['rules', 'stages'].includes(view) ? 'ОРПСД-Р-01 · РЕДАКЦИЯ 2'
    : ['new', 'mine'].includes(view) ? 'АО «КАЗТЕЛЕРАДИО» · ПОРТАЛ ЗАКАЗЧИКА'
    : 'ОТДЕЛ РАЗРАБОТКИ ПСД';
  const portal = ['new', 'mine'].includes(view);
  const withoutBar = ['rules', 'stages'];
  const head = portal ? portalIntro() : withoutBar.includes(view) ? '' : modeBar();

  if (state.loading) {
    document.getElementById('view').innerHTML = head + skeleton();
    return;
  }
  let body;
  try {
    body = ({ board: renderBoard, bottlenecks: renderBottlenecks, registry: renderRegistry,
      archive: renderArchive, rules: renderRules, stages: renderStages,
      new: renderWizard, mine: renderMine, ams: renderAms,
      assignments: renderAssignments, memos: renderMemos,
    })[view]();
  } catch (error) {
    body = `<div class="blocked"><b>Не удалось отобразить раздел.</b> ${esc(error.message)}</div>`;
  }
  document.getElementById('view').innerHTML =
    head + (state.error ? errorBanner(state.error) : '') + body;
}

/** Заглушка на время загрузки: экран не должен мигать пустотой. */
function skeleton() {
  return `<div class="panel"><div class="panel-body" style="display:flex;align-items:center;gap:12px">
    <span class="spinner"></span><span style="color:var(--muted)">Загрузка данных…</span>
  </div></div>`;
}

function errorBanner(text) {
  return `<div class="blocked" style="margin-bottom:16px">
    <b>Ошибка.</b> ${esc(text)}
    <button class="btn sm" style="margin-left:12px" onclick="reloadCurrent()">Повторить</button>
  </div>`;
}

async function reloadCurrent() {
  state.loaded.delete(view);
  state.error = null;
  state.loading = true;
  render();
  try { await loadView(view, true); }
  catch (error) { state.error = describeError(error); }
  finally { state.loading = false; render(); }
}

boot();
</script>
</body>
</html>

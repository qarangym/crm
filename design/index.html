<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM ОР ПСД — дизайн-прототип</title>
<style>
:root{
  /* Палитра перенесена из действующего прототипа QTR CRM и старого прототипа доски. */
  --blue:#003399; --blue-deep:#00246B; --blue-hover:#0045D9; --yellow:#FFCC00;
  --ink:#17243B; --muted:#6B7280; --muted-2:#9CA3AF;
  --line:#E6EAF1; --bg:#F3F5F9; --surface:#FFFFFF;
  --ok:#0E9F6E; --warn:#D98A00; --bad:#D6323C;
  --tint:#EDF2FB; --tint-2:#EAF0FC;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(23,36,59,.06), 0 8px 24px rgba(23,36,59,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--blue);text-decoration:none}
button{font:inherit;cursor:pointer}

/* ------------------------------- каркас ------------------------------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand img{width:46px;height:auto;flex:none;border-radius:7px}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand small{color:var(--muted);font-size:11.5px}
.side-label{font-size:10.5px;letter-spacing:.09em;color:var(--muted-2);font-weight:700;padding:14px 8px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:var(--r-sm);
  background:transparent;color:var(--ink);text-align:left;font-size:14px}
.nav button:hover{background:var(--tint)}
.nav button.on{background:var(--blue);color:#fff}
.nav button .i{flex:none;color:var(--muted)}
.nav button:hover .i{color:var(--blue)}
.nav button.on .i{color:var(--yellow)}
.nav button .badge{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--bad);color:#fff;
  border-radius:20px;padding:1px 7px}
.nav button.on .badge{background:rgba(255,255,255,.22)}

/* Иконки наследуют цвет текста и выравниваются по базовой линии подписи. */
.i{flex:none;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;gap:7px}
.btn .i{color:currentColor;opacity:.85}

.main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--surface);border-bottom:1px solid var(--line);padding:16px 26px;
  display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.top .eyebrow{font-size:10.5px;letter-spacing:.09em;color:var(--muted-2);font-weight:700}
.top h1{font-size:23px;margin-top:2px}
.top p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.top .sp{flex:1}
.wrap{padding:22px 26px 44px}

/* ------------------------------ элементы ------------------------------ */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:8px 14px;font-size:13.5px;font-weight:600}
.btn:hover{border-color:#C9D3E4;background:#FAFBFE}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.panel-head h2{font-size:16px}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.panel-body{padding:18px}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;
  font-size:11.5px;font-weight:700;background:var(--tint);color:var(--blue);white-space:nowrap}
.chip.g{background:#E7F6EF;color:var(--ok)}
.chip.w{background:#FDF3E2;color:var(--warn)}
.chip.r{background:#FBEAEB;color:var(--bad)}
.chip.n{background:#F1F3F7;color:var(--muted)}
.chip.svc-tu{background:#E8EEFB;color:var(--blue)}
.chip.svc-psd{background:#EFEAFB;color:#5B3FBF}
.chip.svc-smr{background:#FFF6DA;color:#8A6500}

.ref{font-size:11.5px;color:var(--muted-2)}
.ref.pin{display:inline-block;border:1px dashed #D6DEEC;border-radius:6px;padding:1px 6px;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.05em;color:var(--muted-2);font-weight:700;
  padding:10px 12px;border-bottom:1px solid var(--line);text-transform:uppercase}
td{padding:11px 12px;border-bottom:1px solid #F1F4F9;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFE}
.num{text-align:right;font-variant-numeric:tabular-nums}

.meter{height:6px;border-radius:20px;background:#EDF0F6;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue);border-radius:20px}
.meter.w i{background:var(--warn)} .meter.r i{background:var(--bad)} .meter.g i{background:var(--ok)}

/* -------------------------------- доска -------------------------------- */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
select,input[type=search]{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;
  font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);min-width:150px}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.col{flex:0 0 262px;background:#EEF1F7;border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:9px}
.col-head{display:flex;align-items:flex-start;gap:8px;padding:2px 4px 8px}
.col-head .no{width:20px;height:20px;border-radius:6px;background:var(--surface);color:var(--muted);
  display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.col-head b{font-size:13px;display:block;line-height:1.3}
.col-head .sla{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.col-head .owner{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;
  background:var(--surface);border-radius:20px;padding:1px 7px;color:var(--blue)}
.col-head .cnt{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted);
  background:var(--surface);border-radius:20px;padding:1px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer;
  box-shadow:0 1px 2px rgba(23,36,59,.05)}
.card:hover{border-color:#BFCDE6;transform:translateY(-1px)}
.card .id{display:flex;align-items:center;gap:6px;justify-content:space-between;margin-bottom:6px}
.card .id b{font-size:12px;letter-spacing:.01em}
.card .cust{font-size:13.5px;font-weight:600;line-height:1.3}
.card .obj{font-size:12px;color:var(--muted);margin-top:3px}
.card .foot{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.card.late{border-left:3px solid var(--bad)}
.card.warn{border-left:3px solid var(--warn)}
.col-empty{color:var(--muted-2);font-size:12.5px;text-align:center;padding:14px 0}
.owner-customer{background:#FFF6DA;color:#8A6500}

/* ------------------------------ показатели ----------------------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow)}
.kpi .big{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .big small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
.kpi span{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}

.bar-row{display:grid;grid-template-columns:200px 1fr 92px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #F1F4F9}
.bar-row:last-child{border-bottom:0}
.bar-row .lbl b{font-size:13px;display:block}
.bar-row .lbl small{font-size:11px;color:var(--muted-2)}
.track{position:relative;height:22px;background:#F1F4F9;border-radius:6px;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--blue);opacity:.85}
.track .norm{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.track .norm::after{content:'норматив';position:absolute;top:-14px;left:4px;font-size:9.5px;color:var(--muted);white-space:nowrap}
.bar-row .val{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.bar-row .val small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.hot i{background:var(--bad)} .mid i{background:var(--warn)}

/* ------------------------------- карточка ------------------------------ */
.sheet{position:fixed;inset:0;background:rgba(15,23,40,.35);display:none;z-index:40}
.sheet.on{display:block}
.sheet-panel{position:absolute;right:0;top:0;bottom:0;width:min(720px,94vw);background:var(--bg);
  overflow:auto;box-shadow:-12px 0 40px rgba(15,23,40,.18)}
.sheet-head{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 22px;position:sticky;top:0;z-index:2}
.sheet-head .row{display:flex;align-items:center;gap:10px}
.sheet-head h2{font-size:19px}
.sheet-body{padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:168px 1fr;gap:8px 14px;font-size:13.5px}
.kv b{color:var(--muted);font-weight:600}
.route{display:flex;gap:4px;margin:12px 0 4px;flex-wrap:wrap}
.route i{flex:1;min-width:14px;height:6px;border-radius:20px;background:#E4E9F2}
.route i.done{background:var(--blue);opacity:.45}
.route i.cur{background:var(--blue)}
.route i.skip{background:#EFF2F7;border:1px dashed #D8DFEA;height:6px}
.gate{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--surface)}
.gate h4{font-size:13px;margin-bottom:9px}
.gate .item{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px;border-bottom:1px solid #F4F6FA}
.gate .item:last-child{border-bottom:0}
.gate .item .st{width:17px;height:17px;border-radius:5px;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#fff;background:var(--bad);margin-top:1px}
.gate .item.ok .st{background:var(--ok)}
.gate .item .tx{flex:1}
.gate .item .tx small{display:block;color:var(--muted-2);font-size:11px;margin-top:1px}
.blocked{background:#FBEAEB;border:1px solid #F3CFD1;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#8B2A2F}
.hist{display:flex;flex-direction:column}
.hist .e{display:grid;grid-template-columns:118px 1fr;gap:12px;font-size:12.5px;padding:8px 0;border-bottom:1px solid #F4F6FA}
.hist .e time{color:var(--muted-2)}
.hist .e:last-child{border-bottom:0}

/* ------------------------------- правила ------------------------------- */
.tog{width:34px;height:19px;border-radius:20px;background:#D9DFEA;position:relative;display:inline-block;flex:none}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--blue)} .tog.on::after{left:17px}
.note{background:var(--tint);border-left:3px solid var(--blue);border-radius:0 9px 9px 0;
  padding:11px 14px;font-size:12.5px;color:#2B3B57}
.hidden{display:none}

/* --------------------------- мастер заявки --------------------------- */
.wizard{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
@media(max-width:1180px){.wizard{grid-template-columns:1fr}}
.steps{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.steps div{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--muted)}
.steps div .n{width:20px;height:20px;border-radius:50%;background:#E7ECF5;color:var(--muted);
  display:grid;place-items:center;font-size:11px;font-weight:800}
.steps div.cur{border-color:var(--blue);color:var(--blue);font-weight:700}
.steps div.cur .n{background:var(--blue);color:#fff}
.steps div.passed{color:var(--ok);border-color:#CCEADC}
.steps div.passed .n{background:var(--ok);color:#fff}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .span2{grid-column:1/-1}
@media(max-width:760px){.form-grid{grid-template-columns:1fr}}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
.field textarea{min-height:74px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--tint-2);border-color:var(--blue)}
.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--bad);background:#FFFBFB}
.field .err{display:none;font-size:11.5px;color:var(--bad);margin-top:4px}
.field.bad .err{display:block}
.field .hint{font-size:11.5px;color:var(--muted-2);margin-top:4px}
.field .ok-mark{float:right;color:var(--ok);font-size:11.5px;font-weight:700}

.svc-pick{display:flex;gap:10px;flex-wrap:wrap}
.svc-pick label{flex:1;min-width:190px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;
  background:var(--surface);cursor:pointer;display:flex;gap:11px;align-items:flex-start}
.svc-pick label.on{border-color:var(--blue);background:var(--tint);box-shadow:0 0 0 1px var(--blue) inset}
.svc-pick input{margin-top:3px}
.svc-pick b{display:block;font-size:14px}
.svc-pick small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.svc-block{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:14px}
.svc-block>header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.svc-block>div{padding:16px}

.price{position:sticky;top:18px}
.price .line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #F1F4F9;font-size:13px}
.price .line:last-of-type{border-bottom:0}
.price .line small{display:block;color:var(--muted-2);font-size:11px}
.price .total{display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--line);margin-top:8px;padding-top:11px;font-size:15px;font-weight:800}
.price .disclaimer{background:#FDF3E2;border-radius:9px;padding:10px 12px;font-size:11.5px;color:#7A5200;margin-top:12px}

.review-grid{display:grid;grid-template-columns:200px 1fr;gap:9px 16px;font-size:13.5px}
.review-grid b{color:var(--muted);font-weight:600}

/* --------------------------- реестр АМС и ТВ --------------------------- */
.tv{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media(max-width:1180px){.tv{grid-template-columns:1fr}}
.tier{border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.tier.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.tier b{font-size:13.5px}
.tier .ref{display:block;margin:3px 0 7px}
.verdict{border-radius:11px;padding:13px 15px;font-size:13px;margin-top:14px;border:1px solid}
.verdict b{display:block;margin-bottom:4px;font-size:13.5px}
.verdict.g{background:#F0FAF5;border-color:#CCEADC;color:#0B6E4F}
.verdict.w{background:#FDF7EC;border-color:#F2DFBD;color:#7A5200}
.verdict.r{background:#FDF2F2;border-color:#F3CFD1;color:#8B2A2F}

/* --------------------------- полоса режима --------------------------- */
/* Элемент действующего прототипа: постоянно видно, рабочие это данные или примеры. */
.mode-bar{display:flex;align-items:center;gap:11px;border-radius:var(--r);padding:11px 16px;margin-bottom:18px;
  border:1px solid #F2DFBD;background:linear-gradient(180deg,#FEFAF1,#FDF5E7)}
.mode-bar .i{color:var(--warn)}
.mode-bar b{font-size:13px;color:#7A5200}
.mode-bar span{font-size:12.5px;color:#8A6500;opacity:.85}
.mode-bar .tail{margin-left:auto;font-size:11.5px;color:#8A6500;display:flex;align-items:center;gap:6px}

/* --------------------------- шапка портала --------------------------- */
.portal-intro{display:flex;gap:26px;align-items:center;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 26px;margin-bottom:18px;box-shadow:var(--shadow)}
.portal-intro img{width:104px;height:auto;flex:none}
.portal-intro h2{font-size:19px;margin-bottom:5px}
.portal-intro p{margin:0;color:var(--muted);font-size:13.5px;max-width:560px}
.portal-steps{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.portal-steps div{display:flex;gap:9px;align-items:flex-start;background:var(--tint);border-radius:11px;
  padding:11px 14px;min-width:172px}
.portal-steps span{font-size:11px;font-weight:800;color:var(--blue);opacity:.55}
.portal-steps b{display:block;font-size:12.5px}
.portal-steps small{color:var(--muted);font-size:11.5px}
@media(max-width:1180px){.portal-intro{flex-wrap:wrap}.portal-steps{margin-left:0;width:100%}}

/* --------------------------- замечания --------------------------- */
.remark{display:flex;gap:10px;align-items:flex-start;border:1px solid #F2DFBD;background:#FDF7EC;
  border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:8px}
.remark .fld{font-weight:700;color:#7A5200;white-space:nowrap}

/* ------------------ состояния загрузки и уведомления ------------------ */
.mode-bar.live{border-color:#CCEADC;background:linear-gradient(180deg,#F4FBF7,#EDF8F2)}
.mode-bar.live .i{color:var(--ok)}
.mode-bar.live b{color:#0B6E4F}
.mode-bar.live span,.mode-bar.live .tail{color:#137A59}

.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);
  border-top-color:var(--blue);display:inline-block;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  display:none;align-items:center;gap:9px;max-width:min(680px,92vw);
  background:var(--ink);color:#fff;border-radius:11px;padding:12px 16px;font-size:13.5px;
  box-shadow:0 10px 30px rgba(15,23,40,.28)}
.toast .i{color:var(--yellow);flex:none}
.toast.good{background:#0E6B4C}
.toast.good .i{color:#A8E6C9}
.toast.bad{background:#8B2A2F}
.toast.bad .i{color:#FFD3D5}

.btn:disabled{opacity:.55;cursor:progress}
.row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img id="brandMark" alt="QTR — АО «Казтелерадио»">
      <div><b>CRM ОР ПСД</b><small>Отдел разработки ПСД</small></div>
    </div>
    <div class="side-label">РАБОЧЕЕ ПРОСТРАНСТВО</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-label">ПОРТАЛ ЗАКАЗЧИКА</div>
    <nav class="nav" id="navPortal"></nav>
    <div class="side-label">РЕГЛАМЕНТ</div>
    <nav class="nav" id="nav2"></nav>
  </aside>

  <main class="main">
    <header class="top">
      <div>
        <div class="eyebrow" id="eyebrow">ОТДЕЛ РАЗРАБОТКИ ПСД</div>
        <h1 id="title">Доска заявок</h1>
        <p id="subtitle"></p>
      </div>
      <div class="sp"></div>
      <button class="btn" title="Показать просроченные" aria-label="Просроченные заявки"
        onclick="go('bottlenecks')" id="bellBtn"></button>
      <button class="btn" id="exportBtn"></button>
      <button class="btn primary" id="newBtn" onclick="wiz=null;go('new')"></button>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheet-panel" id="sheetPanel"></div>

/* Остаток срока в рабочих днях — та же логика, что в src/domain/calendar.ts */
function daysLeft(due) {
  const a = new Date(today() + 'T12:00:00Z'), b = new Date(due + 'T12:00:00Z');
  const back = b < a; const from = back ? b : a, to = back ? a : b;
  let n = 0; const cur = new Date(from);
  while (cur < to) { cur.setUTCDate(cur.getUTCDate() + 1);
    if (![0,6].includes(cur.getUTCDay())) n++; }
  return back ? -n : n;
}
function slaChip(r) {
  const n = daysLeft(r.dueAt);
  if (n < 0) return `<span class="chip r">просрочка ${-n} дн.${r.escalationLevel ? ' · эск. ' + r.escalationLevel : ''}</span>`;
  if (n === 0) return '<span class="chip w">срок сегодня</span>';
  if (n <= 3) return `<span class="chip w">${n} дн.</span>`;
  return `<span class="chip g">${n} дн.</span>`;
}
const svcChips = r => r.services.map(s =>

  admin:'ДИТ', records:'Документооборот', orpsd:'ОР ПСД', branch:'Филиал', oko:'ОКО',

/* ----------------------- загрузка данных с сервера ----------------------- */

const iso10 = (v) => (v ? String(v).slice(0, 10) : null);

/**
 * Приведение заявки из API к форме, которую ожидает отрисовка.
 * Так разметка и функции экранов остаются едиными для рабочего и
 * демонстрационного режима.
 */
function adaptRequest(r) {
  return {
    id: r.uuid,
    number: r.number,
    customer: r.counterpartyName,
    object: r.facilityName,
    branch: r.branchName,
    services: r.services || [],
    stageCode: r.stageCode,
    dueAt: iso10(r.dueAt) || today(),
    amount: r.totalAmount === null || r.totalAmount === undefined ? null : Number(r.totalAmount),
    createdAt: iso10(r.createdAt) || today(),
    incomingNumber: r.incomingNumber,
    incomingDate: iso10(r.incomingDate),
    tvStatus: r.tvStatus,
    masterFileVersion: r.masterFileVersion,
    verificationCalc: r.verificationCalcDecision,
    counterpartyId: r.counterpartyId,
    facilityId: r.facilityId,
    // Договор и оплата — по каждой услуге (пп. 21, 32, 48, 59).
    contracts: r.contracts || [],
    freeServices: r.freeServices || [],
    contractNumber: (r.contracts || []).map((c) => c.number).join(', ') || null,
    paidAt: (r.contracts || []).length && r.contracts.every((c) => c.paidAt)
      ? r.contracts.map((c) => c.paidAt).sort().at(-1) : null,
    estimateApproved: r.estimateApproved,
    orderNumber: r.orderNumber,
    transferAct: iso10(r.transferActApprovedDate),
    technicalAvrApproved: r.technicalAvrApproved,
    avrApproved: r.avrApproved,
    avrSentAt: iso10(r.avrSentAt),
    avrObjection: r.avrObjection,
    resultDelivered: r.resultDelivered,
    closingConfirmed: r.closingConfirmed,
    openRemarks: Number(r.openRemarks || 0),
    escalationLevel: Number(r.escalationLevel || 0),
    version: r.version,
    bin: '',
  };
}

function adaptFacility(f) {
  return {
    id: f.id,
    inv: f.inv_no,
    name: f.name,
    branch: f.branch_name,
    branchId: f.branch_id,
    kind: f.kind,
    height: Number(f.height_m || 0),
    // В Приложении 8 часть паспортных значений помечена [ЗАПОЛНИТЬ] — оставляем null.
    passportLoad: f.passport_load_kg === null ? null : Number(f.passport_load_kg),
    powerInput: Number(f.power_input_kw || 0),
    load: 0,
    powerUsed: 0,
    version: f.registry_version || '—',
    checkedAt: today(),
    tiers: [],
    tenants: [],
  };
}

function adaptDocument(d) {
  return {
    id: d.id,
    number: d.number,
    kind: d.kind,
    formCode: d.form_code,
    object: d.facility_name || '—',
    owner: d.owner_name || '—',
    contractor: d.contractor_name || '—',
    branch: d.branch_name || '—',
    docDate: iso10(d.doc_date),
    validUntil: iso10(d.valid_until),
    approved: d.approved,
    version: d.current_version,
    fileName: d.file_name,
  };
}

/** Первичная загрузка: определяем режим и получаем то, что нужно всем экранам. */
async function boot() {
  try {
    C = await api.config();
    state.me = await api.me();
    state.live = true;
  } catch (error) {
    state.loading = false;
    if (error.status === 0) {
      // Сервер недоступен — например, файл открыт прямо с диска.
      // Это нормальный демонстрационный режим на встроенных примерах.
      state.live = false;
      state.error = null;
      render();
      return;
    }
    // Сервер ответил отказом: показывать вместо рабочих данных примеры нельзя —
    // пользователь решит, что видит настоящие заявки.
    renderAccessDenied(error);
    return;
  }

  try {
    D = { requests: [], facilities: [], tariffs: [], documents: [], branches: [], metrics: null };
    await loadView(view, true);
  } catch (error) {
    state.error = error.message;
  } finally {
    state.loading = false;
    render();
  }
}

/** Догрузка данных под конкретный экран. Повторно не запрашиваем. */
async function loadView(target, force = false) {
  if (!state.live) return;
  const need = async (key, loader) => {
    if (!force && state.loaded.has(key)) return;
    await loader();
    state.loaded.add(key);
  };

  const loadRequests = () => need('requests', async () => {
    const { requests } = await api.requests({ limit: 300 });
    D.requests = requests.map(adaptRequest);
    D.branches = [...new Set(D.requests.map((r) => r.branch))].filter(Boolean);
  });

  const loadCounterparties = () => need('counterparties', async () => {
    // Собственник оборудования выбирается из справочника контрагентов:
    // свободный ввод наименования ломает поиск и защиту от дублей.
    const { requests } = await api.requests({ limit: 300 });
    const seen = new Map();
    for (const r of requests) if (!seen.has(r.counterpartyId)) seen.set(r.counterpartyId, r.counterpartyName);
    D.counterparties = [...seen].map(([id, name]) => ({ id, name }));
  });

  const loadFacilities = () => need('facilities', async () => {
    const { facilities } = await api.facilities();
    D.facilities = facilities.map(adaptFacility);
    if (!D.branches.length) D.branches = [...new Set(D.facilities.map((f) => f.branch))];
  });

  if (['board', 'registry', 'mine'].includes(target)) await loadRequests();
  if (target === 'assignments') {
    await need('assignments', async () => {
      const { assignments } = await api.assignments({ status: assignmentFilter });
      D.assignments = assignments;
    });
  }
  if (target === 'memos') {
    await need('memos', async () => {
      const { memos } = await api.memos({ open: memoFilter === 'open' ? 1 : '' });
      D.memos = memos;
    });
  }
  if (target === 'bottlenecks') {
    await loadRequests();
    await need('metrics', async () => { D.metrics = await api.metrics(); });
  }
  if (target === 'archive') {
    await need('documents', async () => {
      const { documents } = await api.documents({ limit: 100 });
      D.documents = documents.map(adaptDocument);
    });
    if (can('documents.upload')) { await loadFacilities(); await loadCounterparties(); }
  }
  if (target === 'ams') {
    await loadFacilities();
    if (D.facilities.length) await loadFacilityDetails(tv.inv || D.facilities[0].inv);
  }
  if (target === 'new') {
    await loadFacilities();
    await need('tariffs', async () => {
      const { tariffs } = await api.tariffs();
      D.tariffs = tariffs.map((t) => ({
        id: t.id, service: t.service, name: t.name, unit: t.unit,
        amount: Number(t.amount), source: t.source,
      }));
    });
  }
}

/** Ярусы и арендаторы объекта — нужны калькулятору ТВ (п. 16.2). */
async function loadFacilityDetails(inv) {
  const facility = D.facilities.find((f) => String(f.inv) === String(inv));
  if (!facility || facility.tiers.length) return;
  const data = await api.facility(facility.id);
  facility.tiers = (data.tiers || []).map((t) => ({
    h: Number(t.height_m),
    cap: t.capacity_kg === null ? null : Number(t.capacity_kg),
    load: Number(t.occupied_kg || 0),
  }));
  facility.tenants = (data.tenants || []).map((t) => ({
    c: t.counterparty_name || '—',
    eq: t.equipment || '—',
    kg: Number(t.weight_kg || 0),
    m2: Number(t.windage_m2 || 0),
    kw: Number(t.power_kw || 0),
    tu: t.tu_number || '—',
  }));
  // Текущая загрузка объекта — сумма по ярусам, как в мастер-файле.
  facility.load = facility.tiers.reduce((sum, t) => sum + t.load, 0);
  facility.powerUsed = facility.tenants.reduce((sum, t) => sum + t.kw, 0);
}

/**
 * Экран отказа в доступе.
 * Показывается, когда сервер доступен, но вход не выполнен либо учётная запись
 * не заведена: подменять это демонстрационными данными нельзя — пользователь
 * принял бы примеры за настоящие заявки.
 */
function renderAccessDenied(error) {
  document.getElementById('view').innerHTML = `
    <section class="panel" style="max-width:640px;margin:40px auto">
      <div class="panel-body" style="text-align:center;padding:36px">
        <div style="width:52px;height:52px;border-radius:50%;background:#FBEAEB;color:var(--bad);
          display:grid;place-items:center;margin:0 auto 16px">${icon('warn', 26)}</div>
        <h2 style="font-size:19px">Доступ к системе не предоставлен</h2>
        <p style="color:var(--muted);margin:10px 0 0">${esc(error.message)}</p>
        <div class="note" style="margin-top:20px;text-align:left">
          Роли назначает Департамент информационных технологий. Укажите свою
          рабочую почту и подразделение — администратор заведёт учётную запись
          и выдаст права, предусмотренные для вашей роли.
        </div>
        <button class="btn primary" style="margin-top:18px" onclick="location.reload()">
          ${icon('refresh', 15)} Проверить снова</button>
      </div>
    </section>`;
  document.getElementById('nav').innerHTML = '';
  document.getElementById('navPortal').innerHTML = '';
  document.getElementById('nav2').innerHTML = '';
  document.getElementById('title').textContent = 'Нет доступа';
  document.getElementById('subtitle').textContent = '';
  document.getElementById('brandMark').src = A.mark;
  for (const id of ['bellBtn', 'exportBtn', 'newBtn']) {
    document.getElementById(id).style.display = 'none';
  }
}

/* --------------------------- сообщения и ошибки -------------------------- */

/** Показ ошибки API: нарушения Регламента выводятся со ссылками на пункты. */
function describeError(error) {
  if (!error) return '';
  if (error.failures?.length) {
    return error.failures.map((f) => `${f.message} (${f.regulationRef})`).join('; ');
  }
  if (error.fields) {
    return `${error.message}: ${Object.values(error.fields).join('; ')}`;
  }
  return error.message;
}

let toastTimer = null;
function toast(text, kind = 'info') {
  let box = document.getElementById('toast');
  if (!box) {
    box = document.createElement('div');
    box.id = 'toast';
    document.body.appendChild(box);
  }
  box.className = 'toast ' + kind;
  box.innerHTML = `${icon(kind === 'bad' ? 'warn' : 'check', 16)}<span>${esc(text)}</span>`;
  box.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.style.display = 'none'; }, kind === 'bad' ? 7000 : 3500);
}

/** Обёртка действия: блокирует кнопку, показывает результат, обновляет экран. */
async function act(button, fn, successText) {
  const label = button ? button.innerHTML : null;
  if (button) { button.disabled = true; button.innerHTML = 'Выполняется…'; }
  try {
    const result = await fn();
    if (successText) toast(successText, 'good');
    return result;
  } catch (error) {
    toast(describeError(error), 'bad');
    if (error.isConflict) {
      // Заявку изменил кто-то ещё — перечитываем, чтобы не затереть чужую правку.
      state.loaded.delete('requests');
      await loadView(view, true);
    }
    return null;
  } finally {
    if (button) { button.disabled = false; button.innerHTML = label; }
  }
}

let view = 'board';
let filters = { branch: '', service: '', party: '' };

/** Раздел показывается, только если у роли есть соответствующее право. */
const VIEW_PERMISSION = {
  board: 'request.view', registry: 'request.view', bottlenecks: 'metrics.view',
  ams: 'registry.view', archive: 'documents.view',
  new: 'request.create', mine: 'request.view', assignments: 'assignment.view',
};
function viewAllowed(key) {
  // Служебные записки: ОР ПСД направляет, филиал отвечает (п. 10).
  if (key === 'memos') return can('memo.create') || can('memo.answer');
  const permission = VIEW_PERMISSION[key];
  return !permission || can(permission);
}

function renderNav() {
  const late = (D.requests || []).filter(r => daysLeft(r.dueAt) < 0).length;
  const item = ([k, l, i]) =>
    `<button class="${view===k?'on':''}" onclick="go('${k}')">${icon(i)}<span>${l}</span>` +
    (k === 'board' && late ? `<span class="badge">${late}</span>` : '') + `</button>`;
  document.getElementById('nav').innerHTML = MENU.filter(([k]) => viewAllowed(k)).map(item).join('');
  const portal = MENU_PORTAL.filter(([k]) => viewAllowed(k));
  document.getElementById('navPortal').innerHTML = portal.map(item).join('');
  document.querySelectorAll('.side-label')[1].style.display = portal.length ? '' : 'none';
  document.getElementById('nav2').innerHTML = MENU2.map(item).join('');
}
async function go(v) {
  view = v;
  window.scrollTo(0, 0);
  if (state.live && !state.loaded.has(v)) {
    state.loading = true;
    render();
    try { await loadView(v); state.error = null; }
    catch (error) { state.error = describeError(error); }
    finally { state.loading = false; }
  }
  render();
}

function filtered() {
  return D.requests.filter(r =>
    (!filters.branch || r.branch === filters.branch) &&
    (!filters.service || r.services.includes(filters.service)) &&

/* ----------------------------- узкие места ------------------------------ */
function metrics() {
  // В рабочем режиме медианы и доли нарушений считает сервер по истории этапов:
  // выгружать её целиком в браузер нельзя.
  if (state.live && D.metrics) {
    return D.metrics.stages
      .filter((m) => m.slaValue > 0 && m.completed > 0)
      .map((m) => ({
        ...stageBy[m.stageCode],
        median: m.medianDays,
        ratio: m.slaRatio ?? (m.slaValue ? m.medianDays / m.slaValue : 0),
        n: m.completed,
        breachShare: m.breachShare,
        inProgress: m.inProgress,
      }))
      .sort((a, b) => b.ratio - a.ratio);
  }
  return boardStages.filter(s => s.slaValue > 0).map(s => {
    const samples = D.history.filter(h => h.stageCode === s.code).map(h => h.spent).sort((a,b)=>a-b);
    const median = samples.length ? samples[Math.floor(samples.length/2)] : 0;
    const breached = samples.filter(v => v > s.slaValue).length;
    return { ...s, median, ratio: median / s.slaValue, n: samples.length,
      breachShare: samples.length ? breached / samples.length : 0,
      inProgress: D.requests.filter(r => r.stageCode === s.code).length };
  }).sort((a,b) => b.ratio - a.ratio);
}
function renderBottlenecks() {
  const m = metrics();
  if (!m.length) {
    return `<div class="panel"><div class="panel-body" style="color:var(--muted)">
      Недостаточно данных: показатели считаются по завершённым прохождениям этапов.
      Проведите несколько заявок по маршруту — и здесь появятся медианы против нормативов.
    </div></div>`;
  }
  // Для заголовка берём этап с наибольшим абсолютным превышением норматива:
  // по отношению медианы к нормативу наверх всплывали бы короткие этапы в 1 день.
  const worst = m.slice().sort((a, b) => (b.median - b.slaValue) - (a.median - a.slaValue))[0];
  const rows = D.requests;
  const late = rows.filter(r => daysLeft(r.dueAt) < 0);
  const byParty = {};
  if (state.live && D.metrics) {
    for (const row of D.metrics.byParty) {
      byParty[row.ownerParty] = { total: row.total, late: row.overdue };
    }
  } else {
    rows.forEach(r => {
      const p = stageBy[r.stageCode].ownerParty;
      byParty[p] = byParty[p] || { total: 0, late: 0 };
      byParty[p].total++;
      if (daysLeft(r.dueAt) < 0) byParty[p].late++;
    });
  }
  const max = Math.max(...m.map(x => x.median / x.slaValue));

  return `<div class="kpis">
    <div class="kpi"><div class="big">${rows.length}</div><span>заявок в работе</span></div>
    <div class="kpi"><div class="big" style="color:${late.length?'var(--bad)':'var(--ok)'}">${late.length}</div>
      <span>просрочено · ${rows.filter(r=>r.escalationLevel===2).length} на эскалации 2-го уровня</span></div>
    <div class="kpi"><div class="big">${Math.round((1 - late.length/rows.length)*100)}<small>%</small></div>
      <span>заявок в нормативном сроке</span></div>
    <div class="kpi"><div class="big">${worst.median}<small>дн.</small></div>
      <span>медиана на этапе «${esc(worst.short)}» при нормативе ${worst.slaValue}</span></div>
  </div>

  <div class="grid2">
    <section class="panel">
      <div class="panel-head"><div><h2>Время на этапе против норматива</h2>
        <p>Медиана по завершённым прохождениям. Чёрная риска — норматив Регламента</p></div></div>
      <div class="panel-body">
        ${m.map(x => {
          const cls = x.ratio >= 1.5 ? 'hot' : x.ratio > 1 ? 'mid' : '';
          const w = Math.min(100, x.ratio / max * 100);
          const normPos = Math.min(100, (1 / max) * 100);
          return `<div class="bar-row">
            <div class="lbl"><b>${esc(x.name)}</b><small>${C.ownerParties[x.ownerParty]} · ${esc(x.regulationRef)}</small></div>
            <div class="track ${cls}"><i style="width:${w}%"></i><span class="norm" style="left:${normPos}%"></span></div>
            <div class="val">${x.median} дн.<small>норматив ${x.slaValue}</small></div>
          </div>`;
        }).join('')}
      </div>
    </section>

    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="panel">
        <div class="panel-head"><div><h2>Кто держит срок</h2>
          <p>Просрочки по ответственной стороне</p></div></div>
        <div class="panel-body">
          <table><tbody>
          ${Object.entries(byParty).sort((a,b)=>b[1].late-a[1].late).map(([p, v]) => `
            <tr><td>${C.ownerParties[p]}</td>
              <td style="width:110px"><div class="meter ${v.late/v.total>.4?'r':v.late?'w':'g'}">
                <i style="width:${Math.round(v.late/v.total*100)}%"></i></div></td>
              <td class="num" style="width:74px">${v.late} из ${v.total}</td></tr>`).join('')}
          </tbody></table>
          <div class="note" style="margin-top:12px">
            Без этого разреза отчётность показывает «срывает ОР ПСД», хотя заявка
            стоит в ожидании оплаты Заказчика (п. 86) или приёмки АВР (п. 94).
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><div><h2>Эскалации</h2><p>Пункт 100 Регламента</p></div></div>
        <div class="panel-body">
          <table><tbody>
            <tr><td>1-й уровень — зам. директора филиала</td>
              <td class="num"><b>${rows.filter(r=>r.escalationLevel===1).length}</b></td></tr>
            <tr><td>2-й уровень — курирующий член Правления</td>
              <td class="num"><b style="color:var(--bad)">${rows.filter(r=>r.escalationLevel===2).length}</b></td></tr>
            ${D.metrics?.memos ? `<tr><td>Ответы филиалов на СЗ в срок 3 р.д. <span class="ref">п. 10</span></td>
              <td class="num"><b>${D.metrics.memos.onTimeShare === null ? '—'
                : Math.round(D.metrics.memos.onTimeShare * 100) + ' %'}</b>
                <span class="ref">${D.metrics.memos.onTime} из ${D.metrics.memos.answered}</span></td></tr>
            <tr><td>Просрочено ответов филиалов</td>
              <td class="num"><b style="color:${D.metrics.memos.overdueOpen ? 'var(--bad)' : 'inherit'}">${D.metrics.memos.overdueOpen}</b></td></tr>` : ''}
          </tbody></table>
          <div class="ref" style="margin-top:8px">Эскалируются только сроки филиала: просрочки
            Заказчика, ОР ПСД и бухгалтерии видны в разбивке «Кто держит срок».</div>
        </div>
      </section>
    </div>
  </div>`;
}

async function searchDocuments() {
  if (!state.live) { render(); return; }
  state.loading = true; render();
  try {
    const { documents } = await api.documents({ ...docFilters, limit: 100 });
    D.documents = documents.map(adaptDocument);
    state.error = null;
  } catch (error) {
    state.error = describeError(error);
  } finally {
    state.loading = false; render();
  }
}

async function approveDoc(button, id) {

    'Документ завизирован: правка и удаление закрыты');
  if (ok) await searchDocuments();

async function deleteDoc(button, id, number) {
  if (!state.live) { toast('Демонстрационный режим: удаление не сохраняется'); return; }
  if (!window.confirm(`Удалить невизированную карточку ${number} вместе с файлом?`)) return;

  if (ok) await searchDocuments();
}

  if (!state.live) { toast('Демонстрационный режим: загрузка недоступна', 'bad'); return; }
  const file = document.getElementById('upFile').files[0];
  if (!file) { toast('Выберите файл', 'bad'); return; }

  const form = new FormData();
  form.set('kind', document.getElementById('upKind').value);
  form.set('number', document.getElementById('upNumber').value.trim());
  form.set('facilityId', document.getElementById('upFacility').value);
  form.set('ownerId', document.getElementById('upOwner').value);
  form.set('contractor', document.getElementById('upContractor').value.trim());
  form.set('docDate', document.getElementById('upDate').value);
  const valid = document.getElementById('upValid').value;
  if (valid) form.set('validUntil', valid);
  const formCode = document.getElementById('upForm').value;
  if (formCode) form.set('formCode', formCode);
  const linked = uploadFor;
  if (linked) form.set('requestId', linked.requestId);
  form.set('file', file, file.name);

  const result = await act(button, () => api.uploadDocument(form), 'Документ загружен в архив');
  if (!result) return;
  uploadFor = null;
  state.loaded.delete('documents');
  if (linked) { state.loaded.delete('requests'); await openSheet(sheetRequest.number, true); }
  else { closeSheet(); await searchDocuments(); }
}

/* ------------------------------- карточка -------------------------------- */
function gateItems(r) {
  const s = stageBy[r.stageCode];
  const items = [];
  const add = (ok, text, ref) => items.push({ ok, text, ref });
  if (['registered'].includes(r.stageCode))
    add(!!r.incomingNumber, 'Входящий номер и дата регистрации', 'п. 6');
  if (['tv_review'].includes(r.stageCode)) {
    add(r.tvStatus === 'confirmed', 'Техническая возможность подтверждена', 'п. 16.3');
    add(!!r.masterFileVersion, 'Зафиксирована версия мастер-файла «Реестр АМС и загрузки»', 'п. 16.5');
    add(r.verificationCalc !== 'required', 'Решение о поверочном расчёте', 'п. 16.4');
  }
  if (['offer'].includes(r.stageCode))
    add(!!r.contractNumber, 'Договор либо основание безвозмездной услуги', 'пп. 21, 83');
  if (['awaiting_payment'].includes(r.stageCode)) {
    add(!!r.paidAt, 'Поступление 100 % предварительной оплаты', 'пп. 86, 89');
    if (r.services.includes('СМР')) add(r.estimateApproved, 'Утверждённая сметная документация', 'пп. 49, 53');
  }
  if (['smr_prep'].includes(r.stageCode)) {
    add(!!r.transferAct, 'Завизированный акт приёма-передачи оборудования', 'п. 58');
    add(!!r.orderNumber, 'Распоряжение на выполнение СМР', 'п. 60');
  }
  if (['avr'].includes(r.stageCode)) add(r.avrApproved, 'Технический акт выполненных работ', 'пп. 66, 70');
  if (['closing'].includes(r.stageCode))
    add(false, 'Подтверждение Заказчика либо истечение 10 рабочих дней молчания', 'п. 94');
  if (!items.length) add(true, 'Дополнительных условий перехода нет', s.regulationRef);
  return items;
}
/* Замечания к полям формы: основание возврата заявки на доработку (ТЗ №11). */
/* ------------------------------ карточка заявки --------------------------- */

/**
 * Замечания к полям формы (ТЗ №11).
 * В рабочем режиме перечень отправляется на сервер одной операцией: возврат без
 * единого замечания там не принимается. В демонстрационном — копятся локально.
 */
let sheetCard = null;     // полная карточка из API: услуги, история, переходы
let sheetRequest = null;  // строка заявки из списка
let draftRemarks = [];    // подготовленные замечания до отправки

/**
 * Поля, к которым привязывается замечание. Ключи совпадают с ключами проверки
 * формы (`services.0.weight`): когда Заказчик исправит поле, сервер сам снимет
 * замечание. Замечание общего характера снимает ОР ПСД вручную.
 */
const PARAM_LABEL = {
  scope: 'Состав и объём работ', equipment: 'Оборудование', quantity: 'Количество',
  power: 'Потребляемая мощность', weight: 'Масса оборудования', windage: 'Парусность',
  height: 'Высота размещения', area: 'Площадь размещения', length: 'Протяжённость кабеля',
  route: 'Маршрут кабеля', designTask: 'Задание на проектирование', channel: 'Телерадиоканал',
  signalType: 'Тип сигнала', deliveryPoint: 'Точка доведения сигнала', bitrate: 'Информационная скорость',
  basisReference: 'Основание для СМР',
};
const GENERAL_REMARKS = ['Приложения к заявке', 'Реквизиты Заказчика', 'Общее'];
function remarkFields() {
  const services = (sheetCard?.services || []).slice().sort((a, b) => a.service.localeCompare(b.service));
  const out = [{ key: 'facilityId', label: 'Объект размещения' }];
  services.forEach((s, i) => {
    for (const key of [...Object.keys(s.params || {}), ...(s.service === 'СМР' ? ['basisReference'] : [])]) {
      out.push({ key: `services.${i}.${key}`, label: `${s.service} · ${PARAM_LABEL[key] || key}` });
    }
  });
  for (const g of GENERAL_REMARKS) out.push({ key: g, label: g + ' (снимает ОР ПСД)' });
  return out;
}
const remarkLabel = (key) => remarkFields().find((f) => f.key === key)?.label || key;

function addRemark() {
  const field = document.getElementById('rmField').value;
  const text = document.getElementById('rmText').value.trim();
  if (!text) { toast('Укажите, что именно исправить', 'bad'); return; }
  draftRemarks.push({ field, text });
  renderSheet();
}
function removeRemark(i) { draftRemarks.splice(i, 1); renderSheet(); }

async function returnToCustomer(button) {
  if (!draftRemarks.length) return;
  if (!state.live) {
    sheetRequest.openRemarks = draftRemarks.length;
    draftRemarks = [];
    closeSheet(); render();
    return;
  }
  const ok = await act(button, () => api.addRemarks(sheetRequest.id, draftRemarks),
    'Заявка возвращена Заказчику с перечнем замечаний');
  if (ok) {
    draftRemarks = [];
    closeSheet();
    await reloadCurrent();
  }
}

/** Переход по этапу. Условия проверяет сервер — ответ показываем дословно. */
async function doTransition(button, to, needsReason) {
  let reason = null;
  if (needsReason) {
    reason = window.prompt('Укажите причину и перечень необходимых исправлений:');
    if (!reason || !reason.trim()) { toast('Без указания причины переход невозможен', 'bad'); return; }
  }
  if (!state.live) { toast('Демонстрационный режим: переход не сохраняется'); return; }

  const body = { to, version: sheetRequest.version };
  if (reason) body.reason = reason.trim();
  // Закрытие по оферте и приёмка по молчанию требуют явного подтверждения оператора.
  if (to === 'closed_expired') body.offerExpired = true;
  if (to === 'closed_done') body.silenceAccepted = true;

  const result = await act(button, () => api.transition(sheetRequest.id, body), 'Этап изменён');
  if (result) {
    closeSheet();
    await reloadCurrent();
  }
}

/** Регистрация делопроизводством: входящий номер и дата (п. 6). */
async function saveRegistration(button) {
  const incomingNumber = document.getElementById('regNumber').value.trim();
  const incomingDate = document.getElementById('regDate').value;

/** Фиксация оценки ТВ с версией мастер-файла (п. 16.5). */
async function saveTv(button) {
  const status = document.getElementById('tvStatus').value;

async function openSheet(number, keepOpen = false) {
  sheetRequest = D.requests.find((x) => x.number === number);
  if (!sheetRequest) return;
  if (!keepOpen) draftRemarks = [];
  document.getElementById('sheet').classList.add('on');

  if (state.live) {
    document.getElementById('sheetPanel').innerHTML =
      `<div class="sheet-head"><div class="row"><h2>${esc(number)}</h2>
        <button class="btn ghost" style="margin-left:auto" onclick="closeSheet()">${icon('close', 16)}</button>
      </div></div><div class="sheet-body">${skeleton()}</div>`;
    try {
      sheetCard = await api.request(sheetRequest.id);
      // Список мог устареть: берём актуальную версию карточки для проверки версии.
      sheetRequest = { ...sheetRequest, ...adaptRequest(sheetCard.request) };
    } catch (error) {
      document.getElementById('sheetPanel').innerHTML =
        `<div class="sheet-body">${errorBanner(describeError(error))}</div>`;
      return;
    }
  } else {
    sheetCard = null;
  }
  renderSheet();
}

function renderSheet() {
  const r = sheetRequest;
  const s = stageBy[r.stageCode];
  const route = C.stages.filter((x) => !x.terminal);

  // В рабочем режиме условия перехода считает сервер — они уже пришли с карточкой.
  // Условия основного маршрута: исходы (отказ, расторжение) требуют лишь причины
  // и не блокируют работу. Сводим по тексту — у двух договоров один код, но разные услуги.
  const items = sheetCard
    ? [...new Map(sheetCard.transitions.filter((t) => !t.to.startsWith('closed')).flatMap((t) => t.failures)
        .map((f) => [f.code + f.message, { ok: false, text: f.message, ref: f.regulationRef }])).values()]
    : gateItems(r);
  if (sheetCard && !items.length) {
    items.push({ ok: true, text: 'Все условия текущего этапа выполнены', ref: s.regulationRef });

  const blocked = items.filter((i) => !i.ok);

  const myRoles = state.live ? (state.me?.roles ?? []) : null;

  const services = sheetCard?.services ?? [];
  const remarks = sheetCard?.remarks ?? [];
  const history = sheetCard?.events ?? [];

  document.getElementById('sheetPanel').innerHTML = `
  <div class="sheet-head">
    <div class="row">

      <button class="btn ghost" onclick="closeSheet()" aria-label="Закрыть">${icon('close', 16)}</button>
    </div>
    <div class="route">
      ${route.map((x) => {
        const skip = x.serviceScope && !r.services.includes(x.serviceScope);
        const cls = skip ? 'skip' : x.order < s.order ? 'done' : x.order === s.order ? 'cur' : '';

      }).join('')}
    </div>
    <div class="ref">Этап ${s.order} из ${route.length}: ${esc(s.name)} · норматив ${esc(s.slaText)} ·
      отвечает ${esc(C.ownerParties[s.ownerParty])} · ${esc(s.regulationRef)}</div>
  </div>
  <div class="sheet-body">
    ${blocked.length ? `<div class="blocked"><b>Переход невозможен.</b> ${blocked.map((b) =>
      esc(b.text) + ' (' + esc(b.ref) + ')').join('; ')}</div>` : ''}

    <div class="gate">
      <h4>Условия перехода по Регламенту</h4>
      ${items.map((i) => `<div class="item ${i.ok ? 'ok' : ''}">
        <span class="st">${i.ok ? '✓' : '!'}</span>
        <span class="tx">${esc(i.text)}<small>${esc(i.ref)}</small></span></div>`).join('')}
    </div>

    <section class="panel"><div class="panel-body">
      <div class="kv">
        <b>Заказчик</b><span>${esc(r.customer)}</span>
        <b>Объект</b><span>${esc(r.object)}</span>
        <b>Филиал</b><span>${esc(r.branch)} <span class="ref">определён по объекту, Приложение 7</span></span>
        <b>Услуги</b><span>${svcChips(r)}</span>

        <b>Регистрация</b><span>${r.incomingNumber

        <b>Оценка ТВ</b><span>${r.tvStatus === 'confirmed'

              ${e.result === 'denied' ? '<span class="chip r" style="margin-left:6px">отказ</span>' : ''}

/** Ввод реквизитов регистрации — доступен делопроизводству до направления на ТВ. */
function registrationBlock(r) {
  if (r.incomingNumber || !can('request.register') || r.stageCode !== 'registered') return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Регистрация заявки</h2>
      <p>Входящий номер и дата — пункт 6 Регламента</p></div></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="field"><label>Входящий номер</label>
          <input id="regNumber" placeholder="вх-1201"></div>
        <div class="field"><label>Дата регистрации</label>
          <input id="regDate" type="date" value="${today()}" max="${today()}"></div>
      </div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:10px">
        <button class="btn primary sm" onclick="saveRegistration(this)">Сохранить реквизиты</button>
        <span class="ref">Без них заявка не уходит на оценку технической возможности</span>
      </div>
    </div></section>`;
}

/** Фиксация оценки ТВ — доступна ОР ПСД на этапе оценки. */
function tvBlock(r) {
  if (!can('request.tv') || r.stageCode !== 'tv_review') return '';
  const opt = (value, label, current) =>
    `<option value="${value}" ${current === value ? 'selected' : ''}>${label}</option>`;
  return `<section class="panel">
    <div class="panel-head"><div><h2>Оценка технической возможности</h2>
      <p>Результат фиксируется с версией мастер-файла — пункт 16.5</p></div></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="field"><label>Результат</label>
          <select id="tvStatus">
            ${opt('pending', 'Не проверена', r.tvStatus)}
            ${opt('confirmed', 'Подтверждена', r.tvStatus)}
            ${opt('unavailable', 'Отсутствует', r.tvStatus)}
          </select></div>
        <div class="field"><label>Версия мастер-файла «Реестр АМС и загрузки»</label>
          <input id="tvVersion" value="${esc(r.masterFileVersion || '')}" placeholder="2026-09-01"></div>
        <div class="field span2"><label>Решение о поверочном расчёте (п. 16.4)</label>
          <select id="tvCalc">
            <option value="">— не зафиксировано —</option>
            ${opt('not_required', 'Не требуется', r.verificationCalc)}
            ${opt('required', 'Требуется — запросить филиал', r.verificationCalc)}
            ${opt('done', 'Выполнен, решения подтверждены', r.verificationCalc)}
          </select>
          <div class="hint">Числовой порог Регламентом не установлен, система его не задаёт</div>
        </div>
      </div>
      <div style="margin-top:12px">
        <button class="btn primary sm" onclick="saveTv(this)">Зафиксировать оценку</button>
      </div>
    </div></section>`;
}

function closeSheet() { document.getElementById('sheet').classList.remove('on'); }

/* --------------------- договоры и оплата по услугам (A1) --------------------- */

/** Сводка договоров: по каждой услуге — номер и оплата (пп. 21, 32, 48, 86). */
function contractsSummary(r) {
  if (!state.live) {
    return r.contractNumber
      ? `${esc(r.contractNumber)} · ${r.paidAt ? '<span class="chip g">оплачен</span>' : '<span class="chip n">не оплачен</span>'}`
      : '<span class="ref">не заключены</span>';
  }
  return r.services.map((s) => {
    if ((r.freeServices || []).includes(s)) return `<div>${s} — <span class="ref">безвозмездно, п. 20</span></div>`;
    const c = (r.contracts || []).find((x) => x.service === s);
    if (!c) return `<div>${s} — <span class="ref">договора нет</span></div>`;
    return `<div>${s} — ${esc(c.number)} ${c.paidAt
      ? `<span class="chip g">оплата ${fmt(c.paidAt)}</span>` : '<span class="chip n">не оплачен</span>'}</div>`;
  }).join('');
}

function contractsBlock(r) {
  if (!state.live || !can('request.contract') || stageBy[r.stageCode].terminal) return '';
  if (r.tvStatus !== 'confirmed') return '';
  const contracts = (sheetCard?.contracts || []).filter((c) => c.status !== 'terminated');
  const withoutContract = r.services.filter((s) =>
    !(r.freeServices || []).includes(s) && !contracts.some((c) => c.service === s));
  return `<section class="panel">
    <div class="panel-head"><div><h2>Договоры и оплата</h2>
      <p>Свой договор и 100 % оплата на каждую услугу — пп. 21, 32, 48, 86. СМР — после утверждения сметы, п. 53</p></div></div>
    <div class="panel-body">
      ${contracts.length ? `<table><thead><tr><th>Услуга</th><th>Договор</th><th>Подписан</th>
        <th class="num">Сумма</th><th>Оплата</th></tr></thead><tbody>
        ${contracts.map((c) => `<tr><td>${esc(c.service)}</td><td><b>${esc(c.number)}</b></td>
          <td>${c.signed_at ? fmt(c.signed_at) : '—'}</td>
          <td class="num">${c.amount === null ? '—' : money(Number(c.amount))}</td>
          <td>${c.paid_at ? `<span class="chip g">100 % · ${fmt(c.paid_at)}</span>`
            : `<div style="display:flex;gap:6px;align-items:center">
                <input type="date" id="pay-${c.id}" value="${today()}" max="${today()}" style="width:150px">
                <button class="btn primary sm" onclick="payContract(this,'${c.id}')">Оплата поступила</button></div>`}</td></tr>`).join('')}
        </tbody></table>` : '<div class="ref" style="margin-bottom:10px">Договоров пока нет.</div>'}
      ${withoutContract.length ? `<div class="form-grid" style="margin-top:14px">
        <div class="field"><label>Услуга</label>
          <select id="ctService">${withoutContract.map((s) => `<option>${s}</option>`).join('')}</select>
          ${withoutContract.includes('СМР') && !r.estimateApproved
            ? '<div class="hint">Договор на СМР — после утверждения сметы (п. 53)</div>' : ''}</div>
        <div class="field"><label>Номер договора</label><input id="ctNumber" placeholder="ДП-101/26"></div>
        <div class="field"><label>Сумма, ₸</label><input id="ctAmount" inputmode="decimal"></div>
        <div class="field"><label>Дата подписания</label><input id="ctSigned" type="date" max="${today()}"></div>
        <div class="field"><label>Дата счёта</label><input id="ctInvoice" type="date" max="${today()}"></div>
      </div>
      <div style="margin-top:12px"><button class="btn primary sm" onclick="addContract(this)">Зарегистрировать договор</button></div>` : ''}
    </div></section>`;
}

async function addContract(button) {
  const body = {
    service: document.getElementById('ctService').value,
    number: document.getElementById('ctNumber').value.trim(),
    amount: document.getElementById('ctAmount').value.trim() || null,
    signedAt: document.getElementById('ctSigned').value || null,
    invoiceAt: document.getElementById('ctInvoice').value || null,
  };
  const ok = await act(button, () => api.addContract(sheetRequest.id, body), 'Договор зарегистрирован');
  if (ok) { state.loaded.delete('requests'); await openSheet(sheetRequest.number, true); }
}

async function payContract(button, contractId) {
  const paidAt = document.getElementById('pay-' + contractId).value;
  const ok = await act(button, () => api.payContract(contractId, paidAt), 'Поступление оплаты зафиксировано');
  if (ok) { state.loaded.delete('requests'); await openSheet(sheetRequest.number, true); }
}

/* ------------- реквизиты, от которых зависят переходы (A1, A6) ------------- */

function closingBlock(r) {
  if (!state.live || !can('request.contract') || stageBy[r.stageCode].terminal) return '';
  const orpsd = hasRole('orpsd', 'admin');
  const rows = [];
  if (orpsd && (r.services.includes('ПСД') || r.services.includes('СМР')) &&
      ['offer', 'awaiting_payment', 'psd', 'tu'].includes(r.stageCode)) {
    rows.push(`<div style="display:flex;gap:10px;align-items:center">
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${r.estimateApproved ? 'checked' : ''}
        onchange="saveFlags(this, { estimateApproved: this.checked })"> Сметная документация утверждена</label>
      <span class="ref pin">пп. 41, 52</span></div>`);
  }
  if (orpsd && r.services.includes('СМР') && ['smr_prep'].includes(r.stageCode)) {
    rows.push(`<div style="display:flex;gap:10px;align-items:center">
      <input id="flOrder" value="${esc(r.orderNumber || '')}" placeholder="№ распоряжения" style="max-width:200px">
      <button class="btn sm" onclick="saveFlags(this, { orderNumber: document.getElementById('flOrder').value })">Сохранить распоряжение</button>
      <span class="ref pin">п. 60</span></div>`);
  }
  if (orpsd && ['tu', 'psd'].includes(r.stageCode)) {
    rows.push(`<div style="display:flex;gap:10px;align-items:center">
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${r.resultDelivered ? 'checked' : ''}
        onchange="saveFlags(this, { resultDelivered: this.checked })"> Результат утверждён и передан Заказчику</label>
      <span class="ref pin">пп. 24, 42</span></div>`);
  }
  if (r.stageCode === 'avr') {
    rows.push(`<div style="display:flex;gap:10px;align-items:center">
      <input type="date" id="flAvrSent" value="${r.avrSentAt || today()}" max="${today()}" style="width:160px">
      <button class="btn sm" ${r.avrApproved ? '' : 'disabled title="Сначала загрузите и завизируйте АВР"'}
        onclick="saveFlags(this, { avrSentAt: document.getElementById('flAvrSent').value })">АВР и ЭСФ направлены</button>
      <span class="ref pin">пп. 91–92</span></div>`);
  }
  if (r.stageCode === 'closing') {
    rows.push(`<div class="ref">АВР направлен ${r.avrSentAt ? fmt(r.avrSentAt) : '—'}. Без подтверждения и
      мотивированных замечаний в течение 10 рабочих дней работы считаются принятыми (п. 94).</div>`);
    rows.push(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="btn primary sm" onclick="saveFlags(this, { closingConfirmed: true })">Заказчик подтвердил приёмку</button>
      <input id="flObjection" value="${esc(r.avrObjection || '')}" placeholder="Мотивированные замечания Заказчика" style="flex:1;min-width:220px">
      <button class="btn sm" onclick="saveFlags(this, { avrObjection: document.getElementById('flObjection').value })">
        ${r.avrObjection ? 'Обновить замечания' : 'Зафиксировать замечания'}</button>
      ${r.avrObjection ? `<button class="btn ghost sm" onclick="saveFlags(this, { avrObjection: null })">Замечания урегулированы</button>` : ''}
    </div>`);
  }
  if (!rows.length) return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Реквизиты этапа</h2>
      <p>Каждое изменение пишется в журнал со ссылкой на пункт</p></div></div>
    <div class="panel-body" style="display:flex;flex-direction:column;gap:12px">${rows.join('')}</div></section>`;
}

async function saveFlags(control, body) {
  const ok = await act(control.tagName === 'BUTTON' ? control : null,
    () => api.setFlags(sheetRequest.id, { ...body, version: sheetRequest.version }), 'Сохранено');
  if (ok) { state.loaded.delete('requests'); await openSheet(sheetRequest.number, true); }
  else if (control.type === 'checkbox') control.checked = !control.checked;
}

/* ------------------------ акты по заявке (пп. 58, 66, 91) ------------------------ */

function documentsBlock(r) {
  if (!state.live || !can('documents.upload') || stageBy[r.stageCode].terminal) return '';
  const buttons = [];
  const branch = hasRole('branch', 'admin');
  const orpsd = hasRole('orpsd', 'admin');
  if (branch && r.stageCode === 'smr_prep') buttons.push(['Акт приема-передачи', 'Акт приёма-передачи оборудования', 'п. 58']);
  if (branch && r.stageCode === 'smr') buttons.push(['Технический АВР', 'Технический АВР', 'п. 66']);
  if (orpsd && r.stageCode === 'avr') buttons.push(['АВР', 'АВР (Р-1 / № 2В)', 'пп. 70, 91']);
  if (!buttons.length) return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Документы этапа</h2>
      <p>Акт привязывается к заявке; переход открывается после визирования</p></div></div>
    <div class="panel-body" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      ${buttons.map(([kind, label, ref]) => `<button class="btn sm" onclick="openUploadFor('${kind}')">
        ${icon('filePlus', 15)}Загрузить: ${label}</button><span class="ref pin">${ref}</span>`).join('')}
    </div></section>`;
}

/* ---------------------- служебные записки в филиал (A3) ---------------------- */

function memosBlock(r) {
  if (!state.live) return '';
  const memos = sheetCard?.memos || [];
  const canCreate = can('memo.create') && !stageBy[r.stageCode].terminal;
  if (!memos.length && !canCreate) return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Служебные записки в филиал</h2>
      <p>Ответ филиала — не позднее 3 рабочих дней, п. 10; просрочка эскалируется по п. 100</p></div></div>
    <div class="panel-body">
      ${memos.map(memoRow).join('')}
      ${canCreate ? `<div class="form-grid" style="margin-top:12px">
        <div class="field span2"><label>Тема</label><input id="mmSubject" placeholder="Загрузка яруса 35 м"></div>
        <div class="field span2"><label>Запрос</label>
          <textarea id="mmBody" rows="3" placeholder="Какая информация требуется от филиала"></textarea></div>
      </div>
      <div style="margin-top:10px"><button class="btn primary sm" onclick="createMemo(this)">Направить в ${esc(r.branch)}</button></div>` : ''}
    </div></section>`;
}

function memoRow(m) {
  const late = !m.answered_at && m.due_at < today();
  return `<div class="remark" style="flex-direction:column;align-items:stretch;gap:6px;border-color:var(--line);background:#FAFBFE">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <b>${esc(m.subject || 'Служебная записка')}</b>
      <span class="ref">${esc(m.request_number || '')} · ${esc(m.branch_name || '')} · срок ${fmt(m.due_at)}</span>
      <span style="margin-left:auto">${m.answered_at ? '<span class="chip g">ответ получен</span>'
        : late ? `<span class="chip r">просрочен${m.escalation_level ? ' · эск. ' + m.escalation_level : ''}</span>`
        : '<span class="chip w">ожидает ответа</span>'}</span>
    </div>
    <div style="color:var(--ink)">${esc(m.body)}</div>
    ${m.answered_at ? `<div class="note">${esc(m.answer)}<br><span class="ref">${esc(m.answered_by_name || '')}</span></div>`
      : can('memo.answer') ? `<div style="display:flex;gap:8px">
          <input id="ans-${m.id}" placeholder="Ответ филиала по существу запроса" style="flex:1">
          <button class="btn primary sm" onclick="answerMemo(this,'${m.id}')">Ответить</button></div>` : ''}
  </div>`;
}

async function createMemo(button) {
  const body = { subject: document.getElementById('mmSubject').value.trim(), body: document.getElementById('mmBody').value.trim() };
  const ok = await act(button, () => api.createMemo(sheetRequest.id, body), 'Служебная записка направлена в филиал');
  if (ok) await openSheet(sheetRequest.number, true);
}

async function answerMemo(button, memoId) {
  const answer = document.getElementById('ans-' + memoId).value.trim();
  const ok = await act(button, () => api.answerMemo(memoId, answer), 'Ответ зафиксирован');
  if (!ok) return;
  if (document.getElementById('sheet').classList.contains('on') && sheetRequest) await openSheet(sheetRequest.number, true);
  else { state.loaded.delete('memos'); await reloadCurrent(); }
}

/* --------------------------- продление срока (пп. 33, 45) --------------------------- */

function extensionBlock(r) {
  if (!state.live || !can('request.extend') || stageBy[r.stageCode].terminal) return '';
  const current = sheetCard?.currentStage;
  if (!current || !current.dueAt || stageBy[r.stageCode].ownerParty === 'customer') return '';
  return `<section class="panel">
    <div class="panel-head"><div><h2>Продление срока этапа</h2>
      <p>${r.stageCode === 'psd' ? 'ПСД — не более 15 рабочих дней с письменным уведомлением Заказчика, п. 33'
        : 'Только по договору или дополнительному соглашению, пп. 45, 64'}</p></div></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="field"><label>Рабочих дней</label><input id="exDays" type="number" min="1" max="15" value="5"></div>
        <div class="field"><label>Основание</label><input id="exReason" placeholder="Уведомление Заказчика исх. № …"></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:10px;align-items:center">
        <button class="btn sm" onclick="extendStage(this)">Продлить срок</button>
        <span class="ref">Текущий срок ${fmt(String(current.dueAt).slice(0, 10))}${current.extendedBy ? ` · уже продлён на ${current.extendedBy} р.д.` : ''}</span>
      </div>
    </div></section>`;
}

async function extendStage(button) {
  const body = { days: Number(document.getElementById('exDays').value), reason: document.getElementById('exReason').value.trim() };
  const ok = await act(button, () => api.extendStage(sheetRequest.id, body), 'Срок этапа продлён');
  if (ok) { state.loaded.delete('requests'); await openSheet(sheetRequest.number, true); }
}

async function resolveRemark(button, remarkId) {
  const note = window.prompt('Основание снятия замечания (необязательно):') ?? '';
  const ok = await act(button, () => api.resolveRemark(sheetRequest.id, remarkId, note), 'Замечание снято');
  if (ok) { state.loaded.delete('requests'); await openSheet(sheetRequest.number, true); }
}

/* ======================== ПОРУЧЕНИЯ (ТЗ №7, №8) ======================== */

let assignmentFilter = 'active';
const ASSIGNMENT_STATUS = { open: ['Новое', 'w'], in_progress: ['В работе', 'n'], done: ['Исполнено', 'g'], cancelled: ['Снято', 'n'] };

function renderAssignments() {
  if (!state.live) {
    return `<div class="note">Поручения доступны в рабочем режиме: они создаются при регистрации заявки
      и несут все её сведения (ТЗ №7, №8).</div>`;
  }
  const rows = D.assignments || [];
  return `<div class="filters">
    <select onchange="assignmentFilter=this.value;state.loaded.delete('assignments');reloadCurrent()">
      ${[['active', 'Действующие'], ['done', 'Исполненные'], ['all', 'Все']].map(([v, l]) =>
        `<option value="${v}" ${assignmentFilter === v ? 'selected' : ''}>${l}</option>`).join('')}
    </select>
    <span class="ref">Поручений: ${rows.length}</span>
    <a class="btn sm" style="margin-left:auto" href="${api.assignmentsExportUrl()}">${icon('download', 14)}Выгрузка для ОКО (CSV)</a>
  </div>
  <section class="panel"><div class="panel-body" style="padding:0 6px">
    <table><thead><tr><th>Заявка</th><th>Заказчик и объект</th><th>Услуги</th><th>Поручено</th>
      <th>Срок</th><th>Статус</th><th></th></tr></thead><tbody>
    ${rows.length ? rows.map((a) => {
      const p = a.payload || {};
      const [label, cls] = ASSIGNMENT_STATUS[a.status] || [a.status, 'n'];
      const overdue = ['open', 'in_progress'].includes(a.status) && a.due_at && a.due_at < today();
      return `<tr>
        <td><b>${esc(a.request_number)}</b><br><span class="ref">${p.registeredAt ? fmt(String(p.registeredAt).slice(0, 10)) : ''}</span></td>
        <td><b>${esc(p.customer?.name_full || '—')}</b><br><span class="ref">БИН ${esc(p.customer?.bin || '—')} · ${esc(p.facility?.name || '')}</span></td>
        <td>${(p.services || []).map((s) => `<span class="chip svc-${({'ТУ':'tu','ПСД':'psd','СМР':'smr'})[s.service]}">${esc(s.service)}</span>`).join('')}
          <br><span class="ref">${p.estimate ? money(Number(p.estimate)) : 'стоимость по смете'}</span></td>
        <td>${esc(a.department)}${a.assignee_name ? `<br><span class="ref">${esc(a.assignee_name)}</span>` : ''}</td>
        <td>${a.due_at ? fmt(a.due_at) : '—'}${overdue ? '<br><span class="chip r">просрочено</span>' : ''}</td>
        <td><span class="chip ${cls}">${label}</span>${a.close_note ? `<br><span class="ref">${esc(a.close_note)}</span>` : ''}</td>
        <td><div class="row-actions">
          ${a.status === 'open' && can('assignment.accept') ? `<button class="btn primary sm" onclick="acceptAssignment(this,'${a.id}')">Принять в работу</button>` : ''}
          ${['open', 'in_progress'].includes(a.status) && can('assignment.close') ? `<button class="btn sm" onclick="closeAssignment(this,'${a.id}')">Закрыть</button>` : ''}
        </div></td></tr>`;
    }).join('') : '<tr><td colspan="7" style="padding:22px;text-align:center;color:var(--muted-2)">Поручений нет</td></tr>'}
    </tbody></table></div></section>
  <div class="note" style="margin-top:14px">
    Поручение создаётся при регистрации заявки в одной операции с ней и хранит сведения на момент
    регистрации: Заказчика, объект, услуги, исходные данные, приложения и предварительную стоимость.
    Выгрузка заменяет обмен с приложением «Контроль и мониторинг» в HCL Notes — ТЗ, раздел 5.
  </div>`;
}

async function acceptAssignment(button, id) {
  const ok = await act(button, () => api.acceptAssignment(id), 'Поручение принято в работу');
  if (ok) { state.loaded.delete('assignments'); await reloadCurrent(); }
}

async function closeAssignment(button, id) {
  const note = window.prompt('Результат исполнения поручения:');
  if (!note || !note.trim()) { toast('Укажите результат исполнения', 'bad'); return; }
  const ok = await act(button, () => api.closeAssignment(id, { note: note.trim() }), 'Поручение закрыто');
  if (ok) { state.loaded.delete('assignments'); await reloadCurrent(); }
}

let amend = null;

async function openAmend(number) {
  sheetRequest = D.requests.find((x) => x.number === number);
  if (!sheetRequest || !state.live) return;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheetPanel').innerHTML = `<div class="sheet-body">${skeleton()}</div>`;
  try {
    sheetCard = await api.request(sheetRequest.id);
    sheetRequest = { ...sheetRequest, ...adaptRequest(sheetCard.request) };
    if (!(D.facilities || []).length) {
      const { facilities } = await api.facilities().catch(() => ({ facilities: [] }));
      D.facilities = facilities.map(adaptFacility);
    }
  } catch (error) {
    document.getElementById('sheetPanel').innerHTML = `<div class="sheet-body">${errorBanner(describeError(error))}</div>`;
    return;
  }
  const services = sheetCard.services.slice().sort((a, b) => a.service.localeCompare(b.service));
  amend = {
    facilityId: sheetRequest.facilityId,
    services: services.map((s) => ({
      service: s.service, placement: s.placement, params: { ...(s.params || {}) },
      tariffId: s.tariff_id, tariffQuantity: s.tariff_quantity, basisReference: s.basis_reference,
    })),
  };
  renderAmend();
}

function amendValue(key) {
  if (key === 'facilityId') return amend.facilityId;
  const m = /^services\.(\d+)\.(.+)$/.exec(key);
  if (!m) return null;
  const item = amend.services[Number(m[1])];
  if (!item) return null;
  return m[2] === 'basisReference' ? item.basisReference : item.params[m[2]];
}

function setAmendValue(key, value) {
  if (key === 'facilityId') { amend.facilityId = value; return; }
  const m = /^services\.(\d+)\.(.+)$/.exec(key);
  if (!m) return;
  const item = amend.services[Number(m[1])];
  const numeric = ['quantity', 'power', 'weight', 'windage', 'height', 'area', 'length', 'bitrate'].includes(m[2]);
  const v = numeric && value !== '' && !Number.isNaN(Number(value.replace(',', '.'))) ? Number(value.replace(',', '.')) : value;
  if (m[2] === 'basisReference') item.basisReference = value; else item.params[m[2]] = v;
}

function renderAmend() {
  const remarks = (sheetCard.remarks || []).filter((m) => !m.resolved_at);
  const fieldRemarks = remarks.filter((m) => m.field_key === 'facilityId' || /^services\.\d+\./.test(m.field_key));
  const general = remarks.filter((m) => !fieldRemarks.includes(m));
  const input = (m) => {
    if (m.field_key === 'facilityId') {
      return `<select onchange="setAmendValue('facilityId', this.value)">${(D.facilities || []).map((f) =>
        `<option value="${f.id}" ${f.id === amend.facilityId ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>`;
    }
    const v = amendValue(m.field_key);
    return `<input value="${esc(v ?? '')}" oninput="setAmendValue('${m.field_key}', this.value)">`;
  };
  document.getElementById('sheetPanel').innerHTML = `
  <div class="sheet-head"><div class="row">
    <div><div class="ref">Требуются уточнения · ТЗ №11</div><h2>${esc(sheetRequest.number)}</h2></div>
    <button class="btn ghost" style="margin-left:auto" onclick="closeSheet()">${icon('close', 16)}</button>
  </div></div>
  <div class="sheet-body">
    <section class="panel"><div class="panel-head"><div><h2>Замечания ОР ПСД</h2>
      <p>Исправьте поля — номер заявки и её история сохраняются</p></div></div>
      <div class="panel-body">
        ${fieldRemarks.map((m) => `<div class="field" style="margin-bottom:12px">
          <label>${esc(remarkLabel(m.field_key))}</label>
          <div class="hint" style="margin:0 0 6px;color:var(--bad)">${esc(m.text)}</div>
          ${input(m)}</div>`).join('')}
        ${general.map((m) => `<div class="remark"><span class="fld">${esc(m.field_key)}</span>
          <span style="flex:1">${esc(m.text)}</span><span class="ref">снимает ОР ПСД после проверки</span></div>`).join('')}
        ${!remarks.length ? '<div class="ref">Все замечания устранены — отправьте заявку повторно.</div>' : ''}
        <div style="display:flex;gap:10px;margin-top:14px">
          ${fieldRemarks.length ? '<button class="btn primary" onclick="saveAmend(this)">Сохранить исправления</button>' : ''}
          <button class="btn ${fieldRemarks.length ? '' : 'primary'}" ${remarks.length ? 'disabled title="Сначала устраните все замечания"' : ''}
            onclick="resubmitRequest(this)">Отправить повторно</button>
        </div>
      </div></section>
  </div>`;
}

async function saveAmend(button) {
  const result = await act(button, () => api.amendRequest(sheetRequest.id, { ...amend, version: sheetRequest.version }),
    'Исправления сохранены');
  if (result) { state.loaded.delete('requests'); await openAmend(sheetRequest.number); }
}

async function resubmitRequest(button) {
  const result = await act(button, () => api.resubmit(sheetRequest.id), 'Заявка отправлена повторно');
  if (result) { closeSheet(); await reloadCurrent(); }
}
